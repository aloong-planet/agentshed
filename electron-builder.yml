# 非商城版(DMG/Windows)appId;MAS 版用 agentshed.aloongplanet.com(上架时在 mas 构建段覆盖)
appId: agentshed.aloong.com
productName: Agentshed

directories:
  output: release/${version}
  buildResources: build

# 打包末尾自动清理:release/ 下只保留最近 5 个版本目录(electron-builder 无内置保留配置,只写不删)。
# .cjs 后缀必需:package.json 是 type:module,普通 .js 会被当 ESM 导致 require 报错。
afterAllArtifactBuild: build/clean-old-releases.cjs

files:
  - out
  - package.json

# Electron Fuses(官方 Security Checklist #19):在打包产物上永久关掉几条提权/调试通道。
# 这些开关只在**打包时**生效,dev 不受影响;关掉后攻击者无法把本 app 的 Electron
# 二进制当通用 Node 跑,也无法用调试端口注入。判据与逐条现状见 docs/ops/electron-security.md。
electronFuses:
  runAsNode: false # 禁 ELECTRON_RUN_AS_NODE(否则本 app 可被当作任意 Node 解释器)
  enableNodeCliInspectArguments: false # 禁 --inspect 等调试参数注入
  enableNodeOptionsEnvironmentVariable: false # 禁 NODE_OPTIONS 注入启动脚本
  onlyLoadAppFromAsar: true # 只从 asar 加载 app,防旁路替换未打包目录
  enableCookieEncryption: true # cookie 落盘加密
  enableEmbeddedAsarIntegrityValidation: true # asar 完整性校验(macOS/Windows)
  # 关掉 file:// 页面的额外特权:本 app 渲染页跑 app://(prod)与 http(dev),
  # 代码内无 file:// 页面加载,故该特权是纯余量。注意它约束的是"从 file:// 加载的
  # **页面**",主进程内 net.fetch(file://…) 读盘是另一条路径——已实测两者均正常。
  grantFileProtocolExtraPrivileges: false

# v1 macOS 先行:本机未签名 DMG(arm64);签名/公证/多架构进遗留清单
mac:
  target:
    - target: dmg
      arch: [arm64]
  identity: null
