<!doctype html>
<!-- A UI prototype · the install/uninstall interaction (hung off the Agents page's Skills tab,
     which is the install source).
     问题:「安装到…」目标选择器、同名阻止、失效项目禁用、卸载确认弹窗各自的形态与时机。
     (原「两侧差异怎么读」已随 skills-view 拆除跨侧 diff 作废,2026-08-07 同步。)
     交互:行内「安装到…」弹选择器(失效项目置灰;装到 Transfer 的 tdd 触发同名阻止);
     下方"项目级副本"区演示卸载确认弹窗(含完整路径)。
     界面语言、明暗与配色跟随设置原型(appearance)与画廊的统一设置所选,本页不设开关:界面文案画了中、英
     两种,其他语言按英文显示并有提示;几个页面共用的文案取自共享文案表 _shared/copy.js;区块标题与说明行是
     评审注解,与 mock 数据一样保持原样。色值取共享主题 _shared/theme.css,本页不自定义 app token。
     app 窗口的根样式在共享件 _shared/app-window.css 里。本页没有演示条。
     2026-10-28 (the fourth side, Antigravity; ADR-0037): the library list gains the GK and AG badge slots (CC CX GK AG,
       as on the Agents page). A target row now shows where the copy will land, one mark per directory: CC for
       .claude/skills, GK for .grok/skills, and for .agents/skills the shared skills directory's mark — one
       outlined group naming the sides that load it (CX AG) — because Codex and Antigravity load that one
       directory: it is one landing and one result, never a Codex landing and an Antigravity landing that
       collide (owner's ruling). Whether a row offers a directory follows the skill's sides that the project is
       registered on; the shared mark itself always names both sides that load the directory, whatever the
       project is registered on (owner's ruling, 2026-10-28: agy-demo, registered on Antigravity only, still
       shows CX AG). A same-name check against the shared directory is made once. The project-level copies gain
       a shared-directory entry, whose uninstall confirmation says the skill goes for every side that loads the
       directory. -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>原型 — 全局库与装卸</title>
<link rel="stylesheet" href="../_shared/theme.css">
<link rel="stylesheet" href="../_shared/app-window.css">
<link rel="stylesheet" href="../_shared/app-rail.css">
<style>
  /* Every app token (surfaces, text, lines, the accent family, the semantic and side colours, the
     floating-surface shadow) comes from _shared/theme.css for each palette and both modes. This page
     defines none of them. */
  *{box-sizing:border-box;margin:0;font-family:-apple-system,"PingFang SC",sans-serif}
  .main{flex:1;min-width:0;overflow:auto;padding:16px 22px}
  h2{font-size:15px;margin-bottom:2px}
  .sub{font-size:11.5px;color:var(--text-2);margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:9px;margin-bottom:20px}
  .it{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--line);position:relative}
  .it:first-child{border-top:0}
  .nm{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;width:200px;flex:none}
  .ds{flex:1;min-width:0;color:var(--text-2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bdg{display:flex;gap:3px;flex:none;width:96px}
  .b{font-size:9px;font-weight:700;border-radius:3px;padding:1px 4px}
  .b.g{background:var(--gk-bg);color:var(--gk-fg)}.b.a{background:var(--ag-bg);color:var(--ag-fg)}
  /* A target row's landings, one mark per directory; the shared skills directory is one outlined group naming
     the sides that load it */
  .pop .lands{margin-left:auto;display:flex;align-items:center;gap:4px;flex:none}
  .pop .shared-land{display:inline-flex;gap:2px;border:1px solid var(--line-strong);border-radius:4px;padding:1px 2px}
  /* Claude 徽章取 Anthropic 品牌橙(--p-anthropic #d97757)的色相,不再是紫:ADR-0021 定的
     「一侧一色、取该侧 provider 色」当时只迁了 Grok,Claude 这半没做。L/C 与 cx/gk 两对同档,
     故 fg-on-bg 对比度也落在同一区间(明 4.50、暗 6.62,既有三对是 4.15–5.19 / 6.39–7.12)。 */
  .b.c{background:var(--cl-bg);color:var(--cl-fg)}.b.x{background:var(--cx-bg);color:var(--cx-fg)}
  .b.miss{border:1px dashed var(--line-strong);color:var(--text-2);background:transparent;font-weight:400}
  .pill{font-size:10px;border-radius:4px;padding:1px 6px;flex:none}
  .pill.ln{border:1px dashed var(--line-strong);color:var(--text-2)}
  .ins{font:inherit;font-size:11.5px;border:1px solid var(--line-strong);background:var(--bg);color:var(--text-2);
    border-radius:6px;padding:3px 10px;cursor:pointer;flex:none}
  .ins:hover{color:var(--accent);border-color:var(--accent)}
  .pop{position:absolute;right:10px;top:calc(100% - 4px);z-index:8;background:var(--card);
    border:1px solid var(--line-strong);border-radius:9px;box-shadow:0 6px 22px var(--float-shadow);
    min-width:230px;padding:6px;display:none}
  .pop.open{display:block}
  .pop .t{font-size:10.5px;color:var(--text-2);padding:4px 8px}
  .pop .p{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:6px;cursor:pointer}
  .pop .p:hover{background:var(--accent-soft)}
  .pop .p.dis{color:var(--text-2);cursor:not-allowed;opacity:.55}
  .pop .p.dis:hover{background:none}
  .pop .why{margin-left:auto;font-size:10px;color:var(--warn-fg)}
  .pop .have{margin-left:auto;font-size:10px;color:var(--text-2)}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:30;display:none;
    border-radius:9px;padding:10px 16px;font-size:12.5px;box-shadow:0 8px 26px rgba(0,0,0,.25)}
  .toast.ok{background:var(--ok-bg);color:var(--ok-fg);border:1px solid var(--ok-fg)}
  .toast.err{background:var(--err-bg);color:var(--err-fg);border:1px solid var(--err-fg)}
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:20}
  .dlg{position:fixed;top:30vh;left:50%;transform:translateX(-50%);width:min(460px,92vw);z-index:21;display:none;
    background:var(--card);border:1px solid var(--line-strong);border-radius:12px;padding:20px 22px}
  .dlg h3{font-size:14px;margin-bottom:8px}
  .dlg p{font-size:12.5px;color:var(--text-2);line-height:1.7;margin-bottom:6px}
  .dlg code{display:block;background:var(--bg);border:1px solid var(--line);border-radius:6px;
    padding:7px 10px;font-size:11.5px;margin:8px 0 14px;word-break:break-all}
  .dlg .btns{display:flex;justify-content:flex-end;gap:8px}
  .dlg button{font:inherit;font-size:12.5px;border-radius:7px;padding:6px 14px;cursor:pointer;border:1px solid var(--line-strong);background:var(--bg);color:var(--text)}
  .dlg button.danger{background:var(--danger-bg);border-color:var(--danger-bg);color:var(--danger-fg)}
  .uheader{display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:12px;color:var(--text-2)}
</style>
<script src="../dimensions.js"></script>
<script src="../demo-dimensions.js" data-follow="language=zh,en mode theme"></script>
<script src="../manifest.js"></script>
<script src="../app-identity.js"></script>
<script src="../_shared/icons.js"></script>
<script src="../_shared/copy.js"></script>
</head>
<body>
<div class="app-window" data-shared-block="app-window">
  <nav class="rail" data-shared-block="app-rail" data-rail-current="agents"></nav>
  <script src="../_shared/app-rail.js"></script>
  <div class="main">
    <h2>Agents · 全局 Skills(安装源 · 合并单列 · 只读,内容变更不经 app)</h2>
    <div class="sub">徽标 = 该侧全局库是否存在;「软链」角标 = 软链(安装时解引用复制为真文件);不做跨侧内容 diff(skills-view 拆除)</div>
    <div class="card" id="lib"></div>

    <h2>Transfer · 项目级副本(演示卸载,实际入口在<span style="color:var(--accent);cursor:pointer" data-goto="project-detail/detail" data-goto-href="../project-detail/prototype-detail.html">项目详情 ↗</span> Skills 分栏)</h2>
    <div class="card">
      <div class="uheader"><span><span data-i18n="secClaudeProject">项目级 · .claude/skills</span>(仅项目级可卸;全局层 skill 无卸载入口)</span></div>
      <div class="it"><span class="nm">ui-design</span><span class="ds">项目专属 UI 走查规范</span>
        <button class="ins" id="uni" data-u="claude" data-i18n="uninstall">卸载</button></div>
    </div>
    <div class="card">
      <div class="uheader"><span><span data-i18n="secShared">共享 · .agents/skills</span> <span class="b x">CX</span> <span class="b a">AG</span>(一处落地,两侧都加载)</span></div>
      <div class="it"><span class="nm">commit-style</span><span class="ds">本仓库的提交信息约定</span>
        <button class="ins" id="uniShared" data-u="shared" data-i18n="uninstall">卸载</button></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="mask" id="mask"></div>
  <div class="dlg" id="dlg"></div>
</div>
<script>
  // ── 界面文案:画了中、英两种(其他语言按英文显示,提示由 demo-dimensions.js 给出)。几个页面共用的
  //    条目取自共享文案表(_shared/copy.js),这里只留本页独有的。区块标题与说明行是评审注解,skill 名、
  //    描述与路径是 mock 数据,都保持原样。 ──
  const T={
    zh:{
      ...SharedCopy.zh,
      pickTarget:'选择目标项目(复制落地)',
      staleDisabled:'失效,禁用', hasSame:'已装同名',
      blocked:(p,s)=>`${p} 已有同名 skill「${s}」,已阻止,不覆盖`,
      installed:(s,p)=>`已安装 ${s} → ${p}((复制落地))`,
      confirmTitle:'卸载项目级 skill?', confirmBody:'将删除以下目录(项目 git 状态由你自行处理;不做副本差异检测):',
      confirmShared:sides=>`这个目录由 ${sides} 共同加载:删除后它们都不再有这个 skill。`,
      installedShared:(s,p,sides)=>`已安装 ${s} → ${p} 的共享目录(复制落地;${sides} 都会加载)`,
      sideJoin:' 与 ',
      sideMismatch:p=>`${p} 不属于该 skill 所在的 agent 侧`,
      cancel:'取消', del:'删除', uninstalled:n=>`已卸载 ${n}`
    },
    en:{
      ...SharedCopy.en,
      pickTarget:'Choose a target project (installed by copy)',
      staleDisabled:'Stale, disabled', hasSame:'Same name installed',
      blocked:(p,s)=>`${p} already has a skill named “${s}” — blocked, nothing was overwritten`,
      installed:(s,p)=>`Installed ${s} → ${p} (by copy)`,
      confirmTitle:'Uninstall the project-level skill?',
      confirmBody:'The following directory will be deleted (handle your project’s git state yourself; no copy-diff check is performed):',
      confirmShared:sides=>`This directory is loaded by ${sides}: once it is deleted, none of them has this skill.`,
      installedShared:(s,p,sides)=>`Installed ${s} → ${p}’s shared directory (by copy; loaded by ${sides})`,
      sideJoin:' and ',
      sideMismatch:p=>`${p} does not belong to the agent side this skill lives on`,
      cancel:'Cancel', del:'Delete', uninstalled:n=>`Uninstalled ${n}`
    }
  };
  // The value in effect now; DemoDimensions.on at the end of this script re-renders on every change
  let LANG=DemoDimensions.get('language');
  function applyI18n(){
    document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent=T[LANG][el.dataset.i18n] });
  }

  // The target project mock: has = a same-named skill is already installed (marked inside the picker);
  // stale is greyed out
  // sides = the sides the project is registered on; has = the same-named skills already landed, keyed by the
  // directory they sit in ('claude' or 'shared' — the shared skills directory is checked once)
  const PROJECTS=[
    {n:'agentshed',stale:false,sides:['c','g'],has:{}},
    {n:'Transfer',stale:false,sides:['c','x','g','a'],has:{claude:['tdd','ui-design'],shared:['commit-style']}},
    {n:'agy-demo',stale:false,sides:['a'],has:{}},
    {n:'openclaw-v3',stale:false,sides:['c','g'],has:{}},
    {n:'New project',stale:true,sides:['x'],has:{}},
  ];
  // c / x / g / a = present in that side's global library
  const LIB=[
    {n:'tdd',ds:'红先于绿,覆盖来自 spec 失败模式节',c:1,x:1,a:1},
    {n:'grilling',ds:'按依赖分批的需求逼问',c:1,x:1,g:1},
    {n:'decision-form',ds:'批量决策外部表单(含渲染器脚本)',c:0,x:1},
    {n:'review-code',ds:'四层法 review',c:1,x:0},
    {n:'github-ops',ds:'GitHub 产出规范(无 AI 署名)',c:1,x:1,ln:true},
    {n:'release-notes',ds:'从 git log 起草发布说明',a:1},
  ];
  // The sides that load the shared skills directory, and their names for a sentence
  const SHARED_SIDES=['x','a'], SIDE_NAME={x:'Codex',a:'Antigravity'};
  const BADGE={c:'<span class="b c">CC</span>',x:'<span class="b x">CX</span>',g:'<span class="b g">GK</span>',a:'<span class="b a">AG</span>'};
  /** Where a skill would land in a project: one entry per directory. The shared skills directory is one landing,
   *  drawn with every side that loads it, whatever the project is registered on — not a Codex landing and an
   *  Antigravity landing */
  function landings(s,p){
    const sides=['c','x','g','a'].filter(k=>s[k]&&p.sides.includes(k));
    const out=[];
    if(sides.includes('c')) out.push({dir:'claude',html:BADGE.c});
    if(sides.some(k=>SHARED_SIDES.includes(k))){
      const loaders=SHARED_SIDES;
      out.push({dir:'shared',loaders,html:`<span class="shared-land" title="${T[LANG].secShared}">${loaders.map(k=>BADGE[k]).join('')}</span>`});
    }
    if(sides.includes('g')) out.push({dir:'grok',html:BADGE.g});
    return out;
  }
  const lib=document.getElementById('lib');
  function renderLib(){
    const t=T[LANG];
    // 重绘不丢已弹出的选择器
    const open=lib.querySelector('.pop.open')?.id;
    const miss='<span class="b miss">—</span>';
    lib.innerHTML=LIB.map((s,i)=>`<div class="it">
      <span class="nm">${s.n}</span>
      <span class="bdg">${['c','x','g','a'].map(k=>s[k]?BADGE[k]:miss).join('')}</span>
      ${s.ln?`<span class="pill ln">${t.pillSymlink}</span>`:''}
      <span class="ds">${s.ds}</span>
      <button class="ins" data-i="${i}">${t.installTo}</button>
      <div class="pop" id="pop-${i}">
        <div class="t">${t.pickTarget}</div>
        ${PROJECTS.map(p=>{
          const lands=landings(s,p);
          const has=lands.some(l=>(p.has[l.dir]||[]).includes(s.n));
          const shared=lands.find(l=>l.dir==='shared');
          return `<div class="p ${p.stale?'dis':''}" data-s="${s.n}" data-p="${p.n}" data-has="${has?1:0}" data-none="${lands.length?0:1}" data-shared="${shared?shared.loaders.map(k=>SIDE_NAME[k]).join(t.sideJoin):''}">
            ${p.n}${p.stale?`<span class="why">${t.staleDisabled}</span>`:has?`<span class="have">${t.hasSame}</span>`:''}
            <span class="lands">${lands.map(l=>l.html).join('')}</span></div>`;
        }).join('')}
      </div>
    </div>`).join('');
    if(open) document.getElementById(open).classList.add('open');
  }
  renderLib();
  // 成败只由底色区分,文案里不带 ✓ / ⚠ —— 产品的 toast 就是这样(app 的 toast 只渲染文本)。
  // 加个记号会让读原型的人以为产品也有。
  // msg 是按当前界面语言出句的函数,语言切换时正在显示的 toast 随之重写
  let toastMsg=null;
  function toast(msg,ok){const t=document.getElementById('toast');
    toastMsg=msg;t.textContent=msg();t.className='toast '+(ok?'ok':'err');t.style.display='block';
    clearTimeout(t._t);t._t=setTimeout(()=>{t.style.display='none';toastMsg=null},2600);}
  document.body.addEventListener('click',e=>{
    const btn=e.target.closest('.ins[data-i]');
    document.querySelectorAll('.pop').forEach(p=>{if(!btn||p.id!=='pop-'+btn.dataset.i)p.classList.remove('open')});
    if(btn){document.getElementById('pop-'+btn.dataset.i).classList.toggle('open');return;}
    const p=e.target.closest('.pop .p');
    if(p){
      if(p.classList.contains('dis'))return;
      p.closest('.pop').classList.remove('open');
      const {p:proj,s:skill}=p.dataset;
      if(p.dataset.none==='1'){toast(()=>T[LANG].sideMismatch(proj),false);}
      else if(p.dataset.has==='1'){toast(()=>T[LANG].blocked(proj,skill),false);}
      else if(p.dataset.shared){const sides=p.dataset.shared;toast(()=>T[LANG].installedShared(skill,proj,sides),true);}
      else{toast(()=>T[LANG].installed(skill,proj),true);}
      return;
    }
  });
  // The uninstall confirmation: show the full path to be deleted
  const mask=document.getElementById('mask'),dlg=document.getElementById('dlg');
  // Which project-level copy the open dialog is about: the Claude one, or the shared directory's
  let UN='claude';
  function renderDlg(){
    const t=T[LANG], shared=UN==='shared', name=shared?'commit-style':'ui-design';
    dlg.innerHTML=`<h3>${t.confirmTitle}</h3>
      <p>${t.confirmBody}</p>
      <code>~/CascadeProjects/Transfer/${shared?'.agents':'.claude'}/skills/${name}/</code>
      ${shared?`<p>${t.confirmShared(SHARED_SIDES.map(k=>SIDE_NAME[k]).join(t.sideJoin))}</p>`:''}
      <div class="btns"><button id="dlg-c">${t.cancel}</button><button class="danger" id="dlg-y">${t.del}</button></div>`;
    document.getElementById('dlg-c').onclick=close;
    document.getElementById('dlg-y').onclick=()=>{close();toast(()=>T[LANG].uninstalled(name),true);};
  }
  document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{
    UN=b.dataset.u;
    mask.style.display='block';dlg.style.display='block';
    renderDlg();
  });
  function close(){mask.style.display='none';dlg.style.display='none'}
  mask.onclick=close;

  // 界面语言跟随设置原型所选:静态文案、列表(含已弹出的选择器)、打开着的确认框与正在显示的 toast 一并重绘
  DemoDimensions.on('language',v=>{
    LANG=v;
    document.documentElement.lang=v==='zh'?'zh-CN':'en';
    applyI18n(); renderLib();
    if(dlg.style.display==='block') renderDlg();
    if(toastMsg) document.getElementById('toast').textContent=toastMsg();
  });
</script>
<script>
  // Cross-prototype navigation: inside the gallery ask the parent page to switch; when opened alone, go to the file directly
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-goto]');
    if (!el) return;
    if (window.parent !== window) parent.postMessage({ type: 'proto-nav', target: el.dataset.goto }, '*');
    else if (el.dataset.gotoHref) location.href = el.dataset.gotoHref;
  });
</script>
</body>
</html>
