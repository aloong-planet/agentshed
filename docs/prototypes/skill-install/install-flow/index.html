<!doctype html>
<!-- Logic 原型页(票06)· 从 prototype skill 的 logic-page-template.html 实例化。
     图源:install-flow.mmd → sync-mmd.mjs → model.mmd.js。
     CSS 与画布/置灰/气泡机制来自模板,勿改。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>原型 — 装卸操作状态机</title>
<style>
  :root{
    --bg:#f7f8f9; --card:#ffffff; --text:#37352f; --text-2:#787774;
    --line:#e8eaed; --line-strong:#d9dce0; --accent:#8a67ab; --accent-soft:#f0ebf6;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#18191b; --card:#1f2124; --text:#e6e6e5; --text-2:#9b9a97;
      --line:#2a2c30; --line-strong:#34373c; --accent:#a084c7; --accent-soft:#2c2733; }
  }
  *{box-sizing:border-box;margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  body{background:var(--bg);color:var(--text);font-size:13px;padding:28px;max-width:860px;margin:0 auto}
  h1{font-size:16px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .tag{font-size:10px;border:1px solid var(--line-strong);border-radius:4px;padding:1px 6px;color:var(--text-2)}
  .q{color:var(--text-2);line-height:1.7;margin-bottom:18px}
  h4{font-size:12px;color:var(--text-2);margin:18px 0 8px}
  .dg{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;overflow-x:auto}
  .dg pre{font-size:12px;white-space:pre-wrap}
  .dg.pan{height:56vh;padding:0;overflow:hidden;position:relative;cursor:grab;touch-action:none;user-select:none;background:#fdfdfd}
  .dg.pan.dragging{cursor:grabbing}
  .dg.pan svg{display:block;transform-origin:0 0;will-change:transform;overflow:visible}
  .dg svg .edgeLabel rect.background{fill:transparent !important}
  .dg svg .edgeLabel text,.dg svg .edgeLabel tspan{font-size:14px}
  .rst{position:absolute;top:8px;right:8px;z-index:2;border:1px solid var(--line-strong);
    background:var(--card);color:var(--text-2);border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer}
  .rst:hover{color:var(--accent);border-color:var(--accent)}
  .hint{font-size:12px;color:var(--text-2);margin-top:14px}
  .drive{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
  .st{display:flex;flex-direction:column;gap:9px;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .st-row{display:flex;align-items:center;gap:10px;font-size:13px}
  .st-row .k{width:96px;color:var(--text-2);font-family:ui-monospace,Menlo,monospace;font-size:12px;flex:none}
  .badge{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;font-weight:600;
    padding:2px 10px;border-radius:5px;border:1px solid transparent}
  .badge.pending{background:#fff6b8;border-color:#e4c800;color:#5c5100}
  .badge.accepted{background:#dbeafe;border-color:#93c5fd;color:#1e40af}
  .badge.done{background:#dcfce7;border-color:#86efac;color:#166534}
  .badge.failed,.badge.rejected{background:#fee2e2;border-color:#fca5a5;color:#991b1b}
  .badge.expired{background:var(--line);border-color:var(--line-strong);color:var(--text-2)}
  .badge.empty{background:transparent;border-color:var(--line-strong);color:var(--text-2);border-style:dashed}
  .val{font-family:ui-monospace,Menlo,monospace;font-size:12px}
  .val.nil{color:var(--text-2);opacity:.7}
  .illegal{margin:12px 0;padding:8px 12px;border-radius:7px;font-size:12.5px;border:1px solid}
  .illegal.ok{color:var(--text-2);border-color:var(--line);background:transparent}
  .illegal.idle{color:var(--text-2);border-color:var(--line);background:transparent;opacity:.6}
  .illegal .ev{font-family:ui-monospace,Menlo,monospace;color:var(--accent);font-weight:600}
  .illegal.bad{color:#991b1b;border-color:#fca5a5;background:#fee2e2}
  @media (prefers-color-scheme:dark){
    .illegal.bad{color:#fca5a5;border-color:#7f1d1d;background:#2a1416}
    .badge.pending{background:#3a3316;border-color:#7a6a1e;color:#f0dd8a}
    .badge.accepted{background:#17263f;border-color:#2c4d80;color:#93c5fd}
    .badge.done{background:#12301d;border-color:#2a6540;color:#86efac}
    .badge.failed,.badge.rejected{background:#2a1416;border-color:#7f1d1d;color:#fca5a5}
  }
  .acts{display:flex;flex-direction:column;gap:10px}
  .grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .grp-t{font-size:11px;color:var(--text-2);width:78px;flex:none;font-family:ui-monospace,Menlo,monospace}
  .acts button{font:inherit;font-size:12.5px;padding:5px 13px;border-radius:6px;cursor:pointer;
    border:1px solid var(--line-strong);background:var(--bg);color:var(--text);transition:.12s}
  .acts button:hover{border-color:var(--accent);color:var(--accent)}
  .acts button:active{transform:translateY(1px)}
  .acts button.ghost{border-style:dashed;color:var(--text-2);margin-left:4px}
  .acts button.ghost:hover{border-style:solid;color:var(--accent)}
  .acts button[aria-disabled="true"]{cursor:not-allowed;border-style:dotted;
    color:var(--text-2);opacity:1;border-color:var(--line);background:transparent}
  .acts button[aria-disabled="true"]:hover{border-color:var(--line-strong);color:var(--text-2)}
  .acts button{position:relative}
  .acts button[data-tip]:hover::after{
    content:attr(data-tip);position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);
    background:#1b1b1f;color:#fff;font-size:11.5px;line-height:1.45;padding:6px 10px;border-radius:6px;
    white-space:nowrap;z-index:20;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.28)}
  .acts button[data-tip]:hover::before{
    content:"";position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);
    border:5px solid transparent;border-top-color:#1b1b1f;z-index:20;pointer-events:none}
  .stress{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:12px;color:var(--text-2);cursor:pointer}
  .stress input{cursor:pointer}
  code.inl{display:inline;background:var(--bg);border:1px solid var(--line);border-radius:4px;
    padding:1px 5px;font-size:11.5px}
  .drive .hint{margin-top:14px;line-height:1.6}
  .dg svg g.node.cur rect,.dg svg g.node.cur polygon,.dg svg g.node.cur circle{
    stroke:var(--accent) !important;stroke-width:2.5px !important}
</style>
</head>
<body>
  <h1>装卸操作状态机 <span class="tag">Logic</span></h1>
  <div class="q">问题(票06):安装的三条防护(同名阻止 / 失效拒绝 / 失败清理)与卸载的确认-删除链
    是否都有明确终局;终局后的迟到回调(重复 copy_ok、二次 confirm)是否被模型静默挡住,
    而不是靠 UI 记得把按钮藏起来。</div>
  <div id="dgs"></div>

  <h4>亲手驾驶(点按钮驱动状态机)</h4>
  <div class="drive">
    <div class="st">
      <div class="st-row"><span class="k">status</span><span id="v-status" class="badge">—</span></div>
      <div class="st-row"><span class="k">操作</span><span id="v-kind" class="val nil">—</span></div>
      <div class="st-row"><span class="k">终局说明</span><span id="v-note" class="val nil">—</span></div>
    </div>
    <div id="v-illegal" class="illegal idle">尚未派发事件</div>
    <div class="acts">
      <div class="grp"><span class="grp-t">入场</span>
        <button data-new="install">发起安装(tdd → agentshed)</button>
        <button data-new="uninstall">发起卸载(项目级副本)</button>
        <button id="btn-reset" class="ghost">↺ 清空</button>
      </div>
      <div class="grp"><span class="grp-t">校验</span>
        <button data-act="target_ok">校验通过</button>
        <button data-act="conflict_found">发现同名</button>
        <button data-act="target_stale">目标失效</button>
      </div>
      <div class="grp"><span class="grp-t">复制</span>
        <button data-act="copy_ok">复制成功</button>
        <button data-act="copy_fail">复制失败</button>
      </div>
      <div class="grp"><span class="grp-t">卸载</span>
        <button data-act="confirm">确认删除</button>
        <button data-act="cancel">取消</button>
        <button data-act="delete_done">删除完成</button>
      </div>
    </div>
    <label class="stress"><input type="checkbox" id="stress"><span>压测模式:解除置灰,允许强行派发非法事件(验证 reducer 防线真的挡得住)</span></label>
    <p class="hint">按钮的可用性由 <code class="inl">legal(state)</code> 从模型派生——置灰即"当前状态不可达",悬停看原因。图上高亮的是当前状态。</p>
  </div>

<script src="../../vendor/mermaid.min.js"></script>
<script src="./model.mmd.js"></script>
<script src="./logic.js"></script>
<script>
  const host = document.getElementById('dgs');
  const packs = Object.values(window.MERMAID_SOURCES || {}).flat();
  (async () => {
    if (!packs.length) { host.innerHTML = '<div class="hint">无图源:目录内没有 .mmd 或未跑 sync-mmd.mjs。</div>'; return; }
    let i = 0;
    for (const d of packs) {
      const h = document.createElement('h4'); h.textContent = d.title;
      const box = document.createElement('div'); box.className = 'dg';
      host.appendChild(h); host.appendChild(box);
      if (!window.mermaid) {
        const pre = document.createElement('pre'); pre.textContent = d.src; box.appendChild(pre);
        continue;
      }
      try {
        const dark = matchMedia('(prefers-color-scheme: dark)').matches;
        mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: 'base',
          themeVariables: dark ? {
            primaryColor: '#2c2733', primaryTextColor: '#e6e6e5', primaryBorderColor: '#a084c7',
            lineColor: '#9b9a97', textColor: '#e6e6e5', edgeLabelBackground: '#1f2124',
            noteBkgColor: '#34373c', noteTextColor: '#e6e6e5', background: '#18191b',
            secondaryColor: '#1f2124', tertiaryColor: '#232526'
          } : {
            primaryColor: '#f0ebf6', primaryTextColor: '#37352f', primaryBorderColor: '#8a67ab',
            lineColor: '#787774', textColor: '#37352f', edgeLabelBackground: '#ffffff',
            noteBkgColor: '#f7f8f9', noteTextColor: '#37352f', background: '#ffffff',
            secondaryColor: '#ffffff', tertiaryColor: '#f7f8f9'
          } });
        const { svg } = await mermaid.render('mmd-' + i++, d.src);
        box.innerHTML = svg;
        enablePanZoom(box);
      } catch (e) {
        const pre = document.createElement('pre'); pre.textContent = d.src; box.appendChild(pre);
      }
    }
  })();

  function enablePanZoom(box){
    const svg = box.querySelector('svg');
    if (!svg || !svg.viewBox || !svg.viewBox.baseVal.width) return;
    const natW = svg.viewBox.baseVal.width, natH = svg.viewBox.baseVal.height;
    svg.style.maxWidth = 'none'; svg.style.width = natW + 'px'; svg.style.height = natH + 'px';
    box.classList.add('pan');
    box.insertAdjacentHTML('beforeend', '<button class="rst" title="重置视图(双击画布同效)">⌂</button>');
    let s = 1, tx = 0, ty = 0, dragging = false, sx = 0, sy = 0;
    const apply = () => { svg.style.transform = `translate(${tx}px,${ty}px) scale(${s})`; };
    const fit = () => {
      const r = box.getBoundingClientRect();
      s = Math.min((r.width - 28) / natW, (r.height - 28) / natH, 1);
      tx = (r.width - natW * s) / 2; ty = (r.height - natH * s) / 2; apply();
    };
    fit();
    box.querySelector('.rst').addEventListener('click', (e) => { e.stopPropagation(); fit(); });
    box.addEventListener('dblclick', fit);
    box.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.rst')) return;
      dragging = true; sx = e.clientX - tx; sy = e.clientY - ty;
      box.classList.add('dragging'); box.setPointerCapture(e.pointerId);
    });
    box.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      tx = e.clientX - sx; ty = e.clientY - sy; apply();
    });
    const end = () => { dragging = false; box.classList.remove('dragging'); };
    box.addEventListener('pointerup', end); box.addEventListener('pointercancel', end);
    box.addEventListener('wheel', (e) => {
      if (!e.ctrlKey && !e.metaKey) return;
      e.preventDefault();
      let dy = e.deltaY;
      if (e.deltaMode === 1) dy *= 16; else if (e.deltaMode === 2) dy *= 120;
      dy = Math.max(-60, Math.min(60, dy));
      const r = box.getBoundingClientRect();
      const px = e.clientX - r.left, py = e.clientY - r.top;
      const ns = Math.min(5, Math.max(0.2, s * Math.exp(-dy * 0.002)));
      tx = px - (px - tx) * (ns / s); ty = py - (py - ty) * (ns / s); s = ns; apply();
    }, { passive: false });
  }
</script>

<script>
  (function(){
    var SM = window.StateMachine;
    var state = null;
    var lastEvent = null;
    var BADGE = { validating:'pending', copying:'accepted', installed:'done',
      conflict_blocked:'rejected', failed_cleaned:'failed', confirming:'pending',
      deleting:'accepted', uninstalled:'done', cancelled:'expired' };

    var els = {
      status: document.getElementById('v-status'),
      kind: document.getElementById('v-kind'),
      note: document.getElementById('v-note'),
      illegal: document.getElementById('v-illegal')
    };

    function render(){
      if (state === null) {
        els.status.textContent = '—';
        els.status.className = 'badge empty';
        els.kind.textContent = '—'; els.kind.className = 'val nil';
        els.note.textContent = '—'; els.note.className = 'val nil';
        els.illegal.textContent = '空态:点入场按钮开始';
        els.illegal.className = 'illegal idle';
        applyReachability(); highlight(null); return;
      }
      els.status.textContent = state.status;
      els.status.className = 'badge ' + (BADGE[state.status] || 'empty');
      els.kind.textContent = state.kind === 'install'
        ? '安装 ' + state.skill + ' → ' + state.target : '卸载 ' + state.skill + '(' + state.target + ' 项目级副本)';
      els.kind.className = 'val';
      els.note.textContent = state.note || 'null';
      els.note.className = 'val' + (state.note ? '' : ' nil');
      if (state.illegal) {
        els.illegal.textContent = '⚠ ' + state.illegal;
        els.illegal.className = 'illegal bad';
      } else if (lastEvent) {
        els.illegal.innerHTML = '已派发 <span class="ev">' + lastEvent + '</span> → ' + state.status;
        els.illegal.className = 'illegal ok';
      } else {
        els.illegal.textContent = '尚未派发事件';
        els.illegal.className = 'illegal idle';
      }
      applyReachability(); highlight(state.status);
    }

    function applyReachability(){
      var perm = SM.legal(state);
      var stress = document.getElementById('stress').checked;
      document.querySelectorAll('[data-act]').forEach(function(b){
        var info = perm[b.getAttribute('data-act')] || { legal: true, why: null };
        b.setAttribute('aria-disabled', String(!info.legal && !stress));
        if (info.legal) b.removeAttribute('data-tip');
        else b.setAttribute('data-tip', (stress ? '压测:强行派发 — ' : '不可达:') + (info.why || ''));
      });
    }

    function highlight(status){
      document.querySelectorAll('.dg svg').forEach(function(svg){
        svg.querySelectorAll('g.node').forEach(function(n){
          var t = (n.textContent || '').trim();
          n.classList.toggle('cur', status !== null && t === status);
        });
      });
    }

    document.querySelectorAll('[data-act]').forEach(function(b){
      b.addEventListener('click', function(){
        if (b.getAttribute('aria-disabled') === 'true') return;
        var t = b.getAttribute('data-act');
        lastEvent = t;
        state = SM.reduce(state, { type: t });
        render();
      });
    });
    document.querySelectorAll('[data-new]').forEach(function(b){
      b.addEventListener('click', function(){
        lastEvent = null;
        state = SM.initial(b.getAttribute('data-new'));
        render();
      });
    });
    document.getElementById('btn-reset').addEventListener('click', function(){
      lastEvent = null; state = null; render();
    });
    document.getElementById('stress').addEventListener('change', applyReachability);

    render();
    var tries = 0;
    var t = setInterval(function(){
      if (document.querySelector('.dg svg') || ++tries > 40) { clearInterval(t); if (state) highlight(state.status); }
    }, 100);
  })();
</script>
</body>
</html>
