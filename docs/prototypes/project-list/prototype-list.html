<!doctype html>
<!-- A UI prototype · the project list (the projects dimension inside the icon rail).
     问题:并集列表的行密度与徽标怎么摆;失效过滤开关、手动隐藏/恢复、搜索、
     活跃度排序在纯项目栏里如何共存不打架(全局入口已移入最左 rail,不再挤在列表底部)。
     2026-08-15 追加的问题(第三侧 Grok 接入):侧数增长后行上不再逐个列徽章,改成一个数字 + 悬浮说明,
       过滤器改成下拉——于是问题变成:一个光秃秃的数字读不读得懂(尤其满屏都是「1」时),
       以及两个压在 overflow:auto 列表上的浮层会不会被裁掉、锚点失效时答不答话。
     2026-08-16:手动隐藏功能整体删除(ADR-0022),行尾不再有 hover 才浮现的控件。
     2026-08-16(实现期裁决):过滤行在长语言下装不下——本原型的失效开关 label 与失效计数器是
       硬编码中文(六语最短),宽度读数对这两个占位者失明,确认因此附着在一个产品里不存在的状态上
       (复盘:docs/postmortems/2026-08-16-prototype-copy-blindspot.md)。裁决:计数器优先收缩省略
       (全文放 title),label 只有自身自然宽超列才换行;见 spec projects-list C5。本原型未随之改造,
       其过滤行宽度结论仅对触发器有效。
     2026-10-14:失效开关 label 与失效计数器改取六语字典,宽度读数不再对它们失明;但 C5 的收缩省略/
       换行布局仍未搬入本原型,整行装不装得下以 spec C5 与 app 为准。
     2026-10-14:项目栏改为共享件 _shared/project-side.{js,css}——样式由 sync-project-side.mjs 从 app 的
       theme.css 生成,行为照 app 的 ProjectsPane(搜索同时匹配名字与路径、失效计数只在有被过滤的失效项目时
       出现、行提示为路径、徽章固定 Bot 图标),mock 项目也只有这一份,各页看到的是同一批项目。数字前图标
       候选的对照条因此撤掉:app 已定 Bot。
     2026-10-14:原「项目列表启动骨架」原型并入本页——app 里两者也是同一位置的二选一:这次启动还没收到首个
       快照时画骨架(ProjectsSkeleton),收到后画正式内容。骨架回答的问题:①项目维度的骨架长什么样——项目栏
       (搜索框 / 过滤行 / 列表行)全部按真实几何摆灰块,搜索与过滤静态置灰不可交互;②「正在扫描」提示放在
       右侧详情区中央(替换「选择一个项目」引导的位置)是否成立——扫描期间没有可选的项目,那句引导是假话,
       同一个居中位换成扫描提示;③填充是否接近零跳变(演示条在骨架与其余三档间切换对照)。骨架期间主区不可
       交互,顶栏的扫描提示让给中央那一句。
     交互:搜索、侧别下拉、勾选"显示失效"、点行——有原型的项目(Transfer、失效的 removed-experiment-2025)
       进入其原型,其余项目在本页只做选中。
     演示基建(非设计的一部分,勿实现):底部悬浮条(data-demo-harness,独立于页面内容流)承载
       「演示·启动」(骨架 / 扫描中 / 完成 / 失败,共享件 _shared/startup-status;真实判定 = 渲染器是否已收到
       首个快照与扫描的结果)与过滤行宽度读数——app 内没有这些开关。
     界面语言、明暗与配色跟随设置原型(appearance)所选,本页不设开关;本页画了六种语言,界面文案逐字取自
       六语字典;色值取共享主题 _shared/theme.css。仍为中文的只有演示条。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>原型 — 项目图鉴列表</title>
<link rel="stylesheet" href="../_shared/theme.css">
<link rel="stylesheet" href="../_shared/app-rail.css">
<link rel="stylesheet" href="../_shared/project-side.css">
<style>
  /* app token(--bg、--card、--text、--accent 一族、侧色 --p-anthropic 等、--warn-fg)一律取自
     _shared/theme.css(由 app 的 theme.css 生成,按设置原型所选的配色与明暗切换),本页不重定义任何一个。 */
  *{box-sizing:border-box;margin:0;font-family:-apple-system,"PingFang SC",sans-serif}
  body{display:flex;height:100vh;overflow:hidden;background:var(--bg);color:var(--text);font-size:13px}
  /* 演示基建(非设计的一部分,勿实现):底部悬浮条,与被评判的控件视觉隔离 */
  /* 居中用 left+right+margin:auto,**不用** left:50%+translateX(-50%)。后者对 fixed 元素来说
     可用宽度只剩 100vw-50vw = 50vw(未指定 right 时,包含块从 left 量到视口右缘),translateX 只是
     把它挪回视觉中心,于是内容一多就在半个视口里换行甚至被压成竖排——而 max-width 写多大都没用。
     另:transform 会给后代的 fixed 元素造出包含块,不用它也顺带避开了那个坑。 */
  .harness{position:fixed;bottom:14px;left:12px;right:12px;margin:0 auto;width:fit-content;z-index:60;
    display:flex;align-items:center;justify-content:center;flex-wrap:wrap;row-gap:2px;
    gap:4px;background:#26262b;border-radius:16px;
    padding:6px 14px;font-size:11px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
  /* 间距一律走 padding 与 gap,**不用 margin**:width:fit-content 求 max-content 时不计子项的
     margin,于是容器按少算的宽度定形,再把内容挤到下一行——表现是"明明放得下却换行了"。 */
  .harness .dl{color:#8a8a92;padding:0 3px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
  .harness .sepv{width:1px;height:16px;background:#4a4a52;display:inline-block;flex:none}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{height:44px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px}
  .empty .big{display:flex;justify-content:center;color:var(--text-2);opacity:.75}
  .empty{margin:auto;text-align:center;color:var(--text-2);line-height:2}
  /* 启动骨架(app 的 ProjectsSkeleton):中央的扫描提示与转圈图标;主区整体拒点(项目栏的骨架由共享件
     自己拒点,rail 与演示条不在此容器内);顶栏的扫描提示让给中央这一句,同一句话不在一屏里说两遍 */
  .empty .spin{display:inline-flex;justify-content:center;color:var(--accent);animation:spin 1.2s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  body.scanning .main{pointer-events:none}
  body.scanning .topbar .startup-hint{visibility:hidden}
</style>
<!-- Startup restore: keep the original page and its mock contents. The added bottom switches
     are demo scaffolding, not app controls. A real scan determines the status; nothing is persisted here. -->
<link rel="stylesheet" href="../_shared/startup-status.css">
<script src="../dimensions.js"></script>
<script src="../demo-dimensions.js" data-follow="language mode theme"></script>
<script src="../_shared/startup-status.js"></script>
<script src="../manifest.js"></script>
<script src="../app-identity.js"></script>
<script src="../_shared/icons.js"></script>
</head>
<body>
  <nav class="rail" data-shared-block="app-rail" data-rail-current="projects"></nav>
  <script src="../_shared/app-rail.js"></script>
  <aside class="side" data-shared-block="project-side" data-side-browse></aside>
  <script src="../_shared/project-side.js"></script>
  <div class="main">
    <div class="topbar" style="gap:12px"><b>Agentshed</b><span class="startup-hint" data-shared-block="startup-status" role="status"><span data-icon="RefreshCw" data-icon-size="12"></span><span data-startup-label>正在扫描各 agent 侧…</span></span></div>
    <div class="empty" id="pickStage"><div class="big" data-icon="MousePointerClick" data-icon-size="30"></div><div id="pickT"></div></div>
    <!-- 启动骨架的详情区:扫描期间没有可选项目,「选择一个项目」是假话——同一个居中位换成扫描提示 -->
    <div class="empty" id="skStage" hidden><div class="spin" data-icon="RefreshCw" data-icon-size="26"></div><div data-startup-scanning></div></div>
  </div>
  <div class="harness" id="harness" data-demo-harness></div>
<script>
  // 项目栏是共享件(_shared/project-side.js),本页只管右侧主区的引导语与演示条。
  // 引导语逐字取自六语字典 shell.pickProject。
  const PICK={zh:'选择一个项目查看详情',en:'Select a project to see its details',fr:'Sélectionnez un projet pour voir son détail',
    es:'Selecciona un proyecto para ver su detalle',ru:'Выберите проект, чтобы увидеть детали',ja:'プロジェクトを選択すると詳細が表示されます'};
  const HTML_LANG={zh:'zh-CN',en:'en',fr:'fr',es:'es',ru:'ru',ja:'ja'};
  // 演示基建(非设计的一部分,勿实现):启动恢复三态,与过滤行宽度读数——项目栏每次重绘后量,
  // 用来实测过滤行在六种语言下装不装得下(触发器宽 · 行的内容宽/可用宽)。
  const harness=document.getElementById('harness');
  // 演示条「骨架」一档:骨架与正式内容在同一位置二选一,与 app 一致(项目栏由共享件画它的骨架)
  let skeleton=false;
  StartupStatus.withSkeleton((state)=>{
    if((state==='skeleton')===skeleton) return;
    skeleton=state==='skeleton';
    document.body.classList.toggle('scanning',skeleton);
    document.getElementById('pickStage').hidden=skeleton;
    document.getElementById('skStage').hidden=!skeleton;
    ProjectSide.setState(skeleton?'scanning':'loaded');
  });
  harness.innerHTML=StartupStatus.controls()+
    '<span class="sepv"></span><span class="dl" id="room" style="font-weight:400"></span>';
  ProjectSide.onRender((col)=>{
    const trig=col.querySelector('.dd-trigger'),opts=col.querySelector('.opts');
    document.getElementById('room').textContent=
      `触发器 ${Math.round(trig.getBoundingClientRect().width)}px · 行 ${Math.round(opts.scrollWidth)}/${Math.round(opts.clientWidth)}px`;
  });
  DemoDimensions.on('language',v=>{
    document.documentElement.lang=HTML_LANG[v];
    document.getElementById('pickT').textContent=PICK[v];
  });
</script>
<script>
  // Cross-prototype navigation: inside the gallery it asks the parent page to switch; opened standalone it
  // navigates to the file directly
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-goto]');
    if (!el) return;
    if (window.parent !== window) parent.postMessage({ type: 'proto-nav', target: el.dataset.goto }, '*');
    else if (el.dataset.gotoHref) location.href = el.dataset.gotoHref;
  });
</script>
<script src="../demo-harness.js"></script>
</body>
</html>
