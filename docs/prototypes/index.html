<!doctype html>
<!-- Prototype gallery shell (copied from the prototype skill's template; do not edit by hand — change the skill template and copy it again).
     Depends on manifest.js in the same directory: window.PROTOTYPES = [{module,type,id,name,path,question,run?}],
     and window.PROTOTYPE_APP = {name, icon}, which app-identity.js puts on the browser tab and this shell
     puts above the list (see the skill's SKILL.md, general rule 11). -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Prototypes</title>
<style>
  :root{
    --bg:#f7f8f9; --card:#ffffff; --text:#37352f; --text-2:#787774;
    --line:#e8eaed; --line-strong:#d9dce0;
    --accent:#8a67ab; --accent-soft:#f0ebf6;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#18191b; --card:#1f2124; --text:#e6e6e5; --text-2:#9b9a97;
      --line:#2a2c30; --line-strong:#34373c; --accent:#a084c7; --accent-soft:#2c2733; }
  }
  *{box-sizing:border-box;margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  body{display:flex;height:100vh;overflow:hidden;background:var(--bg);color:var(--text);font-size:13px}

  /* Sidebar = a Figma-style dark tool panel: fixed colours that ignore the system theme, clearly set apart from the prototype content (app style) being judged */
  .side{width:240px;flex:none;background:#2c2c2e;color:#e8e8e8;border-right:1px solid #1d1d1f;
    display:flex;flex-direction:column;transition:margin .18s}
  body.fold .side{margin-left:-240px}
  .s-h{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 10px}
  .s-h b{font-size:13px;color:#fff;letter-spacing:.3px}
  .fold-btn{cursor:pointer;color:#8e8e93;border:0;background:none;font-size:14px}
  .fold-btn:hover{color:#fff}
  .list{flex:1;overflow:auto;padding:0 8px 14px}
  .grp{font-size:10px;color:#8e8e93;font-weight:600;padding:12px 8px 4px;text-transform:uppercase;letter-spacing:.6px}
  .item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;cursor:pointer;color:#d1d1d6}
  .item:hover{background:#3a3a3c}
  .item.on{background:#0d99ff;color:#fff;font-weight:600}
  .tag{font-size:10px;border:1px solid #48484a;border-radius:4px;padding:0 5px;color:#8e8e93;flex:none}
  .item.on .tag{border-color:rgba(255,255,255,.55);color:#fff}

  /* The folded sidebar leaves a small tab stuck to the left edge, covering as little of the prototype as it
     can. It starts at mid-height, where an app's navigation rail has no icons, and slides up or down along
     the edge without ever leaving it or the viewport. */
  .unfold{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:9;display:none;
    background:#1b1b1f;color:#fff;border:0;border-radius:0 8px 8px 0;padding:5px 9px 5px 7px;
    font-size:11.5px;line-height:1.3;cursor:pointer;touch-action:none;user-select:none;
    box-shadow:0 4px 16px rgba(0,0,0,.3)}
  body.fold .unfold{display:block}

  .stage{flex:1;min-width:0;display:flex}
  iframe{flex:1;border:0;background:var(--bg)}
  .empty{margin:auto;color:var(--text-2);text-align:center}
</style>
<script src="manifest.js"></script>
<script src="app-identity.js"></script>
</head>
<body>
  <div class="side">
    <div class="s-h"><b id="appName">Prototypes</b><button class="fold-btn" onclick="fold(true)" title="Collapse (S)">⟨⟨</button></div>
    <div class="list" id="list"></div>
  </div>
  <button class="unfold" id="unfold" title="Expand (S); drag up or down to move">☰ Proto</button>
  <div class="stage" id="stage"><div class="empty">Select a prototype on the left</div></div>

<script>
  const P = window.PROTOTYPES || [];

  // The app these prototypes belong to, above the list (app-identity.js puts it on the tab)
  const APP = window.PROTOTYPE_APP;
  if (APP && APP.name) document.getElementById('appName').textContent = `${APP.name} · Prototypes`;
  const list = document.getElementById('list');
  const stage = document.getElementById('stage');

  // Sidebar: grouped by module
  const groups = {};
  P.forEach(p => (groups[p.module] ??= []).push(p));
  for (const [mod, items] of Object.entries(groups)) {
    const g = document.createElement('div'); g.className='grp'; g.textContent = mod; list.appendChild(g);
    for (const p of items) {
      const el = document.createElement('div');
      el.className = 'item'; el.dataset.key = key(p);
      el.innerHTML = `<span class="tag">${p.type === 'logic' ? 'Logic' : 'UI'}</span><span>${p.name}</span>`;
      el.onclick = () => { location.hash = key(p); };
      list.appendChild(el);
    }
  }

  function key(p){ return `${p.module}/${p.id}`; }
  function find(k){ return P.find(p => key(p) === k); }

  function show(k){
    const p = find(k);
    document.querySelectorAll('.item').forEach(e => e.classList.toggle('on', e.dataset.key === k));
    if (!p) { stage.innerHTML = '<div class="empty">Select a prototype on the left</div>'; return; }
    // Every entry is an iframe: UI is self-contained HTML, and Logic is also a self-rendering page (question / diagram / commands all inside)
    stage.innerHTML = `<iframe src="${p.path}"></iframe>`;
  }

  function fold(v){ document.body.classList.toggle('fold', v); try{localStorage.setItem('pg-fold', v?'1':'0')}catch(e){} if (v) placeTab() }
  try{ if(localStorage.getItem('pg-fold')==='1') document.body.classList.add('fold') }catch(e){}

  // The folded tab: a press that does not move expands the sidebar, a vertical drag moves the tab along the
  // left edge. Its height is remembered and pulled back inside the viewport whenever the window resizes.
  const unfold = document.getElementById('unfold');
  let tabTop = null, dragged = false;
  try{ const v = parseFloat(localStorage.getItem('pg-unfold-top')); if (Number.isFinite(v)) tabTop = v }catch(e){}
  function placeTab(){
    if (tabTop === null || !unfold.offsetHeight) return;
    const top = Math.max(8, Math.min(tabTop, innerHeight - unfold.offsetHeight - 8));
    unfold.style.top = `${top}px`; unfold.style.transform = 'none';
  }
  unfold.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    const start = unfold.getBoundingClientRect().top, sy = e.clientY;
    dragged = false;
    unfold.setPointerCapture(e.pointerId);
    const move = (ev) => {
      if (!dragged && Math.abs(ev.clientY - sy) < 4) return;
      dragged = true; tabTop = start + ev.clientY - sy; placeTab();
    };
    const end = () => {
      unfold.removeEventListener('pointermove', move); unfold.removeEventListener('pointerup', end);
      unfold.removeEventListener('pointercancel', end);
      if (dragged) { tabTop = unfold.getBoundingClientRect().top; try{localStorage.setItem('pg-unfold-top', String(tabTop))}catch(e){} }
    };
    unfold.addEventListener('pointermove', move); unfold.addEventListener('pointerup', end);
    unfold.addEventListener('pointercancel', end);
  });
  // Keyboard activation arrives as a click too; only the click that ends a drag is swallowed
  unfold.addEventListener('click', () => { if (dragged) { dragged = false; return } fold(false) });
  addEventListener('resize', placeTab);
  placeTab();

  addEventListener('hashchange', () => show(decodeURIComponent(location.hash.slice(1))));
  addEventListener('keydown', (e) => {
    const t = document.activeElement;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    if ((e.key === 's' || e.key === 'S') && !e.metaKey && !e.ctrlKey && !e.altKey) {
      fold(!document.body.classList.contains('fold')); e.preventDefault(); return;
    }
    if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
    const keys = P.map(key); if (!keys.length) return;
    const i = keys.indexOf(decodeURIComponent(location.hash.slice(1)));
    const n = e.key === 'ArrowDown' ? (i + 1 + keys.length) % keys.length : (i - 1 + keys.length) % keys.length;
    location.hash = keys[n]; e.preventDefault();
  });

  // Receive navigation requests from the prototype inside the iframe (under file:// the child page and the shell are cross-origin, so it cannot change the parent hash directly; it goes through postMessage)
  addEventListener('message', (e) => {
    const t = e.data && e.data.type === 'proto-nav' && e.data.target;
    if (t && find(t)) location.hash = t;
  });

  const init = decodeURIComponent(location.hash.slice(1));
  show(find(init) ? init : (P.length ? key(P[0]) : ''));
  if (!location.hash && P.length) location.hash = key(P[0]);
</script>
</body>
</html>
