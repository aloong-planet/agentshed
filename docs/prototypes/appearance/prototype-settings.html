<!doctype html>
<!-- Reviewer notes: prototype-settings.md -->
<html lang="zh-CN" data-demo-theme="purple" data-demo-mode="light">
<head>
<meta charset="utf-8">
<title>原型 — 设置 · 语言、外观与更新</title>
<link rel="stylesheet" href="../_shared/theme.css">
<link rel="stylesheet" href="../_shared/app-window.css">
<link rel="stylesheet" href="../_shared/app-rail.css">
<style>
  /* The app's tokens for every palette × light/dark come from _shared/theme.css, keyed on data-demo-theme and
     data-demo-mode; this page writes those two attributes itself, from what it renders. The popover takes
     the app's overlay shadow. */
  :root { --shadow: var(--shadow-pop); }

  *{box-sizing:border-box;margin:0;font-family:-apple-system,"PingFang SC","Hiragino Sans",system-ui,sans-serif}


  /* ── The update button: a 36px rail slot holding a 24px filled circle.
     The fill is the theme accent; the glyph takes the card colour, so it reads white on the light themes'
     deep accents and dark on the dark themes' light accents. Only the ready state is a button. ── */
  .ri.upd{cursor:default}
  button.ri.upd{cursor:pointer}
  .upd-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:var(--accent);color:var(--card)}
  .upd-ring .track{stroke:currentColor;opacity:.35}
  .upd-ring .arc{stroke:currentColor;transition:stroke-dashoffset .3s linear}
  .upd-spin{display:flex;animation:upd-spin 1s linear infinite}
  @keyframes upd-spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){.upd-spin{animation:none}}
  /* The hover message: an instant tooltip to the right of the slot, in the chart tooltip's fixed dark
     form */
  /* Above every other layer, the demo harness included: the harness sits right of the rail and would
     otherwise cover the message where it opens */
  .uptip{position:fixed;z-index:95;display:none;padding:6px 10px;border-radius:8px;white-space:nowrap;
    background:var(--tip-bg);color:var(--tip-fg);font-size:12.5px;pointer-events:none;
    box-shadow:0 6px 22px var(--float-shadow)}
  .uptip.on{display:block}

  .stage{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
  .h1{font-size:16px;font-weight:700;margin-bottom:4px;color:var(--accent)}

  .settings{flex:1;overflow:auto;padding:20px 28px 60px;max-width:720px}
  .settings .h1{font-size:18px;margin-bottom:6px}
  .settings .lead{font-size:12.5px;color:var(--text-2);margin-bottom:22px;line-height:1.5}
  .sec-t{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-2);margin-bottom:10px}
  .sec{margin-bottom:24px}

  /* ── A settings row: the label on the left, the control on the right. Language and appearance share the
     same form ── */
  .field{background:var(--card);border:1px solid var(--line-strong);border-radius:12px}
  .frow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 16px}
  .frow + .frow{border-top:1px solid var(--line)}
  .flabel{font-size:13px;font-weight:600;flex:none}

  .lang-trigger{
    display:flex;align-items:center;gap:10px;min-width:230px;justify-content:space-between;
    padding:8px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);
    color:inherit;font:inherit;font-size:12.5px;cursor:pointer}
  .lang-trigger:hover{border-color:var(--accent);background:var(--accent-soft)}
  .lang-trigger:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .lang-trigger[aria-expanded="true"]{border-color:var(--accent);background:var(--accent-soft)}
  .lang-trigger .cur{font-weight:600;display:flex;align-items:baseline;gap:6px;min-width:0}
  .lang-trigger .cur .eff{font-weight:400;font-size:11.5px;color:var(--text-2)}
  .lang-trigger .chev{flex:none;color:var(--text-2);display:flex;transition:transform .15s}
  .lang-trigger[aria-expanded="true"] .chev{transform:rotate(180deg)}

  /* The overlay is fixed: the settings page container is overflow:auto, which would clip an absolute one */
  .lang-pop{
    position:fixed;z-index:60;display:none;min-width:262px;padding:4px;
    background:var(--card);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow)}
  .lang-pop.open{display:block}
  .lang-opt{
    display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:7px;
    background:transparent;color:inherit;font:inherit;font-size:12.5px;cursor:pointer;text-align:left}
  .lang-opt:hover,.lang-opt.cursor{background:var(--accent-soft)}
  .lang-opt .n{flex:1;font-weight:600}
  .lang-opt .e{color:var(--text-2);font-size:11.5px}
  .lang-opt .ck{flex:none;color:var(--accent);display:flex;visibility:hidden}
  .lang-opt.on .ck{visibility:visible}
  .lang-opt.on .n{color:var(--accent-deep)}
  .lang-pop .sep{height:1px;background:var(--line);margin:4px 8px}

  /* The segmented control: inline-flex in an outer frame that clips its buttons; the selected button takes
     accent-soft */
  .seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden}
  .seg button{
    font:inherit;font-size:12px;padding:5px 13px;border:0;cursor:pointer;
    color:var(--text-2);background:transparent}
  .seg button:hover{color:var(--text);background:var(--bg)}
  .seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

  /* Colour schemes: small cards in a row keeping only a swatch and a name */
  .pal-grid{display:flex;gap:8px}
  .pal{
    display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 11px;
    border:1px solid var(--line-strong);border-radius:9px;background:var(--bg);
    cursor:pointer;color:inherit;font:inherit}
  .pal:hover{border-color:var(--accent);background:var(--accent-soft)}
  .pal.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
  .pal:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .pal .sw-row{display:flex;gap:3px}
  .pal .sw{width:13px;height:13px;border-radius:4px;border:1px solid var(--line-strong)}
  .pal .pal-n{font-size:11.5px;font-weight:600;color:var(--text-2);white-space:nowrap}
  .pal.on .pal-n{color:var(--accent-deep)}

  .foot{margin-top:10px;padding:11px 14px;border-radius:10px;background:var(--bg);
    border:1px dashed var(--line-strong);font-size:12px;color:var(--text-2);line-height:1.5}
  .foot b{color:var(--text);font-weight:600}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:80;
    background:var(--ok-bg);color:var(--ok-fg);border-radius:10px;padding:10px 16px;font-size:12.5px;display:none;
    border:1px solid var(--ok-fg)}
  .toast.err{background:var(--err-bg);color:var(--err-fg);border-color:var(--err-fg)}

  /* ── The updates section ── */
  .cfg-btn{font:inherit;font-size:12.5px;border-radius:7px;padding:6px 14px;cursor:pointer;
    border:1px solid var(--line-strong);background:var(--bg);color:var(--text);
    white-space:nowrap;flex:none}
  .cfg-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
  .cfg-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .cfg-btn[aria-disabled="true"]{cursor:default;color:var(--text-2);border-color:var(--line);background:var(--bg)}
  .seg button[aria-disabled="true"]{cursor:default;color:var(--text-2);opacity:.55;background:transparent}
  .seg button.on[aria-disabled="true"]{background:var(--line)}
  .ver-ctl{display:flex;align-items:center;gap:12px;min-width:0}
  .ver{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--text-2)}
  .chk-out{font-size:12px;color:var(--text-2)}
  .chk-out.ok{color:var(--ok-fg)}
  .chk-out.err{color:var(--err-fg)}
  .note{margin-top:22px;padding:12px 14px;border:1px dashed var(--line-strong);border-radius:10px;
    font-size:11.5px;color:var(--text-2);line-height:1.55}
  .note b{color:var(--text)}

</style>
<script src="../manifest.js"></script>
<script src="../app-identity.js"></script>
<script src="../dimensions.js"></script>
<script src="../demo-dimensions.js" data-settings></script>
<script src="../_shared/icons.js"></script>
</head>
<body>
<div class="app-window" data-shared-block="app-window">
  <nav class="rail" data-shared-block="app-rail" data-rail-current="settings"></nav>
  <script src="../_shared/app-rail.js"></script>
  <main class="stage" id="stage"></main>
  <div class="lang-pop" id="langPop" role="listbox"></div>
  <div class="uptip" id="upTip" role="tooltip"></div>
  <div class="toast" id="toast"></div>
</div>

  <div data-demo-harness id="demoBar">
    <span class="dh-tag">Demo ·</span>
    <div class="dh-group">
      <span class="dh-title">运行方式</span>
      <div class="dh-opts" id="runOpts">
        <button type="button" class="dh-opt" data-run="packaged" aria-pressed="true">打包版</button>
        <button type="button" class="dh-opt" data-run="dev" aria-pressed="false">开发运行(未打包)</button>
      </div>
    </div>
    <div class="dh-group">
      <span class="dh-title">下次检查返回</span>
      <div class="dh-opts" id="nextOpts">
        <button type="button" class="dh-opt" data-next="found" aria-pressed="true">发现 0.1.1</button>
        <button type="button" class="dh-opt" data-next="uptodate" aria-pressed="false">已是最新</button>
        <button type="button" class="dh-opt" data-next="failed" aria-pressed="false">检查失败</button>
      </div>
    </div>
    <div class="dh-group">
      <span class="dh-title">点击安装后</span>
      <div class="dh-opts" id="instOpts">
        <button type="button" class="dh-opt" data-inst="ok" aria-pressed="true">安装成功并重启</button>
        <button type="button" class="dh-opt" data-inst="fail" aria-pressed="false">安装失败</button>
      </div>
    </div>
    <div class="dh-group dh-actions">
      <span class="dh-title">动作</span>
      <div class="dh-acts">
        <button type="button" class="dh-act" id="actAuto">自动检查触发</button>
        <button type="button" class="dh-act" id="actMenu">菜单「检查更新…」</button>
        <button type="button" class="dh-act" id="actFail">后台下载失败</button>
        <button type="button" class="dh-act" id="actQuit">退出再打开</button>
      </div>
    </div>
    <p class="dh-note" id="sysOut"></p>
    <p class="dh-note">运行方式在 app 里取决于 app 是否打包;检查结果是 GitHub Releases 的应答;安装结果取决于系统替换 app 是否成功;app 内没有这些控件。语言与明暗的「跟随系统」按画廊统一设置的取值呈现,本页不模拟系统。</p>
  </div>
<script>

  const LANGS = ['zh', 'en']
  /** The language selector's value domain = follow system + the two languages. 'system' is a preference
     * value, not a language */
  const OPTIONS = ['system', ...LANGS]
  /** The appearance mode's value domain, structurally identical to language: 'system' is a policy while
     * light/dark are locked values */
  const MODES = ['system', 'light', 'dark']

  const T = {
    zh: {
      native: '简体中文', english: 'Chinese (Simplified)', htmlLang: 'zh-CN',
      settings: '设置',
      lead: '本 app 偏好，对整个界面生效。不写入 Claude / Codex 配置。',
      secLang: '语言', ifaceLang: '界面语言', followSystem: '跟随系统',
      langFoot: '选择「跟随系统」时，界面语言随 macOS 的偏好语言变化；偏好语言均不在支持范围内时使用英文。',
      secAppear: '外观', modeLabel: '模式', paletteLabel: '配色',
      light: '浅色', dark: '深色',
      schemeNames: { purple: '紫', blue: '雾蓝', amber: '琥珀褐' },
      appearFoot: (b) => `模式选「${b('跟随系统')}」时，明暗随 macOS 外观变化。配色与明暗彼此独立、可任意组合；未选择时用紫。切换后立即对整个 app 生效，无需保存。`,
      toastScheme: (n) => `配色已切换为「${n}」`,
      toastMode: (n) => `外观模式：${n}`,
      toastLang: (n) => `界面语言已切换为 ${n}`,
      toastFollowSystem: (n) => `已设为跟随系统 · 当前为 ${n}`,
    },
    en: {
      native: 'English', english: 'English', htmlLang: 'en',
      settings: 'Settings',
      lead: 'Preferences for this app only. They apply to the whole interface and are never written to your Claude or Codex configuration.',
      secLang: 'Language', ifaceLang: 'Interface language', followSystem: 'Follow system',
      langFoot: 'With “Follow system”, the interface follows your macOS preferred languages; English is used when none of them is supported.',
      secAppear: 'Appearance', modeLabel: 'Mode', paletteLabel: 'Palette',
      light: 'Light', dark: 'Dark',
      schemeNames: { purple: 'Purple', blue: 'Mist Blue', amber: 'Amber Brown' },
      appearFoot: (b) => `With mode set to “${b('Follow system')}”, light and dark follow your macOS appearance. Palette and light/dark are independent and combine freely; Purple is used when nothing is chosen. Changes apply across the whole app immediately — no saving needed.`,
      toastScheme: (n) => `Palette switched to “${n}”`,
      toastMode: (n) => `Appearance mode: ${n}`,
      toastLang: (n) => `Interface language switched to ${n}`,
      toastFollowSystem: (n) => `Now following the system · currently ${n}`,
    }
  }

  /** The updates copy, per language. */
  const TU = {
    zh: {
      sec: '更新', auto: '自动检查更新', on: '开', off: '关', version: '当前版本',
      checkNow: '立即检查', checking: '正在检查…', upToDate: '已是最新版本',
      failed: '检查更新失败',
      found: (v) => `发现新版本 ${v}，正在下载`,
      readyNote: (v) => `版本 ${v} 已下载，可以安装`,
      foot: '有新版本时会在后台下载。下载完成后，点击左下角的更新按钮即可安装并重启；不点的话，退出时会自动安装。',
      devFoot: '开发运行（未打包的 app）中不检查更新。',
      tipReady: '有可用更新', tipDl: (n) => `正在下载更新 ${n}%`, tipInstall: '正在安装更新…',
      toastUpToDate: (v) => `Agentshed 已是最新版本（${v}）`, toastFailed: '检查更新失败',
      toastFound: (v) => `发现新版本 ${v}，正在后台下载`,
      toastInstallFailed: '无法安装更新',
      installNow: '立即安装',
    },
    en: {
      sec: 'Updates', auto: 'Check for updates automatically', on: 'On', off: 'Off', version: 'Current version',
      checkNow: 'Check now', checking: 'Checking…', upToDate: 'You’re up to date',
      failed: 'Couldn’t check for updates',
      found: (v) => `Version ${v} is downloading`,
      readyNote: (v) => `Version ${v} is ready to install`,
      foot: 'New versions download in the background. When one is ready, click the update button at the bottom left to install it and restart; otherwise it installs when you quit.',
      devFoot: 'Updates are not checked in a development run (the app is not packaged).',
      tipReady: 'Update available', tipDl: (n) => `Downloading update ${n}%`, tipInstall: 'Installing update…',
      toastUpToDate: (v) => `Agentshed is up to date (${v})`, toastFailed: 'Couldn’t check for updates',
      toastFound: (v) => `Version ${v} found — downloading in the background`,
      toastInstallFailed: 'Couldn’t install the update',
      installNow: 'Install now',
    }
  }

  /** Palette preview samples (card / accent-soft / accent / text), in two sets by light and dark.
      The values are copied from the palette tokens in _shared/theme.css; a palette colour changed there
      changes here too. */
  const SWATCHES = {
    light: {
      purple: ['#ffffff', '#f0ebf6', '#8a67ab', '#37352f'],
      blue: ['#fffcf9', '#eef2f7', '#4a6fa5', '#2c2a28'],
      amber: ['#fffcf7', '#f3ead4', '#6b5220', '#3a342c']
    },
    dark: {
      purple: ['#1f2124', '#2c2733', '#a084c7', '#e6e6e5'],
      blue: ['#1c1f24', '#1e2a38', '#7a9dc4', '#e6e4e0'],
      amber: ['#221e1a', '#2e2820', '#c4a46a', '#ebe4d8']
    }
  }

  /** The three preferences: colour scheme, appearance mode and language. 'system' in the latter two is a
     * policy rather than a snapshot */
  let scheme = DemoDimensions.get('theme')
  let modePref = 'system'
  let langPref = 'system'
  /** The language and light/dark in effect (demo-dimensions.js): what "follow system" shows, the gallery's
   *  settings standing in for the system */
  let curLang = DemoDimensions.get('language')
  let curMode = DemoDimensions.get('mode')
  let popOpen = false
  let cursor = 0

  /* ── Demo dimensions (not part of the design): this page and the gallery's settings write the language,
     light/dark and palette every other prototype page shows. Its preferences are kept with them, so the page
     reopens as the reader left it. ── */
  const kept = DemoDimensions.state()
  if (kept && OPTIONS.includes(kept.langPref) && MODES.includes(kept.modePref) && SWATCHES.light[kept.scheme]) {
    ;({ scheme, modePref, langPref } = kept)
  }
  const prefs = () => ({ scheme, modePref, langPref })
  /** A choice made on this page: the values it changes, with the preferences they came from. Choosing "follow
   *  system" changes no value, so it saves the preferences alone. */
  function publish(values) { DemoDimensions.set(values, prefs()) }

  /* ── Updates: the lifecycle idle / checking / downloading / ready / installing. There is no failure
     state: a failed background download returns to idle. ── */
  let curVersion = '0.1.0-beta'  // the running version; a played restart into an update moves it on
  let newVersion = '0.1.1'       // what the next check that finds an update finds
  let packaged = true        // demo harness: a packaged app or a development run
  let autoCheck = true       // the settings switch, on by default
  let nextOutcome = 'found'  // demo harness: what the next update check answers
  let nextInstall = 'ok'     // demo harness: whether clicking the ready button installs or fails
  let upd = 'ready'          // the update lifecycle; the page opens on "ready" so the button is there to hover
  let pct = 100              // download progress, 0–100
  let checkOut = null        // the settings page's own result: null | checking | uptodate | failed | found
  let dlTimer = null
  let tipOpen = false
  const u = () => TU[effLang()]

  /** Lucide download */
  const ICON_DOWNLOAD = (s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>`
  /** Lucide loader-circle */
  const ICON_LOADER = (s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>`

  /** The download progress ring drawn inside the filled circle */
  function ring(p) {
    const r = 7, c = 2 * Math.PI * r
    return `<svg class="upd-ring" width="16" height="16" viewBox="0 0 18 18" aria-hidden="true">
      <circle class="track" cx="9" cy="9" r="${r}" fill="none" stroke-width="2.4"/>
      <circle class="arc" cx="9" cy="9" r="${r}" fill="none" stroke-width="2.4" stroke-linecap="round"
        stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c * (1 - p / 100)).toFixed(2)}"
        transform="rotate(-90 9 9)"/></svg>`
  }

  function tipText() {
    if (upd === 'ready') return u().tipReady
    if (upd === 'downloading') return u().tipDl(pct)
    if (upd === 'installing') return u().tipInstall
    return ''
  }

  /** The rail slot: present only while an update is downloading, installing or ready; only "ready" is a button */
  function renderUpdateSlot() {
    const slot = document.querySelector('[data-rail-slot]')
    if (upd !== 'ready' && upd !== 'downloading' && upd !== 'installing') {
      slot.innerHTML = ''
      hideTip()
      return
    }
    const label = esc(tipText())
    if (upd === 'ready') {
      slot.innerHTML = `<button type="button" class="ri upd" id="updBtn" aria-label="${label}"><span class="upd-dot">${ICON_DOWNLOAD(15)}</span></button>`
    } else {
      const inner = upd === 'downloading' ? ring(pct) : `<span class="upd-spin">${ICON_LOADER(15)}</span>`
      const bar = upd === 'downloading' ? ` role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"` : ''
      slot.innerHTML = `<span class="ri upd" id="updBtn" tabindex="0" aria-label="${label}"${bar}><span class="upd-dot">${inner}</span></span>`
    }
    const el = document.getElementById('updBtn')
    el.onmouseenter = el.onfocus = () => showTip(el)
    el.onmouseleave = el.onblur = hideTip
    if (upd === 'ready') el.onclick = install
    // The slot is rebuilt on every progress step, so an open message is re-anchored to the new element
    if (tipOpen) showTip(el)
  }

  function showTip(el) {
    const tip = document.getElementById('upTip')
    tip.textContent = tipText()
    tip.classList.add('on')
    tipOpen = true
    const r = el.getBoundingClientRect()
    tip.style.left = `${r.right + 8}px`
    tip.style.top = `${r.top + r.height / 2 - tip.offsetHeight / 2}px`
  }
  function hideTip() {
    document.getElementById('upTip').classList.remove('on')
    tipOpen = false
  }

  function startDownload() {
    clearInterval(dlTimer)
    upd = 'downloading'
    pct = 0
    renderUpdateSlot(); refreshSettingsLine()
    dlTimer = setInterval(() => {
      pct = Math.min(100, pct + 6)
      if (pct >= 100) { clearInterval(dlTimer); upd = 'ready' }
      renderUpdateSlot(); refreshSettingsLine()
    }, 450)
  }

  /** Demo: the background download fails. Nothing is shown — the button goes and a later check retries */
  function failDownload() {
    if (upd !== 'downloading') { demoNote('演示：当前没有进行中的下载'); return }
    clearInterval(dlTimer)
    upd = 'idle'; pct = 0
    if (checkOut === 'found') checkOut = null
    renderUpdateSlot(); refreshSettingsLine()
    demoNote('演示：后台下载失败 → 按钮消失，下次检查再下')
  }

  /** Clicking the ready button, or "Install now" in settings, installs and restarts; the prototype cannot
   *  restart, so it plays one.
   *  A failed install shows an error toast, and the button goes as after a failed download, so the next
   *  update check downloads again. */
  function install() {
    upd = 'installing'
    renderUpdateSlot(); refreshSettingsLine()
    setTimeout(() => {
      upd = 'idle'; pct = 0; checkOut = null
      renderUpdateSlot(); refreshSettingsLine()
      if (nextInstall === 'fail') {
        toast(u().toastInstallFailed, 'err')
        demoNote('演示：安装失败 → 错误 toast，按钮消失，下次检查再下载')
      } else {
        const v = newVersion
        relaunch(true)
        demoNote(`演示：已安装 ${v} 并重启 → 当前版本变为 ${v}，结果行「已是最新版本」`)
      }
    }, 1600)
  }

  /** The prototype cannot restart, so it plays one. This run's page state goes (the result line is not kept
   *  across a restart), and an update that is ready is installed on the way out, as on any quit. A launch whose
   *  version went up shows "up to date" in the result line for that run; the lifecycle rule still wins over
   *  it. */
  function relaunch(updated) {
    clearInterval(dlTimer)
    if (updated) {
      curVersion = newVersion
      newVersion = newVersion.replace(/(\d+)$/, (n) => String(Number(n) + 1))
      document.querySelector('[data-next="found"]').textContent = `发现 ${newVersion}`
    }
    upd = 'idle'; pct = 0
    checkOut = updated ? 'uptodate' : null
    renderUpdateSlot(); render()
  }

  /** Demo: quit and open again. A ready update installs on the way out; a download under way is dropped */
  function quitAndReopen() {
    if (upd === 'installing') { demoNote('演示：正在安装，稍候'); return }
    if (upd === 'ready') {
      const v = newVersion
      relaunch(true)
      demoNote(`演示：退出时安装 → 再打开已是 ${v}，结果行「已是最新版本」`)
      return
    }
    const wasDownloading = upd === 'downloading'
    relaunch(false)
    demoNote(`演示：退出再打开 → 本次运行的结果行不保留${wasDownloading ? '，未完成的下载不安装' : ''}`)
  }

  /** The surfaces waiting on the check in flight: a check asked for meanwhile joins it rather than sending a
   *  second request, and each surface gets the outcome in its own form */
  let checkSources = null

  /** One update check. source: auto (launch or the 24-hour timer) | menu | settings */
  function runCheck(source) {
    if (!packaged) { demoNote('演示：开发运行不检查更新'); return }
    if (source === 'auto' && !autoCheck) { demoNote('演示：自动检查已关闭，不检查'); return }
    // An update already on its way or waiting: no request and no second download. Only the menu and the timer
    // can get here — in these states the settings row's button is greyed or is "Install now"
    if (upd === 'downloading' || upd === 'ready' || upd === 'installing') {
      if (source === 'menu') toast(upd === 'ready' ? u().readyNote(newVersion) : upd === 'installing' ? u().tipInstall : u().toastFound(newVersion))
      demoNote('演示：已有更新在途 → 不发请求，「下次检查返回」此时不生效')
      return
    }
    if (source === 'settings') { checkOut = 'checking'; refreshSettingsLine() }
    if (upd === 'checking') { checkSources.add(source); return }
    upd = 'checking'
    checkSources = new Set([source])
    setTimeout(() => {
      upd = 'idle'
      const o = nextOutcome
      const sources = checkSources
      checkSources = null
      if (o === 'found') {
        // Whichever surface asked, an update found makes this page's earlier "up to date" or "failed" untrue; it
        // goes, so a failed download leaves the line empty rather than claiming the app is up to date
        checkOut = sources.has('settings') ? 'found' : null
        if (sources.has('menu')) toast(u().toastFound(newVersion))
        startDownload()
        return
      }
      if (sources.has('settings')) { checkOut = o; refreshSettingsLine() }
      if (sources.has('menu')) toast(o === 'uptodate' ? u().toastUpToDate(curVersion) : u().toastFailed, o === 'failed' ? 'err' : 'ok')
      if (sources.size === 1 && sources.has('auto')) demoNote(o === 'failed' ? '演示：自动检查失败 → 静默，不打扰' : '演示：自动检查 → 已是最新，不打扰')
    }, 900)
  }

  /** The version row's button. While an update is ready it is "Install now" and does what the rail button does,
   *  greyed while that install runs. Otherwise it is "Check now", unavailable in a development run, while this
   *  page's own check runs and while an update downloads. */
  function rowAction() {
    if (upd === 'ready' || upd === 'installing') return { install: true, label: u().installNow, disabled: upd === 'installing' }
    return { install: false, label: u().checkNow, disabled: !packaged || checkOut === 'checking' || upd === 'downloading' }
  }

  /** The settings page's result line beside the check button. An update on its way or waiting is shown whichever
   *  check found it; only with no update in flight does the line show this page's last check. */
  function checkLine() {
    if (!packaged) return { cls: '', text: '' }
    if (upd === 'downloading') return { cls: '', text: u().found(newVersion) }
    if (upd === 'ready') return { cls: 'ok', text: u().readyNote(newVersion) }
    if (upd === 'installing') return { cls: '', text: u().tipInstall }
    switch (checkOut) {
      case 'checking': return { cls: '', text: u().checking }
      case 'uptodate': return { cls: 'ok', text: u().upToDate }
      case 'failed': return { cls: 'err', text: u().failed }
      default: return { cls: '', text: '' }
    }
  }
  function refreshSettingsLine() {
    const out = document.getElementById('chkOut')
    if (!out) return
    const l = checkLine()
    out.className = `chk-out ${l.cls}`
    out.textContent = l.text
    const btn = document.getElementById('verAct')
    if (btn) {
      const a = rowAction()
      btn.textContent = a.label
      btn.setAttribute('aria-disabled', String(a.disabled))
    }
  }

  /** Demo harness only: a transient line in the demo bar's note */
  function demoNote(s) {
    const out = document.getElementById('sysOut')
    out.textContent = s.replace(/^演示：/, '')
    clearTimeout(demoNote._t)
    demoNote._t = setTimeout(renderDemoOut, 3500)
  }

  /** "Follow system" shows the value in effect; an explicit preference is its own value */
  const effLang = () => (langPref === 'system' ? curLang : langPref)
  /** Appearance mode → the effective light/dark. Structurally identical to language: the preference is a
     * policy, and the effective value is what actually lands on the DOM */
  const effTheme = () => (modePref === 'system' ? curMode : modePref)
  const t = () => T[effLang()]
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
  const modeName = (id) => (id === 'system' ? t().followSystem : id === 'light' ? t().light : t().dark)

  function toast(msg, kind = 'ok') {
    const el = document.getElementById('toast')
    el.textContent = msg
    el.className = kind === 'err' ? 'toast err' : 'toast'
    el.style.display = 'block'
    clearTimeout(toast._tm)
    toast._tm = setTimeout(() => { el.style.display = 'none' }, 2200)
  }

  /** The palette and the effective light/dark are written to the attributes _shared/theme.css keys the app's
     * tokens on — the same ones every other prototype page gets from demo-dimensions.js */
  function applyScheme() { document.documentElement.setAttribute('data-demo-theme', scheme) }
  function applyTheme() { document.documentElement.setAttribute('data-demo-mode', effTheme()) }

  function applyLang() {
    document.documentElement.setAttribute('lang', t().htmlLang)
    renderUpdateSlot()
  }

  function applyAll() { applyScheme(); applyTheme(); applyLang(); renderDemoOut() }

  /* ── The language dropdown overlay: fixed positioning, aligned to the trigger's rect ── */
  function positionPop() {
    const trig = document.getElementById('langTrigger')
    const pop = document.getElementById('langPop')
    if (!trig) return
    const r = trig.getBoundingClientRect()
    const h = pop.offsetHeight
    const below = window.innerHeight - r.bottom
    pop.style.left = `${Math.max(8, r.right - pop.offsetWidth)}px`
    pop.style.top = below >= h + 12 ? `${r.bottom + 6}px` : `${Math.max(8, r.top - h - 6)}px`
  }

  function renderPop() {
    const pop = document.getElementById('langPop')
    const resolved = curLang
    pop.innerHTML = OPTIONS.map((id, i) => {
      const on = id === langPref
      const cur = i === cursor
      const isSys = id === 'system'
      const name = isSys ? t().followSystem : T[id].native
      const side = isSys ? T[resolved].native : T[id].english
      const row = `
        <button type="button" role="option" class="lang-opt ${on ? 'on' : ''} ${cur ? 'cursor' : ''}"
                aria-selected="${on}" data-lang="${id}">
          <span class="n">${esc(name)}</span>
          <span class="e">${esc(side)}</span>
          <span class="ck">${ICONS.Check(14)}</span>
        </button>`
      return isSys ? row + '<div class="sep"></div>' : row
    }).join('')
    pop.querySelectorAll('[data-lang]').forEach((b) => {
      b.onclick = () => setLang(b.getAttribute('data-lang'))
    })
  }

  function openPop() {
    popOpen = true
    cursor = OPTIONS.indexOf(langPref)
    const pop = document.getElementById('langPop')
    renderPop()
    pop.classList.add('open')
    positionPop()
    document.getElementById('langTrigger').setAttribute('aria-expanded', 'true')
  }

  function closePop() {
    popOpen = false
    document.getElementById('langPop').classList.remove('open')
    const trig = document.getElementById('langTrigger')
    if (trig) trig.setAttribute('aria-expanded', 'false')
  }

  function setLang(id) {
    const same = id === langPref
    langPref = id
    closePop()
    if (id !== 'system') curLang = id
    publish(id === 'system' ? {} : { language: id })
    applyAll()
    render()
    if (!same) {
      const eff = T[effLang()].native
      toast(id === 'system' ? t().toastFollowSystem(eff) : t().toastLang(eff))
    }
    document.getElementById('langTrigger')?.focus()
  }

  function setMode(id) {
    if (id === modePref) return
    modePref = id
    if (id !== 'system') curMode = id
    publish(id === 'system' ? {} : { mode: id })
    applyAll()
    render()
    toast(t().toastMode(id === 'system'
      ? `${t().followSystem} · ${effTheme() === 'dark' ? t().dark : t().light}`
      : modeName(id)))
  }

  function setScheme(id) {
    if (id === scheme) return
    scheme = id
    publish({ theme: id })
    applyAll()
    render()
    toast(t().toastScheme(t().schemeNames[scheme]))
  }

  function render() {
    const stage = document.getElementById('stage')
    stage.innerHTML = renderSettings()

    stage.querySelectorAll('[data-scheme]').forEach((b) => {
      b.onclick = () => setScheme(b.getAttribute('data-scheme'))
    })
    stage.querySelectorAll('[data-mode]').forEach((b) => {
      b.onclick = () => setMode(b.getAttribute('data-mode'))
    })
    stage.querySelectorAll('[data-auto]').forEach((b) => {
      b.onclick = () => {
        if (b.getAttribute('aria-disabled') === 'true') return
        const v = b.getAttribute('data-auto') === 'true'
        if (v === autoCheck) return
        autoCheck = v
        render()
      }
    })
    const verAct = document.getElementById('verAct')
    if (verAct) verAct.onclick = () => {
      const a = rowAction()
      if (a.disabled) return
      if (a.install) install()
      else runCheck('settings')
    }

    const trig = document.getElementById('langTrigger')
    if (trig) {
      trig.onclick = (e) => { e.stopPropagation(); popOpen ? closePop() : openPop() }
      trig.onkeydown = (e) => {
        if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') {
          // The keystroke that opened it must not also bubble to the overlay's navigation listener, or one press
        // would both open and move a step
          if (!popOpen) { e.preventDefault(); e.stopPropagation(); openPop() }
        }
      }
    }
    // Scrolling the settings page unanchors the overlay (fixed does not follow a scroll container), so just
      // close it
    const pane = document.getElementById('settingsPane')
    if (pane) pane.onscroll = () => { if (popOpen) closePop() }
  }

  /* ── Demo harness wiring (data-demo-harness) ── */
  function renderDemoOut() {
    const lg = T[effLang()].native
    const th = effTheme() === 'dark' ? '深色' : '浅色'
    document.getElementById('sysOut').textContent = `生效:${lg} · ${th}`
  }

  document.addEventListener('keydown', (e) => {
    if (!popOpen) return
    if (e.key === 'Escape') { e.preventDefault(); closePop(); document.getElementById('langTrigger')?.focus() }
    else if (e.key === 'ArrowDown') { e.preventDefault(); cursor = (cursor + 1) % OPTIONS.length; renderPop(); positionPop() }
    else if (e.key === 'ArrowUp') { e.preventDefault(); cursor = (cursor - 1 + OPTIONS.length) % OPTIONS.length; renderPop(); positionPop() }
    else if (e.key === 'Enter') { e.preventDefault(); setLang(OPTIONS[cursor]) }
  })
  document.addEventListener('click', (e) => {
    if (popOpen && !e.target.closest('#langPop') && !e.target.closest('#langTrigger')) closePop()
  })
  window.addEventListener('resize', () => { if (popOpen) positionPop() })

  /* ── Demo harness wiring for updates (data-demo-harness): no such controls exist in the app ── */
  /** One group of option buttons: the pressed one is the value; pick(value) runs on a change */
  function options(id, attr, pick) {
    const group = document.getElementById(id)
    group.addEventListener('click', (e) => {
      const b = e.target.closest(`[data-${attr}]`)
      if (!b || b.getAttribute('aria-pressed') === 'true') return
      group.querySelectorAll(`[data-${attr}]`).forEach((x) => x.setAttribute('aria-pressed', String(x === b)))
      pick(b.dataset[attr])
    })
  }
  options('runOpts', 'run', (v) => {
    packaged = v === 'packaged'
    if (!packaged) { clearInterval(dlTimer); upd = 'idle'; pct = 0; checkOut = null; renderUpdateSlot() }
    render()
  })
  options('nextOpts', 'next', (v) => { nextOutcome = v })
  options('instOpts', 'inst', (v) => { nextInstall = v })
  document.getElementById('actAuto').onclick = () => runCheck('auto')
  document.getElementById('actMenu').onclick = () => {
    if (!packaged) { demoNote('演示：开发运行中菜单项「检查更新…」置灰'); return }
    runCheck('menu')
  }
  document.getElementById('actFail').onclick = failDownload
  document.getElementById('actQuit').onclick = quitAndReopen

  /* ── Following the gallery's settings: each value in effect arrives on load and whenever it changes. An
     explicit preference that differs becomes an explicit choice of the value received; "follow system" stays
     and shows it. Only the preferences are saved here: writing this page's own values back would undo the
     reader's choice in the gallery, and on load it would overwrite a value another dimension just received. ── */
  function align() { DemoDimensions.set({}, prefs()); applyAll(); render() }
  DemoDimensions.on('language', (v) => {
    curLang = v
    if (langPref !== 'system' && langPref !== v) langPref = v
    align()
  })
  DemoDimensions.on('mode', (v) => {
    curMode = v
    if (modePref !== 'system' && modePref !== v) modePref = v
    align()
  })
  DemoDimensions.on('theme', (v) => {
    if (scheme !== v) scheme = v
    align()
  })
</script>
<script>
  // Cross-prototype navigation: inside the gallery ask the parent page to switch; when opened alone, go to the file directly
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-goto]');
    if (!el) return;
    if (window.parent !== window) parent.postMessage({ type: 'proto-nav', target: el.dataset.goto }, '*');
    else if (el.dataset.gotoHref) location.href = el.dataset.gotoHref;
  });
</script>
<script src="../demo-harness.js"></script>
</body>
