<!doctype html>
<!-- A UI prototype · appearance: the settings page's two sections —
     语言(跟随系统 + 六选一)/ 外观(模式:跟随系统·浅色·深色 × 配色:紫·雾蓝·琥珀褐)。
     两处「跟随系统」是同一个模型:偏好是策略,生效值由系统解析,系统变则界面变;选定具体值即锁定。

     明暗:本原型在浏览器里跑、没有 Electron,只能用 JS 写 <html data-theme> 来模拟切换。
     真代码不走这条路——Electron 的 nativeTheme.themeSource('system'|'light'|'dark')会直接
     改变 prefers-color-scheme 的求值结果,现有媒体查询零改动即生效,且 macOS 窗口边框与
     原生菜单一并跟随(纯 CSS 方案做不到这点)。此处的 data-theme 仅是原型载体的替身。

     演示基建(data-demo-harness,非设计的一部分,勿实现):底部悬浮条两组开关。
     真实来源:语言 = app.getPreferredSystemLanguages();明暗 = prefers-color-scheme 媒体查询。
     app 内没有这两个控件,此处仅为让「跟随系统」的解析结果在任意宿主环境下都可见。 -->
<html lang="zh-CN" data-scheme="purple" data-theme="light">
<head>
<meta charset="utf-8">
<title>原型 — 设置 · 语言与外观</title>
<style>
  /* ── Purple (the shipped default) ── */
  html[data-scheme="purple"][data-theme="light"] {
    --bg: #f7f8f9;
    --card: #ffffff;
    --text: #37352f;
    --text-2: #787774;
    --line: #e8eaed;
    --line-strong: #d9dce0;
    --accent: #8a67ab;
    --accent-deep: #6b4f92;
    --accent-soft: #f0ebf6;
    --shadow: 0 8px 24px rgba(55, 53, 47, .14);
    --ok-bg: #dcfce7; --ok-fg: #166534;
    /* Claude 徽章取 Anthropic 品牌橙(#d97757)的色相,不再是紫——ADR-0021 只迁了 Grok,
       Claude 这半没做。L/C 与 cx 那对同档。
       **三套配色下取值相同**:侧别色是数据色,只随明暗变、不随配色方案变(ADR-0021;真 app 的
       --cl-* 也只声明在 :root 与暗色块里)。本原型此前给每套配色各调了一版,是与实现不符的腐烂。
       --cx-* 同此:三套配色下取值相同。侧别色是数据色,配色方案换的是界面色不是数据色。 */
    --cl-bg: #f9e2da; --cl-fg: #a05239;
    --cx-bg: #dcefe4; --cx-fg: #1f7a4d;
  }
  html[data-scheme="purple"][data-theme="dark"] {
    --bg: #18191b;
    --card: #1f2124;
    --text: #e6e6e5;
    --text-2: #9b9a97;
    --line: #2a2c30;
    --line-strong: #34373c;
    --accent: #a084c7;
    --accent-deep: #c9b3ec;
    --accent-soft: #2c2733;
    --shadow: 0 8px 24px rgba(0, 0, 0, .55);
    --ok-bg: #12301d; --ok-fg: #86efac;
    --cl-bg: #4c2d21; --cl-fg: #f8ac8f;
    --cx-bg: #1d3a2b; --cx-fg: #7fd6a4;
  }
  /* ── Mist blue ── */
  html[data-scheme="blue"][data-theme="light"] {
    --bg: #f6f5f3;
    --card: #fffcf9;
    --text: #2c2a28;
    --text-2: #6f6b66;
    --line: #e8e4de;
    --line-strong: #d4cfc7;
    --accent: #4a6fa5;
    --accent-deep: #3a5a88;
    --accent-soft: #eef2f7;
    --shadow: 0 8px 24px rgba(44, 42, 40, .14);
    --ok-bg: #dcfce7; --ok-fg: #166534;
    --cl-bg: #f9e2da; --cl-fg: #a05239;
    --cx-bg: #dcefe4; --cx-fg: #1f7a4d;
  }
  html[data-scheme="blue"][data-theme="dark"] {
    --bg: #16181c;
    --card: #1c1f24;
    --text: #e6e4e0;
    --text-2: #9a9690;
    --line: #2a2e34;
    --line-strong: #3a4048;
    --accent: #7a9dc4;
    --accent-deep: #a8c0dc;
    --accent-soft: #1e2a38;
    --shadow: 0 8px 24px rgba(0, 0, 0, .55);
    --ok-bg: #12301d; --ok-fg: #86efac;
    --cl-bg: #4c2d21; --cl-fg: #f8ac8f;
    --cx-bg: #1d3a2b; --cx-fg: #7fd6a4;
  }
  /* ── Amber brown ── */
  html[data-scheme="amber"][data-theme="light"] {
    --bg: #f7f3ec;
    --card: #fffcf7;
    --text: #3a342c;
    --text-2: #7a7268;
    --line: #e8e0d4;
    --line-strong: #d6ccbc;
    --accent: #6b5220;
    --accent-deep: #534018;
    --accent-soft: #f3ead4;
    --shadow: 0 8px 24px rgba(58, 52, 44, .14);
    --ok-bg: #dcfce7; --ok-fg: #166534;
    --cl-bg: #f9e2da; --cl-fg: #a05239;
    --cx-bg: #dcefe4; --cx-fg: #1f7a4d;
  }
  html[data-scheme="amber"][data-theme="dark"] {
    --bg: #1a1714;
    --card: #221e1a;
    --text: #ebe4d8;
    --text-2: #a09888;
    --line: #332e28;
    --line-strong: #453e36;
    --accent: #c4a46a;
    --accent-deep: #ddc48e;
    --accent-soft: #2e2820;
    --shadow: 0 8px 24px rgba(0, 0, 0, .55);
    --ok-bg: #12301d; --ok-fg: #86efac;
    --cl-bg: #4c2d21; --cl-fg: #f8ac8f;
    --cx-bg: #1d3a2b; --cx-fg: #7fd6a4;
  }

  *{box-sizing:border-box;margin:0;font-family:-apple-system,"PingFang SC","Hiragino Sans",system-ui,sans-serif}
  body{display:flex;height:100vh;overflow:hidden;background:var(--bg);color:var(--text);font-size:13px}

  .rail{
    width:48px;flex:none;background:var(--card);border-right:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:6px}
  .ri{
    width:36px;height:36px;border:0;border-radius:8px;display:flex;align-items:center;
    justify-content:center;font-size:16px;cursor:pointer;color:var(--text-2);background:transparent}
  .ri:hover{background:var(--accent-soft)}
  .ri.on{background:var(--accent-soft);color:var(--accent)}
  .ri.grfr{margin-top:auto}
  .ri.set{margin-bottom:10px}

  .stage{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
  .pane{flex:1;overflow:auto;padding:16px 22px}
  .h1{font-size:16px;font-weight:700;margin-bottom:4px;color:var(--accent)}
  .sub{font-size:12px;color:var(--text-2);margin-bottom:14px;line-height:1.5}
  .stats{display:flex;gap:12px;margin-bottom:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:140px}
  .stat .k{font-size:10.5px;color:var(--text-2);margin-bottom:4px}
  .stat .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px}
  .tab{padding:8px 12px;color:var(--text-2);font-size:12.5px;border-radius:7px 7px 0 0}
  .tab.on{color:var(--accent);font-weight:600;background:var(--bg);border:1px solid var(--line);border-bottom-color:var(--bg);margin-bottom:-1px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px}
  .it{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
  .it:first-child{border-top:0}
  .nm{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;font-weight:600;color:var(--accent-deep);width:140px}
  .ds{flex:1;color:var(--text-2);font-size:12px}
  .b{font-size:9px;font-weight:700;border-radius:4px;padding:2px 5px}
  .b.c{background:var(--cl-bg);color:var(--cl-fg)}
  .b.x{background:var(--cx-bg);color:var(--cx-fg)}

  .split{flex:1;display:flex;min-height:0}
  .side{width:240px;flex:none;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column}
  .side .search{margin:12px;padding:7px 10px;border:1px solid var(--line-strong);border-radius:7px;color:var(--text-2);background:var(--bg);font-size:12px}
  .side .row{margin:2px 8px;padding:8px 10px;border-radius:7px;font-size:12.5px}
  .side .row.on{background:var(--accent-soft);color:var(--accent-deep);font-weight:600}
  .detail{flex:1;padding:20px 22px;color:var(--text-2);font-size:12.5px;line-height:1.6}

  .settings{flex:1;overflow:auto;padding:20px 28px 60px;max-width:720px}
  .settings .h1{font-size:18px;margin-bottom:6px}
  .settings .lead{font-size:12.5px;color:var(--text-2);margin-bottom:22px;line-height:1.5}
  .sec-t{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-2);margin-bottom:10px}
  .sec{margin-bottom:24px}

  /* ── A settings row: the label on the left, the control on the right. Language and appearance share the
     same form ── */
  .field{background:var(--card);border:1px solid var(--line-strong);border-radius:12px}
  .frow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 16px}
  .frow + .frow{border-top:1px solid var(--line)}
  .flabel{font-size:13px;font-weight:600;flex:none}

  .lang-trigger{
    display:flex;align-items:center;gap:10px;min-width:230px;justify-content:space-between;
    padding:8px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);
    color:inherit;font:inherit;font-size:12.5px;cursor:pointer}
  .lang-trigger:hover{border-color:var(--accent);background:var(--accent-soft)}
  .lang-trigger:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .lang-trigger[aria-expanded="true"]{border-color:var(--accent);background:var(--accent-soft)}
  .lang-trigger .cur{font-weight:600;display:flex;align-items:baseline;gap:6px;min-width:0}
  .lang-trigger .cur .eff{font-weight:400;font-size:11.5px;color:var(--text-2)}
  .lang-trigger .chev{flex:none;color:var(--text-2);display:flex;transition:transform .15s}
  .lang-trigger[aria-expanded="true"] .chev{transform:rotate(180deg)}

  /* The overlay is fixed: the settings page container is overflow:auto, which would clip an absolute one */
  .lang-pop{
    position:fixed;z-index:60;display:none;min-width:262px;padding:4px;
    background:var(--card);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow)}
  .lang-pop.open{display:block}
  .lang-opt{
    display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:7px;
    background:transparent;color:inherit;font:inherit;font-size:12.5px;cursor:pointer;text-align:left}
  .lang-opt:hover,.lang-opt.cursor{background:var(--accent-soft)}
  .lang-opt .n{flex:1;font-weight:600}
  .lang-opt .e{color:var(--text-2);font-size:11.5px}
  .lang-opt .ck{flex:none;color:var(--accent);display:flex;visibility:hidden}
  .lang-opt.on .ck{visibility:visible}
  .lang-opt.on .n{color:var(--accent-deep)}
  .lang-pop .sep{height:1px;background:var(--line);margin:4px 8px}

  /* The segmented control: reusing the .seg form from the real code's theme.css (inline-flex + an outer frame
     + overflow clipping +
     选中态 accent-soft),尺寸按设置页语境略放大(真代码是图表工具栏用的 11px/3px) */
  .seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden}
  .seg button{
    font:inherit;font-size:12px;padding:5px 13px;border:0;cursor:pointer;
    color:var(--text-2);background:transparent}
  .seg button:hover{color:var(--text);background:var(--bg)}
  .seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

  /* Colour schemes: small cards in a row keeping only a swatch and a name (the full-sentence description was
     dropped when compacting) */
  .pal-grid{display:flex;gap:8px}
  .pal{
    display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 11px;
    border:1px solid var(--line-strong);border-radius:9px;background:var(--bg);
    cursor:pointer;color:inherit;font:inherit}
  .pal:hover{border-color:var(--accent);background:var(--accent-soft)}
  .pal.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
  .pal:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .pal .sw-row{display:flex;gap:3px}
  .pal .sw{width:13px;height:13px;border-radius:4px;border:1px solid var(--line-strong)}
  .pal .pal-n{font-size:11.5px;font-weight:600;color:var(--text-2);white-space:nowrap}
  .pal.on .pal-n{color:var(--accent-deep)}

  .foot{margin-top:10px;padding:11px 14px;border-radius:10px;background:var(--bg);
    border:1px dashed var(--line-strong);font-size:12px;color:var(--text-2);line-height:1.5}
  .foot b{color:var(--text);font-weight:600}
  .toast{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);z-index:80;
    background:var(--ok-bg);color:var(--ok-fg);border-radius:10px;padding:10px 16px;font-size:12.5px;display:none}
  .note{margin-top:22px;padding:12px 14px;border:1px dashed var(--line-strong);border-radius:10px;
    font-size:11.5px;color:var(--text-2);line-height:1.55}
  .note b{color:var(--text)}

  /* ── The demo harness (not part of the design): an independent floating layer that deliberately does not
     reuse the styles of the controls being judged ── */
  .demo-bar{
    position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:90;
    display:flex;align-items:center;gap:9px;padding:7px 12px;border-radius:999px;
    background:#1c1c1e;color:#e8e8ea;font-size:11.5px;box-shadow:0 6px 20px rgba(0,0,0,.38)}
  .demo-bar .tag{font-weight:700;color:#8e8e93;letter-spacing:.03em;flex:none}
  .demo-bar .vr{width:1px;height:16px;background:#3a3a3c;flex:none}
  .demo-bar select{
    background:#2c2c2e;color:#e8e8ea;border:1px solid #3a3a3c;border-radius:7px;
    padding:4px 8px;font:inherit;font-size:11.5px;cursor:pointer}
  .demo-bar .out{color:#8e8e93}
  .demo-bar .out b{color:#e8e8ea;font-weight:600}
</style>
</head>
<body>
  <nav class="rail">
    <button type="button" class="ri" data-dim="agents" data-tip="agents" data-icon="RobotFace" data-icon-size="17"></button>

<script src="../_shared/icons.js"></script>

      secLang: 'Язык', ifaceLang: 'Язык интерфейса', followSystem: 'Следовать системе',

      secAppear: 'Оформление', modeLabel: 'Режим', paletteLabel: 'Палитра',

      rail: { agents: 'Agents', projects: 'Проекты', refresh: 'Обновить всё', settings: 'Настройки' },

      tabs: ['Skills', 'Token', 'Конфигурация'],
      search: 'Поиск проектов…',
      detail: 'Пример страницы проекта. Подсветка выбора и цвет заголовка следуют схеме; семантические цвета CC / CX остаются независимыми.',
      toastScheme: (n) => `Палитра переключена на «${n}»`,
      toastMode: (n) => `Режим оформления: ${n}`,
      toastLang: (n) => `Язык интерфейса переключён на ${n}`,
      toastFollowSystem: (n) => `Теперь следует системе · сейчас ${n}`,
      toastRefresh: 'Обновить всё (пример)'
    },
    ja: {
      native: '日本語', english: 'Japanese', htmlLang: 'ja',
      settings: '設定',
      lead: 'この app 固有の設定です。インターフェース全体に適用され、Claude や Codex の設定には書き込まれません。',
      secLang: '言語', ifaceLang: 'インターフェースの言語', followSystem: 'システムに従う',
      langFoot: '「システムに従う」を選ぶと、インターフェースは macOS の優先言語に従います。いずれも対応していない場合は英語になります。',
      secAppear: '外観', modeLabel: 'モード', paletteLabel: 'パレット',
      light: 'ライト', dark: 'ダーク',
      schemeNames: { purple: 'パープル', blue: 'ミストブルー', amber: 'アンバー' },
      appearFoot: (b) => `モードを「${b('システムに従う')}」にすると、明暗は macOS の外観に従います。パレットと明暗は独立していて自由に組み合わせられます。未選択の場合はパープルです。変更は保存不要で app 全体にすぐ反映されます。`,
      rail: { agents: 'Agents', projects: 'Projects', refresh: 'すべて更新', settings: '設定' },
      agentsSub: 'プレビュー · 現在のテーマは app 全体に適用されているはずです（アクセント色とカード面）',
      tabs: ['Skills', 'Token', '設定'],
      search: 'プロジェクトを検索…',
      detail: 'プロジェクト詳細のプレビュー。選択のハイライトと見出し色はスキームに追従し、CC / CX の意味色は独立を保ちます。',
      toastScheme: (n) => `パレットを「${n}」に切り替えました`,
      toastMode: (n) => `外観モード：${n}`,
      toastLang: (n) => `インターフェースの言語を ${n} に変更しました`,
      toastFollowSystem: (n) => `システムに従う設定にしました · 現在は ${n}`,
      toastRefresh: 'すべて更新（プレビュー）'

  }

  /** Palette preview samples (card / accent-soft / accent / text), in two sets by light and dark —
      色板是所见即所得的预览,深色下若仍显示浅色取样会与实际界面不符。
      值直接取自上方各主题变量块,改主题色须同步改这里。 */
  const SWATCHES = {
    light: {
      purple: ['#ffffff', '#f0ebf6', '#8a67ab', '#37352f'],
      blue: ['#fffcf9', '#eef2f7', '#4a6fa5', '#2c2a28'],
      amber: ['#fffcf7', '#f3ead4', '#6b5220', '#3a342c']
    },
    dark: {
      purple: ['#1f2124', '#2c2733', '#a084c7', '#e6e6e5'],
      blue: ['#1c1f24', '#1e2a38', '#7a9dc4', '#e6e4e0'],
      amber: ['#221e1a', '#2e2820', '#c4a46a', '#ebe4d8']
    }
  }

  /* ── Demo harness data (not part of the design): simulating what app.getPreferredSystemLanguages()
     returns.
        每一档对应 spec「启动与语言决定」里的一条边界。 ── */
  const SYS_CASES = [
    { id: 'zh',    label: '简体中文 [zh-Hans-CN]',        list: ['zh-Hans-CN'] },
    { id: 'en',    label: '英文 [en-US]',                  list: ['en-US'] },
    { id: 'frCA',  label: '加拿大法语 [fr-CA] · 地区变体',  list: ['fr-CA'] },
    { id: 'ja',    label: '日语 [ja-JP]',                  list: ['ja-JP'] },
    { id: 'ko',    label: '韩语 [ko-KR] · 不支持',          list: ['ko-KR'] },
    { id: 'koFr',  label: '[ko, fr, en] · 取首个受支持',    list: ['ko-KR', 'fr-FR', 'en-US'] },
    { id: 'empty', label: '空列表 [] · 探测失败',           list: [] }
  ]

  let dim = 'settings'
  /** The three preferences: colour scheme, appearance mode and language. 'system' in the latter two is a
     * policy rather than a snapshot */
  let scheme = 'purple'
  let modePref = 'system'
  let langPref = 'system'
  let sysCase = 'zh'
  let mockSystemDark = false   // 演示工装:替代真实 prefers-color-scheme
  let popOpen = false
  let cursor = 0

  /** The system's preferred language list → the effective language: take the first supported one in priority
     * order, falling back to English if none match */
  function resolveSystem(list) {
    for (const tag of list) {
      const primary = String(tag).split('-')[0].toLowerCase()
      if (LANGS.includes(primary)) return primary
    }
    return 'en'
  }

  const sysList = () => (SYS_CASES.find((c) => c.id === sysCase) || SYS_CASES[0]).list
  const effLang = () => (langPref === 'system' ? resolveSystem(sysList()) : langPref)
  /** Appearance mode → the effective light/dark. Structurally identical to language: the preference is a
     * policy, and the effective value is what actually lands on the DOM */
  const effTheme = () => (modePref === 'system' ? (mockSystemDark ? 'dark' : 'light') : modePref)
  const t = () => T[effLang()]
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
  const modeName = (id) => (id === 'system' ? t().followSystem : id === 'light' ? t().light : t().dark)

  function toast(msg) {
    const el = document.getElementById('toast')
    el.textContent = msg
    el.style.display = 'block'
    clearTimeout(toast._tm)
    toast._tm = setTimeout(() => { el.style.display = 'none' }, 2200)
  }

  function applyScheme() { document.documentElement.setAttribute('data-scheme', scheme) }
  /** The effective light/dark is written to <html data-theme>, reusing the :root[data-theme] convention the
     * real code's theme.css already has */
  function applyTheme() { document.documentElement.setAttribute('data-theme', effTheme()) }

  function applyLang() {
    document.documentElement.setAttribute('lang', t().htmlLang)
    document.querySelectorAll('.rail [data-tip]').forEach((b) => {
      b.setAttribute('title', t().rail[b.getAttribute('data-tip')])
    })
  }

  function applyAll() { applyScheme(); applyTheme(); applyLang(); renderDemoOut() }

  function setDim(d) {
    dim = d
    closePop()
    document.querySelectorAll('.rail [data-dim]').forEach((b) => {
      b.classList.toggle('on', b.getAttribute('data-dim') === d)
    })
    render()
  }

  /* ── The language dropdown overlay: fixed positioning, aligned to the trigger's rect ── */
  function positionPop() {
    const trig = document.getElementById('langTrigger')
    const pop = document.getElementById('langPop')
    if (!trig) return
    const r = trig.getBoundingClientRect()
    const h = pop.offsetHeight
    const below = window.innerHeight - r.bottom
    pop.style.left = `${Math.max(8, r.right - pop.offsetWidth)}px`
    pop.style.top = below >= h + 12 ? `${r.bottom + 6}px` : `${Math.max(8, r.top - h - 6)}px`
  }

  function renderPop() {
    const pop = document.getElementById('langPop')
    const resolved = resolveSystem(sysList())
    pop.innerHTML = OPTIONS.map((id, i) => {
      const on = id === langPref
      const cur = i === cursor
      const isSys = id === 'system'
      const name = isSys ? t().followSystem : T[id].native
      const side = isSys ? T[resolved].native : T[id].english
      const row = `
        <button type="button" role="option" class="lang-opt ${on ? 'on' : ''} ${cur ? 'cursor' : ''}"
                aria-selected="${on}" data-lang="${id}">
          <span class="n">${esc(name)}</span>
          <span class="e">${esc(side)}</span>
          <span class="ck">${ICONS.Check(14)}</span>
        </button>`
      return isSys ? row + '<div class="sep"></div>' : row
    }).join('')
    pop.querySelectorAll('[data-lang]').forEach((b) => {
      b.onclick = () => setLang(b.getAttribute('data-lang'))
    })
  }

  function openPop() {
    popOpen = true
    cursor = OPTIONS.indexOf(langPref)
    const pop = document.getElementById('langPop')
    renderPop()
    pop.classList.add('open')
    positionPop()
    document.getElementById('langTrigger').setAttribute('aria-expanded', 'true')
  }

  function closePop() {
    popOpen = false
    document.getElementById('langPop').classList.remove('open')
    const trig = document.getElementById('langTrigger')
    if (trig) trig.setAttribute('aria-expanded', 'false')
  }

  function setLang(id) {
    const same = id === langPref
    langPref = id
    closePop()
    applyAll()
    render()
    if (!same) {
      const eff = T[effLang()].native
      toast(id === 'system' ? t().toastFollowSystem(eff) : t().toastLang(eff))
    }
    document.getElementById('langTrigger')?.focus()
  }

  function setMode(id) {
    if (id === modePref) return
    modePref = id
    applyAll()
    render()
    toast(t().toastMode(id === 'system'
      ? `${t().followSystem} · ${effTheme() === 'dark' ? t().dark : t().light}`
      : modeName(id)))
  }

  function setScheme(id) {
    if (id === scheme) return
    scheme = id
    applyAll()
    render()
    toast(t().toastScheme(t().schemeNames[scheme]))
  }

  function renderSettings() {
    const d = t()
    const bold = (s) => `<b>${esc(s)}</b>`
    const following = langPref === 'system'
    return `
      <div class="settings" id="settingsPane">
        <div class="h1">${esc(d.settings)}</div>
        <div class="lead">${esc(d.lead)}</div>

        <div class="sec">
          <div class="sec-t">${esc(d.secLang)}</div>
          <div class="field">
            <div class="frow">
              <span class="flabel">${esc(d.ifaceLang)}</span>
              <button type="button" class="lang-trigger" id="langTrigger"
                      aria-haspopup="listbox" aria-expanded="false">
                <span class="cur">
                  ${esc(following ? d.followSystem : d.native)}
                  ${following ? `<span class="eff">${esc(T[effLang()].native)}</span>` : ''}
                </span>
                <span class="chev">${ICONS.ChevronDown(14)}</span>
              </button>
            </div>
          </div>
          <div class="foot">${esc(d.langFoot)}</div>
        </div>

        <div class="sec">
          <div class="sec-t">${esc(d.secAppear)}</div>
          <div class="field">
            <div class="frow">
              <span class="flabel">${esc(d.modeLabel)}</span>
              <span class="seg" role="radiogroup" aria-label="${esc(d.modeLabel)}">
                ${MODES.map((m) => `
                  <button type="button" role="radio" aria-checked="${m === modePref}"
                          class="${m === modePref ? 'on' : ''}" data-mode="${m}">${esc(modeName(m))}</button>
                `).join('')}
              </span>
            </div>
            <div class="frow">
              <span class="flabel">${esc(d.paletteLabel)}</span>
              <div class="pal-grid" role="radiogroup" aria-label="${esc(d.paletteLabel)}">
                ${['purple', 'blue', 'amber'].map((id) => `
                  <button type="button" role="radio" aria-checked="${id === scheme}"
                          class="pal ${id === scheme ? 'on' : ''}" data-scheme="${id}">
                    <span class="sw-row">${SWATCHES[effTheme()][id].map((c) => `<span class="sw" style="background:${c}"></span>`).join('')}</span>
                    <span class="pal-n">${esc(d.schemeNames[id])}</span>
                  </button>
                `).join('')}
              </div>
            </div>
          </div>
          <div class="foot">${d.appearFoot(bold)}</div>
        </div>

        <div class="note">
          <b>验收</b>：① 明暗三选一，选「浅色 / 深色」后<b>不再随系统变</b>，选「跟随系统」则跟着变
          ② 用底部演示条改系统明暗验证上一条；语言与明暗两个「跟随系统」互不干扰
          ③ 外观压缩为一张卡两行（模式 / 配色），配色卡去掉了整句描述，只留色块 + 名称
          ④ 3 配色 × 2 明暗 = 6 种组合都要能看：浮层边框与投影、选中态、CC/CX 语义色均可辨
          ⑥ 色板取样随明暗切换——深色下三张卡应呈深色系，不再出现纯白色块
          ⑤ 语言浮层不被设置页 overflow:auto 裁掉，键盘七项循环<br>
          <b>实现要点</b>：真代码用 Electron 的 <code>nativeTheme.themeSource</code>（官方三态：
          Follow OS / Light / Dark），它直接改变 <code>prefers-color-scheme</code> 的求值结果——
          现有 theme.css 的媒体查询<b>零改动</b>即生效，macOS 窗口边框与原生菜单也一并跟随。
          本页的 <code>data-theme</code> 只是浏览器里没有 Electron 时的替身，<b>勿照抄进实现</b>。<br>
          <b>已确认</b>（2026-08-08）：配色卡去掉整句描述、只留色块 + 名称，「默认为紫」移入段末说明；
          语言分节置于外观之前；整体形态定稿。<br>
          <b>演示基建</b>：底部悬浮条不是设计的一部分，勿实现。真实来源是
          <code>app.getPreferredSystemLanguages()</code> 与 <code>prefers-color-scheme</code>。
        </div>
      </div>`
  }

  function renderAgents() {
    const d = t()
    return `
      <div class="pane">
        <div class="h1">Agents</div>
        <div class="sub">${esc(d.agentsSub)}</div>
        <div class="stats">
          <div class="stat"><div class="k"><span class="b c">CC</span> Claude</div><div class="v">12.4M</div></div>
          <div class="stat"><div class="k"><span class="b x">CX</span> Codex</div><div class="v">3.1M</div></div>
        </div>
        <div class="tabs">${d.tabs.map((x, i) => `<div class="tab ${i === 0 ? 'on' : ''}">${esc(x)}</div>`).join('')}</div>
        <div class="card">
          <div class="it"><span class="nm">github-ops</span><span class="b c">CC</span><span class="b x">CX</span><span class="ds">Rules for ANY GitHub operation…</span></div>
          <div class="it"><span class="nm">tdd</span><span class="b c">CC</span><span class="ds">Red before green</span></div>
        </div>
      </div>`
  }

  function renderProjects() {
    const d = t()
    return `
      <div class="split">
        <div class="side">
          <div class="search">${ICONS.Search(13)} ${esc(d.search)}</div>
          <div class="row on">agentshed</div>
          <div class="row">Transfer</div>
        </div>
        <div class="detail">
          <div class="h1" style="margin-bottom:8px">agentshed</div>
          ${esc(d.detail)}
        </div>
      </div>`
  }

  function render() {
    const stage = document.getElementById('stage')
    if (dim === 'settings') stage.innerHTML = renderSettings()
    else if (dim === 'projects') stage.innerHTML = renderProjects()
    else stage.innerHTML = renderAgents()

    stage.querySelectorAll('[data-scheme]').forEach((b) => {
      b.onclick = () => setScheme(b.getAttribute('data-scheme'))
    })
    stage.querySelectorAll('[data-mode]').forEach((b) => {
      b.onclick = () => setMode(b.getAttribute('data-mode'))
    })

    const trig = document.getElementById('langTrigger')
    if (trig) {
      trig.onclick = (e) => { e.stopPropagation(); popOpen ? closePop() : openPop() }
      trig.onkeydown = (e) => {
        if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') {
          // The keystroke that opened it must not also bubble to the overlay's navigation listener, or one press
        // would both open and move a step
          if (!popOpen) { e.preventDefault(); e.stopPropagation(); openPop() }
        }
      }
    }
    // Scrolling the settings page unanchors the overlay (fixed does not follow a scroll container), so just
      // close it
    const pane = document.getElementById('settingsPane')
    if (pane) pane.onscroll = () => { if (popOpen) closePop() }
  }

  /* ── Demo harness wiring (data-demo-harness) ── */
  function renderDemoOut() {
    const out = document.getElementById('sysOut')
    const lg = T[effLang()].native
    const th = effTheme() === 'dark' ? '深色' : '浅色'
    out.innerHTML = `→ 生效 <b>${esc(lg)}</b> · <b>${esc(th)}</b>`
  }

  const sel = document.getElementById('sysSel')
  sel.innerHTML = SYS_CASES.map((c) => `<option value="${c.id}">${c.label}</option>`).join('')
  sel.value = sysCase
  sel.onchange = () => {
    sysCase = sel.value
    applyAll(); render()
    toast(langPref === 'system'
      ? `演示：系统语言已改 · 界面随之变为 ${T[effLang()].native}`
      : `演示：系统语言已改 · 但偏好锁定为 ${T[langPref].native}，界面不变`)
  }

  const selTheme = document.getElementById('sysTheme')
  selTheme.value = mockSystemDark ? 'dark' : 'light'
  selTheme.onchange = () => {
    mockSystemDark = selTheme.value === 'dark'
    applyAll(); render()
    toast(modePref === 'system'
      ? `演示：系统明暗已改 · 界面随之变为${effTheme() === 'dark' ? '深色' : '浅色'}`
      : `演示：系统明暗已改 · 但模式锁定为${modeName(modePref)}，界面不变`)
  }

  document.addEventListener('keydown', (e) => {
    if (!popOpen) return
    if (e.key === 'Escape') { e.preventDefault(); closePop(); document.getElementById('langTrigger')?.focus() }
    else if (e.key === 'ArrowDown') { e.preventDefault(); cursor = (cursor + 1) % OPTIONS.length; renderPop(); positionPop() }
    else if (e.key === 'ArrowUp') { e.preventDefault(); cursor = (cursor - 1 + OPTIONS.length) % OPTIONS.length; renderPop(); positionPop() }
    else if (e.key === 'Enter') { e.preventDefault(); setLang(OPTIONS[cursor]) }
  })
  document.addEventListener('click', (e) => {
    if (popOpen && !e.target.closest('#langPop') && !e.target.closest('#langTrigger')) closePop()
  })
  window.addEventListener('resize', () => { if (popOpen) positionPop() })

  document.querySelectorAll('.rail [data-dim]').forEach((b) => {
    b.onclick = () => setDim(b.getAttribute('data-dim'))
  })
  document.getElementById('refresh').onclick = () => toast(t().toastRefresh)

  applyAll()
  setDim('settings')
</script>
</body>
</html>
