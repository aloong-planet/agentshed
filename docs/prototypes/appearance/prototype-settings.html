<!doctype html>
<!-- 原型(UI)· appearance:设置第三维;外观三选一(紫默认/雾蓝/琥珀褐)×系统昼夜。
     主题色对整 app 生效(rail + Agents/Projects 示意 + 设置页)。 -->
<html lang="zh-CN" data-scheme="purple">
<head>
<meta charset="utf-8">
<title>原型 — 设置 · 外观(紫/雾蓝/琥珀褐)</title>
<style>
  /* ── 紫(现网默认) · 浅 ── */
  html[data-scheme="purple"] {
    --bg: #f7f8f9;
    --card: #ffffff;
    --text: #37352f;
    --text-2: #787774;
    --line: #e8eaed;
    --line-strong: #d9dce0;
    --accent: #8a67ab;
    --accent-deep: #6b4f92;
    --accent-soft: #f0ebf6;
    --ok-bg: #dcfce7; --ok-fg: #166534;
    --cl-bg: #e8e0f3; --cl-fg: #6b4f92;
    --cx-bg: #dcefe4; --cx-fg: #1f7a4d;
  }
  @media (prefers-color-scheme: dark) {
    html[data-scheme="purple"] {
      --bg: #18191b;
      --card: #1f2124;
      --text: #e6e6e5;
      --text-2: #9b9a97;
      --line: #2a2c30;
      --line-strong: #34373c;
      --accent: #a084c7;
      --accent-deep: #c9b3ec;
      --accent-soft: #2c2733;
      --ok-bg: #12301d; --ok-fg: #86efac;
      --cl-bg: #3a3153; --cl-fg: #c9b3ec;
      --cx-bg: #1d3a2b; --cx-fg: #7fd6a4;
    }
  }
  /* ── 雾蓝 · 浅 ── */
  html[data-scheme="blue"] {
    --bg: #f6f5f3;
    --card: #fffcf9;
    --text: #2c2a28;
    --text-2: #6f6b66;
    --line: #e8e4de;
    --line-strong: #d4cfc7;
    --accent: #4a6fa5;
    --accent-deep: #3a5a88;
    --accent-soft: #eef2f7;
    --ok-bg: #dcfce7; --ok-fg: #166534;
    --cl-bg: #e4ebf5; --cl-fg: #3a5a88;
    --cx-bg: #e2efe8; --cx-fg: #2d6b52;
  }
  @media (prefers-color-scheme: dark) {
    html[data-scheme="blue"] {
      --bg: #16181c;
      --card: #1c1f24;
      --text: #e6e4e0;
      --text-2: #9a9690;
      --line: #2a2e34;
      --line-strong: #3a4048;
      --accent: #7a9dc4;
      --accent-deep: #a8c0dc;
      --accent-soft: #1e2a38;
      --ok-bg: #12301d; --ok-fg: #86efac;
      --cl-bg: #243448; --cl-fg: #a8c0dc;
      --cx-bg: #1d3a2b; --cx-fg: #7fd6a4;
    }
  }
  /* ── 琥珀褐 · 浅 ── */
  html[data-scheme="amber"] {
    --bg: #f7f3ec;
    --card: #fffcf7;
    --text: #3a342c;
    --text-2: #7a7268;
    --line: #e8e0d4;
    --line-strong: #d6ccbc;
    --accent: #6b5220;
    --accent-deep: #534018;
    --accent-soft: #f3ead4;
    --ok-bg: #dcfce7; --ok-fg: #166534;
    --cl-bg: #ebe4d8; --cl-fg: #6b5220;
    --cx-bg: #e2efe8; --cx-fg: #2d6b52;
  }
  @media (prefers-color-scheme: dark) {
    html[data-scheme="amber"] {
      --bg: #1a1714;
      --card: #221e1a;
      --text: #ebe4d8;
      --text-2: #a09888;
      --line: #332e28;
      --line-strong: #453e36;
      --accent: #c4a46a;
      --accent-deep: #ddc48e;
      --accent-soft: #2e2820;
      --ok-bg: #12301d; --ok-fg: #86efac;
      --cl-bg: #3a3228; --cl-fg: #ddc48e;
      --cx-bg: #1d3a2b; --cx-fg: #7fd6a4;
    }
  }

  *{box-sizing:border-box;margin:0;font-family:-apple-system,"PingFang SC",system-ui,sans-serif}
  body{display:flex;height:100vh;overflow:hidden;background:var(--bg);color:var(--text);font-size:13px}

  .rail{
    width:48px;flex:none;background:var(--card);border-right:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:6px}
  .ri{
    width:36px;height:36px;border:0;border-radius:8px;display:flex;align-items:center;
    justify-content:center;font-size:16px;cursor:pointer;color:var(--text-2);background:transparent}
  .ri:hover{background:var(--accent-soft)}
  .ri.on{background:var(--accent-soft);color:var(--accent)}
  .ri.grfr{margin-top:auto}
  .ri.set{margin-bottom:10px}

  .stage{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
  .pane{flex:1;overflow:auto;padding:16px 22px}
  .h1{font-size:16px;font-weight:700;margin-bottom:4px;color:var(--accent)}
  .sub{font-size:12px;color:var(--text-2);margin-bottom:14px;line-height:1.5}
  .stats{display:flex;gap:12px;margin-bottom:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:140px}
  .stat .k{font-size:10.5px;color:var(--text-2);margin-bottom:4px}
  .stat .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px}
  .tab{padding:8px 12px;color:var(--text-2);font-size:12.5px;border-radius:7px 7px 0 0}
  .tab.on{color:var(--accent);font-weight:600;background:var(--bg);border:1px solid var(--line);border-bottom-color:var(--bg);margin-bottom:-1px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px}
  .it{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
  .it:first-child{border-top:0}
  .nm{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;font-weight:600;color:var(--accent-deep);width:140px}
  .ds{flex:1;color:var(--text-2);font-size:12px}
  .b{font-size:9px;font-weight:700;border-radius:4px;padding:2px 5px}
  .b.c{background:var(--cl-bg);color:var(--cl-fg)}
  .b.x{background:var(--cx-bg);color:var(--cx-fg)}

  .split{flex:1;display:flex;min-height:0}
  .side{width:240px;flex:none;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column}
  .side .search{margin:12px;padding:7px 10px;border:1px solid var(--line-strong);border-radius:7px;color:var(--text-2);background:var(--bg);font-size:12px}
  .side .row{margin:2px 8px;padding:8px 10px;border-radius:7px;font-size:12.5px}
  .side .row.on{background:var(--accent-soft);color:var(--accent-deep);font-weight:600}
  .detail{flex:1;padding:20px 22px;color:var(--text-2);font-size:12.5px;line-height:1.6}

  .settings{flex:1;overflow:auto;padding:20px 28px 40px;max-width:720px}
  .settings .h1{font-size:18px;margin-bottom:6px}
  .settings .lead{font-size:12.5px;color:var(--text-2);margin-bottom:22px;line-height:1.5}
  .sec-t{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-2);margin-bottom:10px}
  .scheme-grid{display:flex;flex-direction:column;gap:10px}
  .scheme{
    display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;
    padding:14px 16px;border:1px solid var(--line-strong);border-radius:12px;
    background:var(--card);cursor:pointer;color:inherit;font:inherit}
  .scheme:hover{border-color:var(--accent);background:var(--accent-soft)}
  .scheme.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
  .scheme .radio{
    width:18px;height:18px;border-radius:50%;border:2px solid var(--line-strong);
    flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center}
  .scheme.on .radio{border-color:var(--accent)}
  .scheme.on .radio::after{content:'';width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .scheme .name{font-size:14px;font-weight:700;color:var(--accent-deep);margin-bottom:4px}
  .scheme .badge{font-size:10px;font-weight:600;color:var(--text-2);margin-left:8px}
  .scheme .desc{font-size:12px;color:var(--text-2);line-height:1.45}
  .scheme .swatches{display:flex;gap:6px;margin-top:10px}
  .scheme .sw{width:20px;height:20px;border-radius:6px;border:1px solid var(--line-strong)}
  .foot{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--bg);
    border:1px dashed var(--line-strong);font-size:12px;color:var(--text-2);line-height:1.5}
  .foot b{color:var(--text);font-weight:600}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:30;
    background:var(--ok-bg);color:var(--ok-fg);border-radius:10px;padding:10px 16px;font-size:12.5px;display:none}
  .note{margin-top:24px;padding:12px 14px;border:1px dashed var(--line-strong);border-radius:10px;
    font-size:11.5px;color:var(--text-2);line-height:1.55}
</style>
</head>
<body>
  <nav class="rail">
    <button type="button" class="ri" data-dim="agents" title="Agents">🤖</button>
    <button type="button" class="ri" data-dim="projects" title="Projects">📁</button>
    <button type="button" class="ri grfr" title="全局刷新" id="refresh">↻</button>
    <button type="button" class="ri set on" data-dim="settings" title="设置">⚙️</button>
  </nav>
  <main class="stage" id="stage"></main>
  <div class="toast" id="toast"></div>
<script>
  let dim = 'settings'
  let scheme = 'purple'

  const SCHEMES = {
    purple: {
      name: '紫',
      badge: '默认',
      desc: '现网品牌紫。安装后的默认外观，与历史版本一致。',
      sw: ['#ffffff', '#f0ebf6', '#8a67ab', '#2c2733']
    },
    blue: {
      name: '雾蓝',
      badge: '',
      desc: '暖灰纸底 + 冷静蓝强调，适合长时间阅读。',
      sw: ['#fffcf9', '#eef2f7', '#4a6fa5', '#2b303b']
    },
    amber: {
      name: '琥珀褐',
      badge: '',
      desc: '暖纸底 + 褐强调，更接近纸书质感。',
      sw: ['#fffcf7', '#f3ead4', '#6b5220', '#2f2c28']
    }
  }

  function toast(msg) {
    const t = document.getElementById('toast')
    t.textContent = msg
    t.style.display = 'block'
    clearTimeout(toast._tm)
    toast._tm = setTimeout(() => { t.style.display = 'none' }, 1600)
  }

  function applyScheme() {
    document.documentElement.setAttribute('data-scheme', scheme)
  }

  function setDim(d) {
    dim = d
    document.querySelectorAll('.rail [data-dim]').forEach((b) => {
      b.classList.toggle('on', b.getAttribute('data-dim') === d)
    })
    render()
  }

  function renderSettings() {
    return `
      <div class="settings">
        <div class="h1">设置</div>
        <div class="lead">本 app 偏好，对整个界面生效。不写入 Claude / Codex 配置。</div>
        <div class="sec-t">外观</div>
        <div class="scheme-grid">
          ${['purple', 'blue', 'amber'].map((id) => {
            const s = SCHEMES[id]
            const on = scheme === id
            return `
              <button type="button" class="scheme ${on ? 'on' : ''}" data-scheme="${id}">
                <span class="radio"></span>
                <span>
                  <div class="name">${s.name}${s.badge ? `<span class="badge">${s.badge}</span>` : ''}</div>
                  <div class="desc">${s.desc}</div>
                  <div class="swatches">${s.sw.map((c) => `<span class="sw" style="background:${c}"></span>`).join('')}</div>
                </span>
              </button>`
          }).join('')}
        </div>
        <div class="foot">
          <b>浅色 / 深色</b>跟随 macOS 系统外观。切换方案后立即对整个 app 生效，无需保存。
        </div>
        <div class="note">
          <b>验收</b>：① 三选一含默认紫 ② 切换后 rail/Agents/Projects 示意同步变色
          ③ ⚙️ 为第三维 ④ 系统深色下三套均有 dark 表
        </div>
      </div>`
  }

  function renderAgents() {
    return `
      <div class="pane">
        <div class="h1">Agents</div>
        <div class="sub">示意 · 当前主题应已全局生效（含强调色与卡片底）</div>
        <div class="stats">
          <div class="stat"><div class="k"><span class="b c">CC</span> Claude</div><div class="v">12.4M</div></div>
          <div class="stat"><div class="k"><span class="b x">CX</span> Codex</div><div class="v">3.1M</div></div>
        </div>
        <div class="tabs"><div class="tab on">Skills</div><div class="tab">Token</div><div class="tab">配置</div></div>
        <div class="card">
          <div class="it"><span class="nm">github-ops</span><span class="b c">CC</span><span class="b x">CX</span><span class="ds">Rules for ANY GitHub operation…</span></div>
          <div class="it"><span class="nm">tdd</span><span class="b c">CC</span><span class="ds">红先于绿</span></div>
        </div>
      </div>`
  }

  function renderProjects() {
    return `
      <div class="split">
        <div class="side">
          <div class="search">🔍 搜索项目…</div>
          <div class="row on">agentshed</div>
          <div class="row">Transfer</div>
        </div>
        <div class="detail">
          <div class="h1" style="margin-bottom:8px">agentshed</div>
          项目详情示意。列表选中高亮与标题色随主题方案变化；CC/CX 语义色保持独立。
        </div>
      </div>`
  }

  function render() {
    const stage = document.getElementById('stage')
    if (dim === 'settings') stage.innerHTML = renderSettings()
    else if (dim === 'projects') stage.innerHTML = renderProjects()
    else stage.innerHTML = renderAgents()

    stage.querySelectorAll('[data-scheme]').forEach((btn) => {
      btn.onclick = () => {
        scheme = btn.getAttribute('data-scheme')
        applyScheme()
        render()
        toast(`已切换为「${SCHEMES[scheme].name}」· 全 app 生效`)
      }
    })
  }

  document.querySelectorAll('.rail [data-dim]').forEach((b) => {
    b.onclick = () => setDim(b.getAttribute('data-dim'))
  })
  document.getElementById('refresh').onclick = () => toast('全局刷新（示意）')

  applyScheme()
  setDim('settings')
</script>
</body>
</html>
