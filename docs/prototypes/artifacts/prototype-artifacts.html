<!doctype html>
<!-- 原型(UI)· 票05:八步产物全景(双视图)。
     问题:同一份产物索引的两种组织——项目详情内按类型分栏 vs 全局聚合页按类型手风琴,
     形态差多少、条目行含哪些字段;Markdown 阅读态怎么进出。
     交互:顶部切双视图;手风琴折叠;点条目开阅读浮层(Esc/点遮罩关)。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>原型 — 产物双视图</title>
<style>
  :root{--bg:#f7f8f9;--card:#fff;--text:#37352f;--text-2:#787774;--line:#e8eaed;
    --line-strong:#d9dce0;--accent:#8a67ab;--accent-soft:#f0ebf6}
  @media (prefers-color-scheme:dark){:root{--bg:#18191b;--card:#1f2124;--text:#e6e6e5;
    --text-2:#9b9a97;--line:#2a2c30;--line-strong:#34373c;--accent:#a084c7;--accent-soft:#2c2733}}
  *{box-sizing:border-box;margin:0;font-family:-apple-system,"PingFang SC",sans-serif}
  body{display:flex;height:100vh;overflow:hidden;background:var(--bg);color:var(--text);font-size:13px}
  .side{width:230px;flex:none;background:var(--card);border-right:1px solid var(--line);
    padding:10px 8px;color:var(--text-2);display:flex;flex-direction:column}
  .row{padding:7px 10px;border-radius:6px}.row.sel{background:var(--accent-soft);color:var(--text);outline:1px solid var(--accent)}
  .bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:8px}
  .entry{padding:7px 10px;border-radius:6px;cursor:pointer}
  .entry.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
  .head{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  .head b{font-size:15px}
  .seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden;margin-left:auto}
  .seg span{padding:5px 12px;font-size:12px;color:var(--text-2);cursor:pointer}
  .seg span.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .body{flex:1;overflow:auto;padding:16px 20px}
  .acc{background:var(--card);border:1px solid var(--line);border-radius:9px;margin-bottom:12px;overflow:hidden}
  .acc-h{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;user-select:none}
  .acc-h:hover{background:var(--accent-soft)}
  .acc-h .n{font-weight:600}
  .acc-h .c{font-size:11px;color:var(--text-2)}
  .acc-h .arr{margin-left:auto;color:var(--text-2);transition:.15s}
  .acc.closed .arr{transform:rotate(-90deg)}
  .acc.closed .items{display:none}
  .it{display:flex;align-items:center;gap:9px;padding:8px 14px;border-top:1px solid var(--line);cursor:pointer}
  .it:hover{background:var(--accent-soft)}
  .it .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .it .prj{font-size:10.5px;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 6px;flex:none}
  .it .d{font-size:11px;color:var(--text-2);flex:none;font-variant-numeric:tabular-nums}
  .it .ext{font-size:10px;border:1px solid var(--line-strong);border-radius:4px;padding:0 4px;color:var(--text-2);flex:none}
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:10}
  .reader{position:fixed;top:6vh;left:50%;transform:translateX(-50%);width:min(720px,90vw);max-height:84vh;
    overflow:auto;background:var(--card);border:1px solid var(--line-strong);border-radius:12px;
    padding:24px 28px;z-index:11;display:none;line-height:1.8;font-size:13px}
  .reader h2{font-size:16px;margin-bottom:4px}
  .reader .meta{font-size:11px;color:var(--text-2);margin-bottom:14px}
  .reader code{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11.5px}
  .empty-note{color:var(--text-2);font-size:12px;padding:10px 14px;border:1px dashed var(--line-strong);border-radius:9px}
</style>
</head>
<body>
  <div class="side">
    <div class="row">agentshed</div><div class="row sel" id="prjRow">Transfer</div><div class="row">openclaw-v3</div>
    <div class="bottom"><div class="entry">⚙ 全局库</div><div class="entry on" id="galEntry">📚 产物聚合</div></div>
  </div>
  <div class="main">
    <div class="head"><b id="title">产物聚合 · 全部项目</b>
      <span class="seg" id="seg"><span class="on">全局聚合</span><span>项目内视图(Transfer)</span></span></div>
    <div class="body" id="body"></div>
  </div>
  <div class="mask" id="mask"></div>
  <div class="reader" id="reader"></div>
<script>
  const A={
    'ADR':[
      {t:'ADR-0017 消息领域模型收敛为单一数据源',p:'Transfer',d:'07-12'},
      {t:'ADR-0013 文档按腐烂速度分类',p:'Transfer',d:'06-28'},
      {t:'ADR-0001 双 seam 测试策略',p:'agentshed',d:'07-29'},
      {t:'ADR-0009 网关重连退避策略',p:'openclaw-v3',d:'05-17'}],
    'CONTEXT.md':[
      {t:'CONTEXT.md(术语 14 条)',p:'Transfer',d:'07-20'},
      {t:'CONTEXT.md(术语 9 条)',p:'agentshed',d:'07-29'}],
    'features':[
      {t:'截图与标注',p:'Transfer',d:'07-18'},{t:'局域网发现',p:'Transfer',d:'07-02'}],
    'postmortems':[
      {t:'屏幕权限 preflight 堵死授权入口',p:'Transfer',d:'07-24'},
      {t:'运行期发现丢失(IGMP 老化疑云)',p:'Transfer',d:'07-08'}],
    'prototypes':[
      {t:'消息状态机(可驾驶)',p:'Transfer',d:'07-10',ext:'logic'},
      {t:'产物双视图(本页)',p:'agentshed',d:'07-29',ext:'html'}],
  };
  const body=document.getElementById('body'),title=document.getElementById('title');
  let view='global';
  function render(){
    title.textContent=view==='global'?'产物聚合 · 全部项目':'Transfer · 产物';
    body.innerHTML=Object.entries(A).map(([k,items])=>{
      const list=view==='global'?items:items.filter(i=>i.p==='Transfer');
      const inner=list.length?list.map(i=>
        `<div class="it" data-t="${i.t}" data-p="${i.p}"><span class="t">${i.t}</span>
         ${i.ext?`<span class="ext">${i.ext==='html'?'HTML→浏览器':'logic'}</span>`:''}
         ${view==='global'?`<span class="prj">${i.p}</span>`:''}<span class="d">${i.d}</span></div>`).join('')
        :'<div class="it" style="cursor:default;color:var(--text-2)">该类无产物</div>';
      return `<div class="acc"><div class="acc-h"><span class="n">${k}</span>
        <span class="c">${list.length} 条${view==='global'?' · 跨项目按时间倒序':''}</span>
        <span class="arr">▾</span></div><div class="items">${inner}</div></div>`;
    }).join('')+(view==='project'?'<div class="empty-note">非八步项目在此显示:「未按约定沉淀」空态(不视为错误)</div>':'');
  }
  body.addEventListener('click',e=>{
    const h=e.target.closest('.acc-h');
    if(h){h.parentElement.classList.toggle('closed');return;}
    const it=e.target.closest('.it[data-t]');
    if(it){
      document.getElementById('mask').style.display='block';
      const r=document.getElementById('reader');r.style.display='block';
      r.innerHTML=`<h2>${it.dataset.t}</h2><div class="meta">${it.dataset.p} · Markdown 只读渲染;相对路径图片按项目目录解析,渲染失败降级纯文本</div>
        <p><b>Context</b>:主/渲染进程各自维护消息副本,IPC 边界出现两类漂移……</p>
        <p><b>Decision</b>:领域模型收敛为单一数据源,类型从 <code>shared/</code> 单点导出……</p>
        <p><b>Consequences</b>:契约测试锁住消息 schema;新增字段只改一处。</p>`;
    }
  });
  const close=()=>{document.getElementById('mask').style.display='none';document.getElementById('reader').style.display='none'};
  document.getElementById('mask').onclick=close;
  addEventListener('keydown',e=>{if(e.key==='Escape')close()});
  document.getElementById('seg').addEventListener('click',e=>{
    if(e.target.tagName!=='SPAN')return;
    document.querySelectorAll('#seg span').forEach(s=>s.classList.toggle('on',s===e.target));
    view=e.target.textContent.startsWith('全局')?'global':'project';render();
  });
  render();
</script>
</body>
</html>
