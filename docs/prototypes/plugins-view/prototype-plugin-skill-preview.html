<!doctype html>
<!-- A UI prototype · plugins-view: previewing a plugin skill in place — direction A, four rounds of
     revision (2026-08-07):
     首轮 chip 群 + 表中插被反馈「乱」;二轮改 skills 行式列表;三轮:①安装记录
     上移插件名行内 ②类目标题升权重 ③缩进砍到 14px 基线;四轮(用户指示):
     Skills/Subagents/Hooks/MCP 改为展开区内**类目 tab**(segment 形态区别于
     页面级 tab;空类目不出 tab,默认落首个非空类目)。
     Skills tab 为行式列表:每 skill 一行(名 + 描述 + 文件数·大小),点行折叠
     展开文件表,与 Skills 分栏交互语法完全统一。
     ADR-0012:预览与启用态解耦;Codex 组仅 skills 段展开、不并入 Skills 分栏。
     mock 边界:多安装记录 / 未启用仍可审阅 / E6 整包缺失 / 单 skill 目录缺失置灰 /
     深度>2 提示 / Codex 探测式。
     文件表与 prototype-skills-preview.html(skills-view)同构——演化时两处同步。
     共享块:md-preview(抽屉正文渲染)。
     2026-10-21: the drawer's frame is the shared _shared/file-drawer.css — the one file-drawer form the skill file
       drawer and the memory drawers draw too (the app opens a plugin's skill files in the skill file drawer). Its
       width follows the content-area formula instead of 80vw; its preview bar takes the skill drawer's fade.
     界面语言、明暗与配色跟随设置原型(appearance)与画廊的统一设置所选,本页不设开关、无演示条;语言只画了中、英两种,
     其他语言按英文显示并有提示;评审注记(.sub 说明、页脚注、展开区里带 ADR 的注)不随语言变。
     色值取共享主题 _shared/theme.css,本页只为自己的 token(遮罩)给出明暗两值。
     app 窗口的根样式在共享件 _shared/app-window.css 里。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>原型 — Plugins · 插件 skill 原地预览</title>
<link rel="stylesheet" href="../_shared/theme.css">
<link rel="stylesheet" href="../_shared/app-window.css">
<link rel="stylesheet" href="../_shared/app-rail.css">
<link rel="stylesheet" href="../_shared/file-drawer.css">
<link rel="stylesheet" href="../_shared/md-preview.css">
<style>
  /* Page tokens on top of the app's (_shared/theme.css). Only the mask is the page's own; it takes the
     same alpha in both modes. */
  :root{
    --mask:rgba(0,0,0,.35);
  }
  html[data-demo-mode="dark"]{
    --mask:rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;font-family:-apple-system,"PingFang SC",sans-serif}
  .main{flex:1;min-width:0;overflow:auto;padding:16px 22px}
  h2.page-h{font-size:16px;font-weight:700;color:var(--accent);margin:0 0 10px}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px}
  .tab{font:inherit;font-size:12.5px;border:0;background:none;color:var(--text-2);padding:7px 12px;cursor:default;border-bottom:2px solid transparent}
  .tab.on{color:var(--accent);font-weight:600;border-bottom-color:var(--accent)}
  .sub{font-size:12px;color:var(--text-2);margin-bottom:14px;line-height:1.55}
  .sub b{color:var(--text)}
  .sec-h{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-2);margin:16px 0 8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:9px;margin-bottom:14px;overflow:hidden}
  /* The plugin row (matching the density of the app's current list rows) */
  .prow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font:inherit;
    border:0;background:none;color:inherit;padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
  .prow:hover{background:var(--accent-soft)}
  .prow .cv{width:14px;flex:none;color:var(--text-2);display:flex;align-items:center;
    justify-content:center;transition:transform .15s}
  .prow.open .cv{transform:rotate(90deg);color:var(--accent)}
  .prow .nm{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;flex:none}
  .prow .ver{font-size:11px;color:var(--text-2);flex:none}
  .pill{font-size:10px;border-radius:5px;padding:1px 6px;flex:none}
  .pill.on{background:var(--ok-bg);color:var(--ok-fg)}
  .pill.off{border:1px solid var(--line-strong);color:var(--text-2)}
  .pill.src{background:var(--accent-soft);color:var(--accent);font-weight:600}
  /* The expanded area: indented onto the same 14px baseline as the row header */
  .exp{padding:2px 14px 12px 14px;background:var(--bg);border-bottom:1px solid var(--line)}
  /* Category tabs (a segment inside the expanded area, styled apart from page-level tabs; an empty category
     gets no tab) */
  .ptabs{display:flex;gap:4px;margin:10px 0 8px}
  .ptab{font:inherit;font-size:11.5px;font-weight:600;border:1px solid var(--line-strong);background:var(--card);
    color:var(--text-2);border-radius:7px;padding:3px 10px;cursor:pointer}
  .ptab .cnt{font-size:10.5px;margin-left:4px;opacity:.75}
  .ptab.on{background:var(--accent-soft);color:var(--accent-deep);border-color:var(--accent)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  /* Mini chips: a plugin row's installation records, and the static component names in a category panel */
  .mchip{border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-family:ui-monospace,Menlo,monospace;
    font-size:10.5px;color:var(--text-2)}
  .none{font-size:12px;color:var(--text-2);padding:10px 0}
  .note{font-size:11px;color:var(--text-2);margin-top:8px;line-height:1.5}
  /* The skills row list: isomorphic to the Skills tab's collapse semantics */
  .psk-list{margin-top:2px;border:1px solid var(--line);border-radius:8px;background:var(--card);overflow:hidden}
  .psk{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font:inherit;
    border:0;background:none;color:inherit;padding:7px 12px;cursor:pointer;border-top:1px solid var(--line)}
  .psk-list>.psk:first-child{border-top:0}
  .psk:hover{background:var(--accent-soft)}
  .psk .cv{width:12px;flex:none;color:var(--text-2);display:flex;align-items:center;
    justify-content:center;transition:transform .15s}
  .psk.open .cv{transform:rotate(90deg);color:var(--accent)}
  .psk.on .cv{color:var(--accent)}
  .psk .nm{font-family:ui-monospace,Menlo,monospace;font-size:12px;flex:none}
  .psk .ds{flex:1;min-width:0;color:var(--text-2);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .psk .meta{flex:none;font-size:11px;color:var(--text-2);font-variant-numeric:tabular-nums}
  .psk.dis{cursor:not-allowed;opacity:.5}
  .psk-body{border-top:1px solid var(--line);background:var(--bg);padding:8px 12px}
  .psk-body .files-wrap{border:0;border-radius:0;background:transparent;margin:0}
  /* The file table: isomorphic to the skills-view prototype's expanded table (flat, and the two evolve
     together) */
  .files-wrap{border:1px solid var(--line);border-radius:8px;background:var(--card);overflow:hidden}
  .files-head{display:grid;grid-template-columns:minmax(0,1fr) 64px 72px 108px;gap:8px;
    padding:5px 12px;font-size:10.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;
    color:var(--text-2);border-bottom:1px solid var(--line)}
  .files-head span:not(:first-child){text-align:right}
  .files{display:flex;flex-direction:column;padding:3px 0 5px}
  .files button{display:grid;grid-template-columns:minmax(0,1fr) 64px 72px 108px;gap:8px;align-items:center;
    width:100%;text-align:left;font:inherit;font-size:12px;border:0;background:transparent;color:var(--text);
    padding:6px 12px;cursor:pointer;border-left:3px solid transparent}
  .files button:hover{background:var(--accent-soft);border-left-color:var(--accent)}
  .files .ic{width:22px;height:22px;flex:none;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:800;background:var(--bg);border:1px solid var(--line);color:var(--text-2);
    font-family:ui-monospace,Menlo,monospace}
  .files .ic.md{background:var(--accent-soft);color:var(--accent-deep)}
  .files .ic.sh{background:var(--ok-bg);color:var(--ok-fg)}
  .files .name-cell{display:flex;align-items:center;gap:8px;min-width:0}
  .files .path{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,Menlo,monospace}
  .files .tag{font-size:9px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 5px;flex:none}
  .files .meta{font-size:11.5px;color:var(--text-2);font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,monospace;text-align:right;white-space:nowrap}
  .files .meta.lines{font-weight:600;color:var(--text)}
  .sk-tip{font-size:11.5px;color:var(--warn-fg);background:var(--warn-bg);
    border:1px solid var(--line-strong);border-radius:8px;padding:6px 10px;line-height:1.45;margin:8px 0 0}
  /* The drawer's mask; the drawer itself is the shared file-drawer block */
  .mask{position:fixed;inset:0;background:var(--mask);z-index:10}
</style>
<script src="../vendor/marked.umd.js"></script>
<script src="../manifest.js"></script>
<script src="../app-identity.js"></script>
<script src="../_shared/icons.js"></script>
<script src="../_shared/copy.js"></script>
<script src="../dimensions.js"></script>
<script src="../demo-dimensions.js" data-follow="language=zh,en mode theme"></script>
<script src="../_shared/md-preview.js"></script>
</head>
<body>
<div class="app-window" data-shared-block="app-window">
  <nav class="rail" data-shared-block="app-rail" data-rail-current="agents"></nav>
  <script src="../_shared/app-rail.js"></script>
  <div class="main">
    <h2 class="page-h">Agents</h2>
    <div class="tabs">
      <button class="tab">Token</button><button class="tab">Skills</button><button class="tab">Subagents</button>
      <button class="tab on">Plugins</button><button class="tab">MCP</button><button class="tab">Memory</button><button class="tab" data-i18n="tabCfg"></button>
    </div>
    <div class="sub">
      插件行内直接给启用态与安装记录;展开后为<b>类目 tab</b>(Skills/Subagents/Hooks/MCP,空类目不出)。
      Skills tab 是行式列表(名 + 描述 + 文件数·大小):<b>点行</b>折叠展开文件表,点文件开抽屉读正文——与
      Skills 分栏同一套交互。<b>可读与启用态无关</b>(ADR-0012,启用前审阅);目录缺失的行置灰。Codex 组仅 Skills tab,不并入 Skills 分栏。
    </div>

    <div class="sec-h" data-i18n="secClaude"></div>
    <div class="card" id="claude-list"></div>

    <div class="sec-h" data-i18n="secCodex"></div>
    <div class="card" id="codex-list"></div>

    <div class="note">注:启用态判定来自 settings 分层合并(现行逻辑),本页为静态 mock;行可点性由「包根可读」决定,与启用无关。</div>
  </div>
  <div id="overlay"></div>
</div>

<script>
  // ── The interface language follows the settings prototype; this page is drawn in Chinese and English
  // (demo-dimensions.js shows any other choice as English, with a note) ──
  let lang = DemoDimensions.get('language')
  const HTML_LANG = { zh: 'zh-CN', en: 'en' }
  const enOne = (n) => new Intl.PluralRules('en').select(n) === 'one'
  const COPY = {
    zh: {
      ...SharedCopy.zh,
      secClaude: 'Claude · 插件',
      secCodex: 'Codex · 插件(探测式,仅缓存枚举)',
      enabledAt: (layer) => `启用 · ${layer} 层`,
      installMissing: '安装目录缺失',
      missingNone: '安装目录缺失(缓存已清理)——仅注册表记录可见;skill 不可预览',
      dirMissing: '包内该 skill 目录不存在',
      installMissingCache: '安装目录缺失(缓存已清理)',
      pkgSummary: (files, size) => `${files} 个文件 · ${size}`,
      deepTip: (paths) => `按照最佳实践,skill 引用深度不宜 ≥ 2,建议改造该 skill。更深路径未列入: ${paths}`,
      pluginPkg: '插件包'
    },
    en: {
      ...SharedCopy.en,
      secClaude: 'Claude · Plugins',
      secCodex: 'Codex · Plugins (probe-style, cache enumeration only)',
      enabledAt: (layer) => `Enabled · ${layer} layer`,
      installMissing: 'Install directory missing',
      missingNone: 'Install directory missing (cache cleaned up) — only the registry record is visible; skills cannot be previewed',
      dirMissing: 'This skill’s directory does not exist in the package',
      installMissingCache: 'Install directory missing (cache cleaned up)',
      pkgSummary: (files, size) => `${files} ${enOne(files) ? 'file' : 'files'} · ${size}`,
      deepTip: (paths) => `Best practice is a skill reference depth below 2 — consider restructuring this skill. Deeper paths not listed: ${paths}`,
      pluginPkg: 'Plugin package'
    }
  }
  const tx = () => COPY[lang]
  // What a language change redraws: each mounted piece of copy registers how to repaint itself, so rows keep
  // their open state, chosen category tab and expanded file table
  const painters = []

  // ── Mock data (boundaries first) ──
  const FILES = {
    'superpowers:brainstorming': {
      deep: ['references/nested/too-deep.md'],
      files: {
        'SKILL.md': '---\nname: brainstorming\ndescription: 先问后做——动手前把问题空间摊开\n---\n\n# Brainstorming\n\n先发散再收敛。**禁止**在第一轮就锁定方案。\n\n- 列出至少 3 个方向\n- 给每个方向找一个反例\n',
        'references/patterns.md': '# 常用发散模式\n\n1. 逆向:如果必须失败,怎么做\n2. 极端:预算×10 / ÷10\n',
        'scripts/collect.sh': '#!/bin/bash\n# 汇总头脑风暴产物\ncat ideas/*.md\n'
      }
    },
    'superpowers:writing-plans': {
      deep: [],
      files: {
        'SKILL.md': '---\nname: writing-plans\ndescription: 把共识写成可执行计划\n---\n\n# Writing Plans\n\n每步都要有验收判据。\n'
      }
    },
    'content-tools:publish-wechat': {
      deep: [],
      files: {
        'SKILL.md': '---\nname: publish-wechat\ndescription: 公众号排版与发布\n---\n\n# Publish WeChat\n\n> 未启用的插件也能审阅——启用前先看它指示 agent 做什么。\n\n1. markdown → 微信 HTML\n2. 生成封面\n'
      }
    },
    'documents:documents': {
      deep: [],
      files: {
        'SKILL.md': '---\nname: documents\ndescription: 文档创建与编辑(Codex 内置)\n---\n\n# Documents\n\nCodex 侧插件包,目录约定与 Claude 同构。\n',
        'references/formats.md': '# 支持格式\n\ndocx / pdf / md\n'
      }
    }
  }

  const CLAUDE_PLUGINS = [
    // enabled = the settings layer the enablement comes from; disReason = a key into COPY
    { name: 'superpowers@official', ver: 'v6.2.0', enabled: 'user',
      installs: ['user', 'project · demo-proj'],
      skills: [
        { key: 'superpowers:brainstorming', label: 'superpowers:brainstorming', desc: '先问后做——动手前把问题空间摊开' },
        { key: 'superpowers:writing-plans', label: 'superpowers:writing-plans', desc: '把共识写成可执行计划' },
        { key: null, label: 'superpowers:lost-skill', desc: '', disReason: 'dirMissing' }
      ],
      agents: ['code-reviewer'], hooks: ['SessionStart × 1'], mcp: ['browser-mcp'] },
    { name: 'content-tools@local', ver: 'v0.3.1', enabled: null,
      installs: ['user'],
      skills: [{ key: 'content-tools:publish-wechat', label: 'content-tools:publish-wechat', desc: '公众号排版与发布' }],
      agents: [], hooks: [],
      note: '未启用插件的 skill 仍可审阅(ADR-0012:可读与启用态解耦;读取不改变任何状态)' },
    { name: 'ghost@legacy', ver: 'v1.0.0', enabled: null,
      installs: ['user'], missing: true,
      skills: [{ key: null, label: 'ghost:old-skill', desc: '', disReason: 'installMissingCache' }],
      agents: [], hooks: [] }
  ]

  const CODEX_PLUGINS = [
    { name: 'documents', ver: 'v26.805.11740', market: 'openai-primary-runtime',
      skills: [{ key: 'documents:documents', label: 'documents:documents', desc: '文档创建与编辑(Codex 内置)' }],
      note: '探测式:无启用态语义,不并入 Skills 分栏(ADR-0012);仅缓存最高版本目录' }
  ]

  // ── Utilities ──
  function fmtSize(b){ if(b<1024) return b+' B'; if(b<1048576) return (b/1024).toFixed(b<10240?1:0)+' KB'; return (b/1048576).toFixed(1)+' MB' }
  function lineCount(t){ return t ? t.replace(/\n$/,'').split('\n').length : 0 }
  function extKind(p){ const b=p.split('/').pop()||p;
    if(/\.md$/i.test(b)) return {k:'md',l:'MD'}; if(/\.(sh|bash|zsh)$/i.test(b)) return {k:'sh',l:'SH'};
    if(/\.(ya?ml|toml|json)$/i.test(b)) return {k:'cfg',l:'CFG'};
    return {k:'oth',l:(b.includes('.')?b.split('.').pop():'?').slice(0,3).toUpperCase()} }
  function mockDate(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*33+s.charCodeAt(i))>>>0;
    const d=new Date(Date.UTC(2026,0,1+h%210)); return d.toISOString().slice(0,10) }
  function pkgStats(key){ const p=FILES[key]; if(!p) return null
    let bytes=0; const names=Object.keys(p.files)
    names.forEach(n=>{ bytes+=new TextEncoder().encode(p.files[n]).length })
    return { files:names.length, bytes } }

  // ── The file table (isomorphic to the skills-view prototype) ──
  function renderFiles(host, key){
    const pack = FILES[key]
    host.innerHTML = ''
    if(!pack) return
    const names = Object.keys(pack.files).sort((a,b)=> a==='SKILL.md'?-1 : b==='SKILL.md'?1 : a.localeCompare(b))
    const c = tx()
    const wrap = document.createElement('div'); wrap.className='files-wrap'
    wrap.innerHTML = `<div class="files-head"><span>${c.colFile}</span><span>${c.colLines}</span><span>${c.colSize}</span><span>${c.colMtime}</span></div>`
    const list = document.createElement('div'); list.className='files'
    names.forEach(n=>{
      const t = pack.files[n]; const k = extKind(n)
      const b = document.createElement('button'); b.type='button'
      b.innerHTML = `<span class="name-cell"><span class="ic ${k.k}">${k.l}</span><span class="path">${n}</span>${n==='SKILL.md'?`<span class="tag">${c.tagEntry}</span>`:''}</span>
        <span class="meta lines">${lineCount(t)}</span><span class="meta">${fmtSize(new TextEncoder().encode(t).length)}</span><span class="meta">${mockDate(key+n)}</span>`
      b.onclick = (e)=>{ e.stopPropagation(); openDrawer(key, n) }
      list.appendChild(b)
    })
    wrap.appendChild(list); host.appendChild(wrap)
    if(pack.deep.length){
      const tip=document.createElement('div'); tip.className='sk-tip'
      tip.textContent = c.deepTip(pack.deep.join(', '))
      host.appendChild(tip)
    }
  }

  // ── The drawer (the shared md-preview block) ──
  let mdCtl=null, paintDrawer=null
  function openDrawer(key, file){
    const overlay=document.getElementById('overlay')
    const text=FILES[key].files[file]
    overlay.innerHTML = `<div class="mask" data-close></div>
      <div class="file-drawer" data-shared-block="file-drawer"><button class="drawer-close" data-close>${ICONS.X(15)}</button>
        <div class="d-top"><div class="d-title">${key}</div><div class="d-meta"></div></div>
        <div class="d-body"><div id="md-pane" data-shared-block="md-preview" style="flex:1;min-width:0;display:flex"></div></div></div>`
    // Repainted in place on a language change, so the raw/preview choice survives it (the shared block
    // repaints its own copy)
    paintDrawer=()=>{
      overlay.querySelector('.drawer-close').title=tx().close
      overlay.querySelector('.d-meta').textContent=`${tx().pluginPkg} · ${file}`
    }
    paintDrawer()
    const mode = MdPreview.isMarkdown(file)?'preview':'raw'
    mdCtl = MdPreview.mount(document.getElementById('md-pane'), {name:file, text, mode})
    const close=()=>{ if(mdCtl){mdCtl.destroy();mdCtl=null} overlay.innerHTML=''; window.onkeydown=null; paintDrawer=null }
    overlay.querySelectorAll('[data-close]').forEach(el=>el.onclick=close)
    window.onkeydown=(e)=>{ if(e.key==='Escape') close() }
  }

  // ── The plugin row + the expanded area ──
  function mountPlugin(parent, p, side){
    const row=document.createElement('button'); row.type='button'; row.className='prow'
    // The open state is a class on the row element itself, so repainting its content keeps it
    const paintRow=()=>{ const c=tx()
      row.innerHTML=`<span class="cv">${ICONS.ChevronRight(11)}</span><span class="nm">${p.name}</span><span class="ver">${p.ver}</span>
      ${side==='codex' ? `<span class="pill src">${p.market}</span>` : (p.enabled?`<span class="pill on">${c.enabledAt(p.enabled)}</span>`:`<span class="pill off">${c.notEnabled}</span>`)}
      ${p.missing?`<span class="pill off">${c.installMissing}</span>`:''}
      ${(p.installs||[]).map(i=>`<span class="mchip">${i}</span>`).join('')}` }
    paintRow(); painters.push(paintRow)
    const exp=document.createElement('div'); exp.className='exp'; exp.style.display='none'
    // Static segments are appended through seg() and interactive nodes with their own appendChild — the order
      // must not be reversed:
    // an innerHTML+= after an appendChild rebuilds the DOM and wipes the listeners (a trap hit in the first
      // version)
    const seg=(html)=>{ const d=document.createElement('div'); d.innerHTML=html; while(d.firstChild) exp.appendChild(d.firstChild) }
    // A line of product copy: appended like an interactive node, and repainted on a language change
    const live=(cls, text)=>{ const d=document.createElement('div'); d.className=cls
      const paint=()=>{ d.textContent=text() }; paint(); painters.push(paint); exp.appendChild(d) }
    if(p.missing) live('none', ()=>tx().missingNone)
    // Category tabs: an empty category gets no tab (as in E5, "a missing category is not shown"); the default
      // lands on the first non-empty one
    const panels=[]
    if(p.skills.length){
      const list=document.createElement('div'); list.className='psk-list'
      p.skills.forEach(s=>{
        const r=document.createElement('button'); r.type='button'
        r.className='psk'+(s.key?'':' dis')
        const stats = s.key ? pkgStats(s.key) : null
        const host=document.createElement('div'); host.className='psk-body'; host.style.display='none'
        // The open state lives on the row's classes and the file table's display, which a repaint keeps
        const paintSkill=()=>{ const c=tx()
          r.innerHTML=`<span class="cv">${s.key?ICONS.ChevronRight(11):ICONS.Dot(11)}</span><span class="nm">${s.label}</span>
          <span class="ds">${s.desc||''}</span>
          <span class="meta">${stats ? c.pkgSummary(stats.files, fmtSize(stats.bytes)) : (s.disReason ? c[s.disReason] : '')}</span>`
          if(!s.key) r.title=c[s.disReason]
          if(host.style.display!=='none') renderFiles(host, s.key)
        }
        paintSkill(); painters.push(paintSkill)
        if(s.key){
          r.onclick=(e)=>{
            e.stopPropagation()
            const open=host.style.display!=='none'
            host.style.display=open?'none':'block'
            if(!open) renderFiles(host, s.key); else host.innerHTML=''
            // `open` 是**点击前**的状态,点完之后展开与否正好相反
            r.classList.toggle('open', !open)
            r.classList.toggle('on', !open)
          }
        } else { r.onclick=(e)=>e.stopPropagation() }
        list.appendChild(r); list.appendChild(host)
      })
      panels.push({label:'Skills', cnt:p.skills.length, node:list})
    }
    const chipPanel=(names)=>{ const d=document.createElement('div'); d.className='chips'
      d.innerHTML=names.map(n=>`<span class="mchip">${n}</span>`).join(''); return d }
    if(p.agents && p.agents.length) panels.push({label:'Subagents', cnt:p.agents.length, node:chipPanel(p.agents)})
    if(p.hooks && p.hooks.length) panels.push({label:'Hooks', cnt:p.hooks.length, node:chipPanel(p.hooks)})
    if(p.mcp && p.mcp.length) panels.push({label:'MCP', cnt:p.mcp.length, node:chipPanel(p.mcp)})
    if(panels.length){
      const bar=document.createElement('div'); bar.className='ptabs'
      const host=document.createElement('div')
      panels.forEach((pa,i)=>{
        const b=document.createElement('button'); b.type='button'; b.className='ptab'+(i===0?' on':'')
        b.innerHTML=`${pa.label}<span class="cnt">${pa.cnt}</span>`
        b.onclick=(e)=>{
          e.stopPropagation()
          bar.querySelectorAll('.ptab').forEach(x=>x.classList.toggle('on',x===b))
          host.innerHTML=''; host.appendChild(pa.node)
        }
        bar.appendChild(b)
      })
      host.appendChild(panels[0].node)
      exp.appendChild(bar); exp.appendChild(host)
    }
    if(p.note) seg(`<div class="note">${p.note}</div>`)
    row.onclick=()=>{
      const open=exp.style.display!=='none'
      exp.style.display=open?'none':'block'
      row.classList.toggle('open', !open)
    }
    parent.appendChild(row); parent.appendChild(exp)
  }

  CLAUDE_PLUGINS.forEach(p=>mountPlugin(document.getElementById('claude-list'), p, 'claude'))
  CODEX_PLUGINS.forEach(p=>mountPlugin(document.getElementById('codex-list'), p, 'codex'))
  // Expand the first plugin and its first skill row by default, so the form is visible on arrival
  document.querySelector('#claude-list .prow').click()
  document.querySelector('#claude-list .psk').click()

  // Light/dark and the palette land on the root element through demo-dimensions.js and switch the app's
  // tokens there; the language is the page's to redraw
  DemoDimensions.on('language', v=>{
    lang=v
    document.documentElement.lang=HTML_LANG[v]
    document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent=tx()[el.dataset.i18n] })
    painters.forEach(paint=>paint())
    if(paintDrawer) paintDrawer()
  })
</script>
<script>
  // Cross-prototype navigation: inside the gallery ask the parent page to switch; when opened alone, go to the file directly
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-goto]');
    if (!el) return;
    if (window.parent !== window) parent.postMessage({ type: 'proto-nav', target: el.dataset.goto }, '*');
    else if (el.dataset.gotoHref) location.href = el.dataset.gotoHref;
  });
</script>
</body>
</html>
