      <div class="stats">
        <div class="stat"><div class="k"><span class="b c">CLAUDE CODE</span>已检测</div>
          <div class="v">11.2M</div><div class="s">46 项目 · 26 全局 skills · 5 subagents</div></div>
        <div class="stat"><div class="k"><span class="b x">CODEX</span>已检测</div>
          <div class="v">4.8M</div><div class="s">18 项目 · 23 全局 skills · 4 subagents</div></div>
      </div>
      <div class="tabs">${tabs([['token','Token',1],['skills','Skills'],['subagents','Subagents'],['plugins','Plugins'],['mcp','MCP',1],['memory','Memory'],['cfg','配置',1]])}</div>`
  } else {
    $('head').innerHTML = `
      <div class="h1">superpowers-demo <span class="b c">CLAUDE</span>
        <span class="pgsw"><span onclick="setPage('global')">全局页</span><span class="on">详情页</span></span></div>
      <div class="det-path">/Users/loong_zhou/CascadeProjects/superpowers-demo</div>
      <div class="tabs">${tabs([['ov','概览',1],['skills','Skills'],['subagents','Subagents'],['plugins','Plugins'],['mcp','MCP',1],['memory','Memory'],['cfg','配置',1],['arts','产物',1]])}</div>`
  }
  $('riAgents').classList.toggle('on', PAGE==='global')
  $('riProjects').classList.toggle('on', PAGE==='detail')
}

/* — 行构造 — */
function subagentRows(){
  const data = PAGE==='global' ? SUBAGENTS_GLOBAL : SUBAGENTS_DETAIL
  return data.map((a,i)=>{
    const badges = PAGE==='global' ? sideB(a.sides) : sideB1(a.side)
    const lv = a.level ? (a.level==='project' ? pill('glb','项目级') : pill('ln','全局')) : ''
    const flags = [
      a.parseError ? pill('warn','解析失败') : '',
      a.unreadable ? pill('warn','不可读') : '',
      a.overridesBuiltin ? pill('warn','覆盖内置') : '',
      a.shadows ? pill('on','遮蔽同名') : '',
      a.shadowed ? pill('off','被项目级遮蔽') : ''
    ].join('')
    return { i, html:`<span class="nm" style="width:190px">${esc(a.name)}</span>
      <span style="display:flex;gap:3px;width:46px;flex:none">${badges}</span>${lv}${flags}
      <span class="ds">${a.desc?esc(a.desc):'<i>(无 description)</i>'}</span>`, data:a }
  })
}
function memoryRows(){
  return MEMORY_GLOBAL.map((m,i)=>({ i, data:m, html:`
    <span class="nm" style="width:190px">${esc(m.proj)}</span>
    <span style="display:flex;gap:3px;flex:none">${m.codex?'<span class="b x">CX</span>':'<span class="b c">CC</span>'}</span>
    ${m.stale?pill('warn','失效'):''}${m.hidden?pill('off','已隐藏'):''}
    <span class="ds">${m.hasMain===null?'(全局记忆目录)':m.hasMain?'MEMORY.md':'无 MEMORY.md'} · ${m.topics} topic</span>
    <span class="src">${m.at}</span>` }))
}
function pluginRows(){
  return PLUGINS.map((p,i)=>{
    const en = PAGE==='global' ? p.enabled.global : p.enabled.detail
    const why = PAGE==='global' ? (p.whyGlobal||p.why) : (p.whyDetail||p.why)
    return { i, data:p, html:`
      <span class="nm" style="width:270px">${esc(p.name)}</span>
      <span class="src">v${p.ver}</span>
      ${en?pill('on','启用'):pill('off','未启用')}
      <span class="ds">${esc(why)}${p.installs.length>1?` · ${p.installs.length} 条安装记录`:''}</span>` }
  })
}
function skillRows(){
  const data = PAGE==='global' ? SKILLS_GLOBAL : SKILLS_DETAIL
  // 全局页:仅插件条目带来源徽标(磁盘行以「安装到…」按钮自证全局库身份);
  // 详情页:真实应用为分组结构(项目级/全局层/插件内含各一组),此处平铺示意,行内 pill 同真实分组行
  return data.map((s,i)=>({ i, data:s, html:`
    <span class="nm" style="width:270px">${esc(s.name)}</span>
    <span style="display:flex;gap:3px;width:64px;flex:none">${sideB(s.sides)}</span>
    ${s.origin==='plugin'?pill('plg','插件'):PAGE==='detail'?(s.level==='project'?pill('glb','项目级'):pill('ln','全局')):''}
    ${s.shadows?pill('on','遮蔽全局'):''}${s.shadowed?pill('off','被项目级遮蔽'):''}
    <span class="ds">${esc(s.desc)}</span>
    ${s.origin!=='plugin'?'<span class="btn" onclick="event.stopPropagation()">安装到…</span>':''}` }))
}

/* — 抽屉内容 — */
function subagentDetailHtml(a){
  if (a.parseError) return `<h2>${esc(a.name)}</h2><div class="meta">Codex toml 解析失败</div>
    <div class="none">文件无法解析(损坏或语法错误);Codex 本身也不会加载它。其余条目不受影响。</div>`
  if (a.unreadable) return `<h2>${esc(a.name)}</h2><div class="meta">文件不可读(权限或 IO 异常)</div>
    <div class="none">条目保留不静默消失——静默消失会污染同名条目的遮蔽判定(A8)。</div>`
  if (!a.cl && !a.cx) { // 详情页条目形态:单侧 + level + body
    return `<h2>${esc(a.name)}</h2><div class="meta">${a.desc?esc(a.desc):''}</div>
      <div class="kv"><span class="k2">来源</span><span>${a.level==='project'?'项目级':'全局'} · ${a.side==='x'?'Codex':'Claude'}</span>
      ${a.overridesBuiltin?'<span class="k2">覆盖内置</span><span>是(default/worker/explorer 之一被替换)</span>':''}
      ${a.shadows?'<span class="k2">遮蔽</span><span>压过同名低层定义</span>':''}
      ${a.shadowed?'<span class="k2">被遮蔽</span><span>同名项目级定义生效</span>':''}</div>
      <div class="mdv">${esc(a.body)}</div>`
  }
  const both = a.cl && a.cx
  const seg = both ? `<span class="sideseg"><span class="${SIDE==='c'?'on':''}" onclick="setSide('c')">Claude(.md)</span><span class="${SIDE==='x'?'on':''}" onclick="setSide('x')">Codex(.toml)</span></span>` : ''
  const cur = both ? (SIDE==='c'?a.cl:a.cx) : (a.cl||a.cx)
  const kv = a.cl && (both?SIDE==='c':true)
    ? `<div class="kv"><span class="k2">tools</span><span>${esc(cur.tools||'—')}</span><span class="k2">model</span><span>${esc(cur.model||'—')}</span></div>`
    : `<div class="kv"><span class="k2">model</span><span>${esc(cur.model||'—')}</span><span class="k2">sandbox_mode</span><span>${esc(cur.sandbox||'—')}</span></div>`
  return `<h2>${esc(a.name)}</h2><div class="meta">${a.desc?esc(a.desc):''}</div>${seg}${kv}
    <div class="mdv">${esc(cur.body)}</div>`
}
function pluginDetailHtml(p){
  if (!p.contents) return `<div class="none">安装目录缺失(缓存已清理)——仅注册表记录可见,内含组件无法读取。</div>`
  const inst = p.installs.map(r=>`<div class="chip ${r.missing?'bad':''}">${r.scope}${r.proj?` · ${r.proj}`:''}${r.projMissing?'(项目已失联)':''}</div>`).join('')
  const sect = (t,items,ns)=> items.length ? `<div class="sect">${t}</div>`+items.map(x=>`<span class="chip">${ns?ns+':':''}${esc(x)}</span>`).join('') : ''
  return `<div class="sect">安装记录</div>${inst}
    ${sect('内含 skills(命名空间调用)',p.contents.skills, p.name.split('@')[0])}
    ${sect('内含 subagents',p.contents.agents)}
    ${sect('内含 hooks(事件摘要)',p.contents.hooks)}
    ${sect('内含 MCP servers',p.contents.mcp)}
    ${!p.contents.skills.length&&!p.contents.agents.length&&!p.contents.hooks.length&&!p.contents.mcp.length?'<div class="none">四类均无</div>':''}`
}
function topicDetailHtml(t){
  return `<h2>${esc(t.f)}</h2><div class="meta">topic 文件 · ${t.at}</div><div class="mdv">${esc(t.body)}</div>`
}

/* — tab 主体 — */
function renderBody(){
  let rows, note='', onRow
  if (TAB==='subagents'){ rows=subagentRows(); onRow=(i)=>`openReader('subagent',${i})`
    note = PAGE==='global'?'双端合并单列 · 同名一行(不做 diff) · 点条目开抽屉看完整定义':'生效视图 · Claude/Codex 均为项目级遮蔽(subagents 语义,与 skills 的 Codex 共存不同)' }
  if (TAB==='plugins'){ renderPlugins(); return }
  if (TAB==='skills'){ rows=skillRows(); onRow=()=>'void 0'
    note = '更名「Skills」· 来源徽标:全局库 / 项目级 / 插件(命名空间,只读无装卸)' }
  if (TAB==='memory'){ renderMemory(); return }

  const listHtml = rows.map(r=>{
    let expHtml = ''
    if (TAB==='plugins' && EXP.has(r.i)) expHtml = `<div class="exp">${pluginDetailHtml(r.data)}</div>`
    return `<div class="it" onclick="${onRow(r.i)}">${r.html}</div>${expHtml}`
  }).join('')
  $('tabBody').innerHTML = `<div class="grp-t">${note}</div><div class="card">${listHtml}</div>`
}

function renderPlugins(){
  const note = PAGE==='global'
    ? '按侧分组 · Claude 组:user 层启用口径,逐条安装记录不合并,点条目展开内含组件'
    : '按侧分组 · Claude 组:本项目有效启用集(local > project > user)'
  const clHtml = pluginRows().map(r=>{
    const expHtml = EXP.has(r.i) ? `<div class="exp">${pluginDetailHtml(r.data)}</div>` : ''
    return `<div class="it" onclick="toggleExp(${r.i})">${r.html}</div>${expHtml}`
  }).join('')
  const cxHtml = PLUGINS_CODEX.map(p=>`<div class="it" style="cursor:default">
    <span class="nm" style="width:270px">${esc(p.name)}@${esc(p.mkt)}</span>
    <span class="src">v${p.ver}${p.versions>1?` (${p.versions} 个版本缓存)`:''}</span>
    <span class="ds">仅缓存枚举</span></div>`).join('')
  $('tabBody').innerHTML = `<div class="grp-t">${note}</div>
    <div class="grp-t"><span class="b c">CLAUDE CODE</span></div>
    <div class="card">${clHtml}</div>
    ${PLUGINS_CODEX.length ? `<div class="grp-t"><span class="b x">CODEX</span>(目录非空才显示本组)</div>
    <div class="card">${cxHtml}</div>
    <div class="note">Codex 组仅列缓存中存在的插件(名称/marketplace/版本);启用态与内含组件语义本期不建模${PAGE==='detail'?';Codex 插件为全局生效,无项目级启用语义':''}。</div>` : ''}`
}

function renderMemory(){
  if (PAGE==='global'){
    const rows = memoryRows()
    const listHtml = rows.map(r=>{
      const expHtml = EXP.has(r.i) ? `<div class="exp">${r.data.files.map((t,j)=>
        `<div class="it" style="padding:6px 0" onclick="openReader('gmem',${r.i},${j})">
           <span class="nm" style="flex:1">${esc(t.f)}</span><span class="src">${t.at}</span></div>`).join('')}</div>` : ''
      return `<div class="it" onclick="toggleExp(${r.i})">${r.html}</div>${expHtml}`
    }).join('')
    $('tabBody').innerHTML = `<div class="grp-t">按最近修改倒序 · 含失效/已隐藏(带徽标) · 点行展开文件列表,点文件开抽屉</div>
      <div class="card">${listHtml}</div>
      <div class="note">Codex 全局记忆为探测式:目录为空时整行不出现(本机当前为空,此行为演示态)。文件内容按需读取,不进快照。</div>`
    return
  }
  const topics = MEMORY_DETAIL.topics.map((t,i)=>
    `<div class="it" onclick="openReader('topic',${i})"><span class="nm" style="flex:1">${esc(t.f)}</span><span class="src">${t.at}</span></div>`).join('')
  $('tabBody').innerHTML = `<div class="grp-t">MEMORY.md(自动记忆主文件,直接渲染——同配置 tab 模式)</div>
    <div class="md">${MEMORY_DETAIL.main}</div>
    <div class="grp-t">Topic 文件(${MEMORY_DETAIL.topics.length}) · 点击开抽屉查看</div>
    <div class="card">${topics}</div>`
}

/* — Plugins 展开 — */
function toggleExp(i){ EXP.has(i)?EXP.delete(i):EXP.add(i); render() }

/* — reader 抽屉(点行直开;双端切换在抽屉内原地刷新) — */
function readerHtml(){
  if (!READER) return ''
  if (READER.kind==='subagent'){
    const a = (PAGE==='global'?SUBAGENTS_GLOBAL:SUBAGENTS_DETAIL)[READER.i]
    return subagentDetailHtml(a)
  }
  if (READER.kind==='gmem'){
    const m = MEMORY_GLOBAL[READER.i], t = m.files[READER.j]
    return `<h2>${esc(t.f)}</h2><div class="meta">${esc(m.proj)} · ${esc(m.path)}/memory · ${t.at}</div>
      <div class="mdv">${esc(t.body)}</div>`
  }
  return topicDetailHtml(MEMORY_DETAIL.topics[READER.i])
}
function openReader(kind, i, j){
  closeReader()
  READER = { kind, i, j }
  if (kind==='subagent'){ const a=(PAGE==='global'?SUBAGENTS_GLOBAL:SUBAGENTS_DETAIL)[i]
    SIDE = a && a.cl ? 'c' : 'x' }
  const mask=document.createElement('div'); mask.className='mask'; mask.id='mask'; mask.onclick=closeReader
  const panel=document.createElement('div'); panel.className='reader'; panel.id='reader'; panel.innerHTML=readerHtml()
  document.body.appendChild(mask); document.body.appendChild(panel)
}
function setSide(s){ SIDE=s; const panel=$('reader'); if (panel) panel.innerHTML = readerHtml() }
function closeReader(){ ['mask','reader'].forEach(id=>{ const el=$(id); if(el) el.remove() }); READER=null }

function render(){
  closeReader()
  renderHead()
  renderBody()
}
document.addEventListener('keydown',(e)=>{ if (e.key==='Escape') closeReader() })
render()
</script>
<script>
  // 跨原型跳转:画廊内请求父页切换;独立打开时直接跳文件
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-goto]');
    if (!el) return;
    if (window.parent !== window) parent.postMessage({ type: 'proto-nav', target: el.dataset.goto }, '*');
    else if (el.dataset.gotoHref) location.href = el.dataset.gotoHref;
  });
</script>
</body>
</html>
