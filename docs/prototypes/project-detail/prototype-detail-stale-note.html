<!doctype html>
<!-- A UI prototype · 失效项目详情页的移除提示卡(2026-08-22,需求:产品仅提示、不代操作)。
     裁定(2026-08-22 用户):失效项目的详情页**不展示 tabs、不展示任何数据区**,壳(返回/项目名/
       失效标/路径)之下只有这张提示卡——失效态的详情页整页即本卡。
     裁定(2026-08-22 用户):卡不提供任何手动命令与文件细节——只按"哪些 agent 记录着它"给出对应
       徽标,并给一句可复制的话让用户发给对应 agent,由 agent 自己删除(实测 Claude Code 会自行
       备份、保持文件合法并提示回写竞态;竞态的兜底是幂等重发)。
     问题:①提示卡长什么样——失效原因句开卡、影响说明、发给 agent 的一句话;②三侧全占/单侧时
       原因句与提示句的徽标是否跟随;③两种语言的文案在此宽度下的换行形态;④复制按钮的图标——已定稿
       (2026-08-23 选 Lucide copy)。
     文案注:卡内全部文案是本页新写的文案(中英两种)。失效原因的表述用
       "目录已不存在(被删除或移动)"——扫描只知道路径不存在,删除与移动无法区分,不得写死一种。
     真实判定来源:失效 = 扫描时该路径已不存在;卡中出现哪些侧 = 该项目记录在哪些 agent 侧;
       语言 = 设置里的语言偏好。app 内无本页 harness 的任何开关;记录侧一组的判定同时写在演示条的说明行里。
     2026-10-21:界面语言减到中英(ADR-0035),卡内文案随之只留这两种。
     图标注:复制按钮用 Lucide copy(已定稿);全部图标来自 _shared/icons.js。
     演示基建(非设计的一部分,勿实现):底部悬浮演示条(data-demo-harness)——「记录侧」
       CC+CX+GK / 仅 CC / 仅 GK。界面语言、明暗与配色跟随设置原型(appearance)与画廊的统一设置所选,本页不设开关
       (卡内文案画了中英两种语言,即全部界面语言);色值取共享主题 _shared/theme.css,
       本页不自定义 app token。app 窗口的根样式在共享件 _shared/app-window.css 里。
     项目栏是共享件 _shared/project-side.{js,css}(与列表页同一个项目栏、同一批 mock 项目;有原型的项目点击即进入)。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>原型 — 详情页失效移除提示卡</title>
<link rel="stylesheet" href="../_shared/theme.css">
<link rel="stylesheet" href="../_shared/app-window.css">
<link rel="stylesheet" href="../_shared/app-rail.css">
<link rel="stylesheet" href="../_shared/project-side.css">
<style>
  /* Every app token (surfaces, text, lines, the accent family, the semantic and side colours) comes from
     _shared/theme.css for each palette and both modes. This page defines none of them. */
  *{box-sizing:border-box;margin:0;font-family:-apple-system,"PingFang SC",sans-serif}
  .main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
  .head{padding:14px 22px 0;border-bottom:1px solid var(--line)}
  .bk{display:inline-flex;align-items:center;gap:4px;color:var(--text-2);font-size:12px;cursor:pointer;margin-bottom:6px}
  .bk:hover{color:var(--text)}
  .h1{display:flex;align-items:center;gap:9px}
  .h1 b{font-size:16px;text-decoration:line-through;color:var(--text-2)}
  /* The stale tag takes --warn-fg for its text and border, as the project column's does */
  .h1 .stale-tag{font-size:9.5px;border:1px solid var(--warn-fg);color:var(--warn-fg);border-radius:3px;padding:0 4px;opacity:.8}
  .path{font-size:11px;color:var(--text-2);font-family:ui-monospace,Menlo,monospace;margin:3px 0 10px}
  .body{flex:1;overflow:auto;padding:16px 22px}

  /* ── 被评判的设计:失效移除提示卡 ── */
  /* 语域注:本卡是失效详情页的整页正文(2026-08-22 裁定),不是数据区旁的脚注——
     正文句走 --text/13px 与 app 窗口的正文一致;次级灰只留给真正的辅注(untrust 说明),
     琥珀警示与等宽代码各守自己的语域 */
  .stale-note{border:1px dashed var(--line-strong);border-radius:9px;padding:13px 16px;margin-bottom:16px;
    font-size:13px;line-height:1.6;color:var(--text)}
  .stale-note .cause{font-weight:600;margin-bottom:2px}
  .stale-note .cause .b{margin:0 2px}
  .stale-note .fx{margin-bottom:8px}
  .sn-llm{margin-top:8px}
  .sn-how{margin-bottom:3px}
  .codeline{display:flex;align-items:center;gap:6px;min-width:0}
  .code{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:var(--card);
    border:1px solid var(--line);border-radius:5px;padding:3px 7px;min-width:0;
    overflow-wrap:anywhere;color:var(--text)}
  /* 复制按钮:固定盒 + 居中(/ui-design 图标按钮规范),不靠字体撑尺寸 */
  .cpy{flex:none;width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--line);
    border-radius:5px;background:var(--card);color:var(--text-2);cursor:pointer;padding:0}
  .cpy:hover{color:var(--accent);border-color:var(--line-strong)}
  .cpy svg{display:block}
  .copied{font-size:10.5px;color:var(--accent);opacity:0;transition:opacity .15s}
  .copied.on{opacity:1}
  .b{font-size:9px;font-weight:700;border-radius:3px;padding:1px 4px}
  .b.c{background:var(--cl-bg);color:var(--cl-fg)}.b.x{background:var(--cx-bg);color:var(--cx-fg)}
  .b.g{background:var(--gk-bg);color:var(--gk-fg)}
</style>
<script src="../dimensions.js"></script>
<script src="../demo-dimensions.js" data-follow="language mode theme"></script>
<script src="../manifest.js"></script>
<script src="../app-identity.js"></script>
<script src="../_shared/icons.js"></script>
</head>
<body>
<div class="app-window" data-shared-block="app-window">
  <nav class="rail" data-shared-block="app-rail" data-rail-current="projects"></nav>
  <script src="../_shared/app-rail.js"></script>
  <aside class="side" data-shared-block="project-side" data-side-selected="removed-experiment-2025" data-side-show-stale></aside>
  <script src="../_shared/project-side.js"></script>
  <div class="main">
    <div class="head">
      <div class="bk" data-goto="project-list/list" data-goto-href="../project-list/prototype-list.html"><span data-icon="ChevronLeft" data-icon-size="13"></span><span id="backT"></span></div>
      <div class="h1"><b>removed-experiment-2025</b><span class="stale-tag" id="staleT"></span></div>
      <div class="path">/Users/you/Projects/removed-experiment-2025</div>
    </div>
    <div class="body">

      <!-- 被评判的设计:提示卡 -->
      <div class="stale-note" id="note"></div>

    </div>
  </div>
</div>

  <!-- 演示条的状态开关(data-demo-harness,非设计的一部分,勿实现):真实判定写在条内的说明行,app 内无此控件 -->
  <div data-demo-harness>
    <span class="dh-tag">Demo ·</span>
    <div class="dh-group">
      <span class="dh-title">记录侧</span>
      <div class="dh-opts">
        <button type="button" class="dh-opt" data-v="s:all" aria-pressed="true">CC+CX+GK</button>
        <button type="button" class="dh-opt" data-v="s:cc" aria-pressed="false">仅 CC</button>
        <button type="button" class="dh-opt" data-v="s:gk" aria-pressed="false">仅 GK</button>
      </div>
    </div>
    <p class="dh-note">记录侧在 app 里由该项目记录在哪些 agent 侧(哪些 agent 的注册表还记着它)决定;app 内没有这个开关。</p>
  </div>

<script>
// ── 卡内文案(中英,本页新写) ──
const PATH = '/Users/you/Projects/removed-experiment-2025';
const T = {
  zh:{back:'返回项目列表', stale:'失效',
    cause:(b)=>`失效原因:项目目录已不存在(被删除或移动),而 ${b} 的注册表仍记录着它。`,
    fx:'从注册表移除该记录后,此行将从列表消失;token 累计与趋势不受影响(统计独立于注册表)。',
    llmHow:(b)=>`把这句话分别发给 ${b},由它自己删除:`,
    llmPrompt:(p)=>`我的项目 "${p}" 已经失效(目录已不存在),请帮我从你的配置中移除它的记录。`,
    copied:'已复制' },
  en:{back:'Back to projects', stale:'Stale',
    cause:(b)=>`Why stale: the project directory no longer exists (deleted or moved), while the ${b} ${b.includes('·')?'registries':'registry'} still records it.`,
    fx:'Removing the records takes this row off the list; token totals and the trend are unaffected (the statistics are independent of the registries).',
    llmHow:(b)=>`Send this line to ${b} and let each of them delete it themselves:`,
    llmPrompt:(p)=>`My project "${p}" is stale (the directory no longer exists) — please remove its records from your configuration.`,
    copied:'Copied' }
};
// 图标已定稿(2026-08-23 选 Lucide copy),取自共享图标表 _shared/icons.js
const COPY_SVG = ICONS.Copy(12);
// 全名徽章(2026-08-23 用户裁定:不用 CC/CX/GK 缩写)——与 Agents 侧卡、Plugins 区标题的
// CLAUDE CODE/CODEX/GROK chips 同款形态
const BADGE = {cc:'<span class="b c">CLAUDE CODE</span>', cx:'<span class="b x">CODEX</span>', gk:'<span class="b g">GROK</span>'};
let SIDES = ['cc','cx','gk'], LANG = 'zh';

function codeline(payload){
  return `<span class="codeline"><span class="code">${payload.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</span>`+
    `<button class="cpy" data-copy="${payload.replace(/"/g,'&quot;')}" title="copy">${COPY_SVG}</button>`+
    `<span class="copied"></span></span>`;
}
function render(){
  const t = T[LANG];
  document.getElementById('backT').textContent = t.back;
  document.getElementById('staleT').textContent = t.stale;
  const badges = SIDES.map((s)=>BADGE[s]).join(' · ');
  document.getElementById('note').innerHTML =
    `<div class="cause">${t.cause(badges)}</div><div class="fx">${t.fx}</div>`+
    `<div class="sn-llm"><div class="sn-how">${t.llmHow(badges)}</div>${codeline(t.llmPrompt(PATH))}</div>`;
}
DemoDimensions.on('language', (v)=>{
  LANG = v;
  document.documentElement.lang = {zh:'zh-CN',en:'en'}[v];
  render();
});

// 复制:视觉反馈为主;clipboard 在 file:// 下可能受限,失败也只影响演示
document.addEventListener('click', (e)=>{
  const b = e.target.closest('.cpy[data-copy]');
  if (!b) return;
  try { navigator.clipboard && navigator.clipboard.writeText(b.dataset.copy); } catch {}
  const fb = b.parentElement.querySelector('.copied');
  fb.textContent = T[LANG].copied; fb.classList.add('on');
  setTimeout(()=>fb.classList.remove('on'), 1200);
});

// 演示条:只建一次,这里只改 aria-pressed
document.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-demo-harness] [data-v]'); if (!el) return;
  const [k,v] = el.dataset.v.split(':');
  for (const sib of el.parentElement.querySelectorAll(`[data-v^="${k}:"]`)) sib.setAttribute('aria-pressed', String(sib===el));
  if (k==='s') SIDES = v==='all' ? ['cc','cx','gk'] : [v];
  render();
});
</script>
<script>
  // Cross-prototype navigation: inside the gallery ask the parent page to switch; when opened alone, go to the file directly
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-goto]');
    if (!el) return;
    if (window.parent !== window) parent.postMessage({ type: 'proto-nav', target: el.dataset.goto }, '*');
    else if (el.dataset.gotoHref) location.href = el.dataset.gotoHref;
  });
</script>
<script src="../demo-harness.js"></script>
</body>
</html>
