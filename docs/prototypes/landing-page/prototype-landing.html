<!doctype html>
<!-- Reviewer notes: prototype-landing.md -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原型 — 落地页</title>
<link rel="stylesheet" href="../_shared/theme.css">
<style>
  /* The page's own tokens, on top of the shared theme's purple palette (the default); light and dark each
     declared */
  html[data-demo-mode="light"]{
    --bg-soft:#f0f1f3;
    --shot-a:#ece7f3; --shot-b:#f6f3fa;
    --shadow:0 18px 50px rgba(55,53,47,.16);
    --icon-shadow:0 18px 25px rgba(55,53,47,.18);
  }
  html[data-demo-mode="dark"]{
    --bg-soft:#1c1d20;
    --shot-a:#26232d; --shot-b:#2e2a36;
    --shadow:0 18px 50px rgba(0,0,0,.55);
    --icon-shadow:0 18px 25px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;margin:0}
  /* Root styles sit on body: the page draws a web page, not an app window, so no app-window container carries them */
  body{background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,"PingFang SC","Hiragino Sans",system-ui,sans-serif}
  a{color:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px}

  /* ── Header ── */
  header{position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:22px;height:58px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;text-decoration:none}
  .brand img{width:28px;height:28px;border-radius:7px}
  nav.links{display:flex;gap:18px;margin-left:auto;font-size:14px;color:var(--text-2)}
  nav.links a{text-decoration:none}
  nav.links a:hover{color:var(--accent)}
  .lang{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
  .lang button{font:inherit;font-size:13px;padding:4px 10px;border:0;background:transparent;color:var(--text-2);cursor:pointer}
  .lang button:hover{color:var(--text);background:var(--bg-soft)}
  .lang button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}

  /* ── Buttons ── */
  .btn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-weight:600;border-radius:10px;
    padding:12px 22px;text-decoration:none;cursor:pointer;border:1px solid transparent;white-space:nowrap}
  .btn-primary{background:var(--accent);color:var(--card)}
  .btn-primary:hover{background:var(--accent-deep)}
  .btn-ghost{border-color:var(--line-strong);background:var(--card);color:var(--text)}
  .btn-ghost:hover{border-color:var(--accent);background:var(--accent-soft)}
  .btn-sm{padding:7px 16px;font-size:14px}
  .pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;
    background:var(--warn-bg);color:var(--warn-fg);vertical-align:middle}

  /* ── Hero ── */
  /* padding-block, not the padding shorthand: the shorthand would zero the side gutter .wrap gives this element */
  .hero{padding-block:72px 40px;text-align:center}
  /* A drop shadow, not a box shadow: it follows the icon's outline, so the transparent margin round the artwork
     stays invisible instead of reading as a tile */
  .hero .icon{width:112px;height:112px;filter:drop-shadow(var(--icon-shadow))}
  .hero h1{font-size:44px;line-height:1.15;margin:22px 0 12px;letter-spacing:-.01em}
  .hero .lede{font-size:18px;color:var(--text-2);max-width:720px;margin:0 auto 28px}
  .cta{display:flex;flex-direction:column;align-items:center;gap:10px}
  .cta .meta{font-size:13px;color:var(--text-2)}
  .cta .beta-note{font-size:13px;color:var(--warn-fg);max-width:520px}
  .cta .alt{font-size:13px;color:var(--text-2)}
  .cta .alt a{color:var(--accent)}

  /* A screenshot placeholder framed as an app window */
  .shot{border:1px solid var(--line-strong);border-radius:14px;background:linear-gradient(135deg,var(--shot-a),var(--shot-b));
    box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
  .shot .chrome{height:28px;display:flex;align-items:center;gap:6px;padding:0 12px;background:var(--card);border-bottom:1px solid var(--line)}
  .shot .chrome i{width:10px;height:10px;border-radius:50%;background:var(--line-strong)}
  /* The tags carry width and height so the space is held before an image loads: without them, a language
     switch swaps in unloaded screenshots, everything above collapses and the page jumps */
  .shot img{display:block;width:100%;height:auto}
  .hero .shot{max-width:960px;margin:48px auto 0}

  /* ── Sections ── */
  section{padding:64px 0}
  section.soft{background:var(--bg-soft)}
  .sec-title{font-size:28px;text-align:center;margin-bottom:8px}
  .sec-sub{color:var(--text-2);text-align:center;margin-bottom:36px}
  /* Features: on a wide screen the section pins a showcase under the header while the page scrolls past it —
     a narrow column on the left with the current step's text and its count, the step's screenshot large on the
     right. Each 60% of a screen of scrolling turns to the next step: its text and screenshot fade in where the
     current ones fade out, together and in place. The page scrolls as usual; nothing captures the wheel. Phones
     keep the stacked steps, each with its own screenshot. */
  .deck{position:relative;max-width:1240px;margin:0 auto;padding:0 24px;
    height:calc(100svh - 58px + (var(--n) - 1) * 60svh)}
  /* Pinned under the 58px header for as long as the deck scrolls by */
  .deck-pin{position:sticky;top:58px;height:calc(100svh - 58px);display:grid;
    grid-template-columns:minmax(0,.36fr) minmax(0,1fr);gap:40px;align-items:center}
  /* The steps' texts share one cell, and so do their screenshots: one of each shows, and the others are hidden
     from the pointer and from assistive technology. They only fade, never move, and the text and the screenshot
     fade with the same timing, so they switch as one. visibility as well as opacity: a transparent screenshot
     would still lie on top and take the pointer. */
  .deck-copy, .deck-stage{display:grid}
  .deck-text, .deck-shot{grid-area:1/1;opacity:0;visibility:hidden;transition:opacity .3s, visibility 0s .3s}
  .deck-text.on, .deck-shot.on{opacity:1;visibility:visible;transition:opacity .3s}
  @media (prefers-reduced-motion:reduce){ .deck-text, .deck-shot, .deck-text.on, .deck-shot.on{transition:none} }
  /* Every step's text starts on the same line, so the count and the title stay put as the steps switch; the
     column, as tall as the longest text, is what sits centred beside the screenshot */
  .deck-text{align-self:start;display:flex;flex-direction:column;gap:12px}
  .deck-n{font:12px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.06em;color:var(--text-2)}
  .deck-text h3{font-size:28px;line-height:1.3}
  .deck-text p{color:var(--text-2)}
  /* The width is capped so a short window still holds the whole screenshot under the header */
  .deck-stage{width:100%;max-width:calc((100svh - 190px) * 16 / 9);justify-self:center}
  .fs-list{display:none}
  .fs-step .fs-h{font-size:22px;line-height:1.3;margin-bottom:10px}
  .fs-step .fs-p{color:var(--text-2)}
  .fs-step .m-shot{margin-top:18px}

  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
  .step .n{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;
    display:flex;align-items:center;justify-content:center;margin-bottom:12px}
  .step h4{font-size:16px;margin-bottom:6px}
  .step p{color:var(--text-2);font-size:14px}

  .dl{max-width:680px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 22px}
  .dl-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 0;flex-wrap:wrap}
  .dl-row + .dl-row{border-top:1px solid var(--line)}
  .dl-label b{display:block}
  .dl-label span{font-size:13px;color:var(--text-2)}
  .dl-actions{display:flex;gap:10px}

  footer{border-top:1px solid var(--line);padding:28px 0;color:var(--text-2);font-size:13px}
  footer .wrap{display:flex;gap:18px;flex-wrap:wrap}
  footer a{color:var(--text-2)}

  .note{max-width:1080px;margin:0 auto 90px;padding:14px 18px;border:1px dashed var(--line-strong);border-radius:12px;
    font-size:13px;color:var(--text-2);line-height:1.6}
  .note b{color:var(--text)}

  @media (max-width:760px){
    .hero h1{font-size:32px}
    .deck{display:none}
    /* Without a gap the next step's title sits right under the previous screenshot and reads as its caption */
    .fs-list{display:flex;flex-direction:column;gap:44px}
    .steps{grid-template-columns:1fr}
    nav.links{display:none}
    .lang{margin-left:auto}
  }
  /* Phones: the label takes its own line and the buttons share the full width below it; beside the label,
     "Download the test version from GitHub" overflows the card at 400px */
  @media (max-width:560px){
    .dl-row{flex-direction:column;align-items:stretch;gap:10px}
    .dl-actions .btn{flex:1;justify-content:center;white-space:normal;text-align:center}
  }
</style>
<script src="../manifest.js"></script>
<script src="../app-identity.js"></script>
<script src="../dimensions.js"></script>
<script src="../demo-dimensions.js" data-follow="mode"></script>
</head>
<body>
  <header>
    <div class="wrap bar">
      <a class="brand" href="#top"><img src="../../../build/icon.png" alt=""><span>Agentshed</span></a>
      <nav class="links" id="navLinks"></nav>
      <span class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="zh">中文</button>
        <button type="button" data-lang="en">EN</button>
      </span>
    </div>
  </header>
  <main id="page"></main>

  <div data-demo-harness id="demoBar">
    <span class="dh-tag">Demo ·</span>
    <div class="dh-group"><span class="dh-title">下载状态</span><div class="dh-opts">
      <button type="button" class="dh-opt" data-rel="beta" aria-pressed="true">仅测试版 0.1.0-beta</button>
      <button type="button" class="dh-opt" data-rel="formal" aria-pressed="false">有正式版 0.2.0</button>
    </div></div>
    <div class="dh-group"><span class="dh-title">读取失败</span><div class="dh-opts">
      <button type="button" class="dh-opt" data-rel="formalGh" aria-pressed="false">有正式版,R2 读不到</button>

    <p class="dh-note">下载状态在落地页上由访客浏览器能否读到 R2 上正式版的 latest 指针决定,读不到时看能否从 GitHub 公开接口读到正式版或测试版;首发时只有测试版;两处都读不到(断网等)也是页面脚本执行前的样子;页面上没有这个开关。</p>
  </div>

<script>
  /** Lucide download, copied from lucide-static 1.55.0 */
  const ICON_DOWNLOAD = (s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>`

  const REPO = 'https://github.com/aloong-planet/agentshed'
  /** The download host */
  const DL_HOST = 'https://dl.agentshed.aloongplanet.com'
  const RELEASES = {
    beta: { formal: null, pre: '0.1.0-beta' },
    formal: { formal: '0.2.0', pre: null },
    formalGh: { formal: '0.2.0', pre: null, viaGithub: true },
    unknown: { formal: null, pre: null },
  }

  const T = {
    zh: {
      htmlLang: 'zh-CN',
      nav: ['功能', '安装', '下载', 'GitHub'],
      title: '你的 coding agent，尽收眼底',
      lede: '一处看清 Claude Code、Codex 等 coding agent 在每个项目里装了哪些 skills、plugins 与 MCP，记住了什么，烧了多少 token；每次会话按提问回看，所有项目一起搜索；还能把全局 skill 装进任意项目。',
      download: (v) => `下载 Agentshed ${v}`,
      downloadBeta: (v) => `下载测试版 ${v}`,
      testPill: '测试版',
      meta: 'macOS 12 及以上 · Apple Silicon',
      betaNote: '正式版尚未发布。测试版从 GitHub 下载，可能还有不稳定之处。',
      allVersions: '在 GitHub 查看所有版本',
      shotHero: 'Agentshed 的 Agents 总览',
      featTitle: '一个应用，看清全部',
      featSub: '它只读取你本机上 coding agent 留下的文件。',
      feats: [
        ['全局总览', '每个 coding agent 装了什么、一共烧了多少 token，打开就是全景。', 'overview', '所有 agent 侧的 skills 合并在一张表里'],
        ['每个项目装了什么', 'skills、subagents、plugins、MCP 与配置，按项目实际生效的样子列出来。', 'project', '一个项目的 Skills 页'],
        ['agent 记住了什么', '每个项目里 agent 跨会话记住的内容，在全局页按项目汇总，点开一份就在抽屉里读全文。', 'memory', 'Agents 页的记忆分页，抽屉里打开了一份记忆'],
        ['Token 用量与趋势', '按天、按项目、按模型拆开看，历史用量本地存档，不怕 agent 自己清理会话。', 'tokens', '一个项目的 token 总量、趋势与按模型拆分'],
        ['会话回看', '按提问索引一次会话，点开整轮看工具调用与子任务，也能在项目内搜索。', 'session', '会话页：提问索引与展开的一整轮'],
        ['全局搜索', '在所有项目的会话里搜你问过的话，按项目分组列出，点开一条直接回到那次提问。', 'search', '全局搜索页：按项目分组的命中'],
      ],
      installTitle: '安装',
      steps: [
        ['下载 DMG', '下载适用于 Apple Silicon 的安装包。'],
        ['拖进「应用程序」', '打开 DMG，把 Agentshed 拖到「应用程序」文件夹。'],
        ['首次打开', 'macOS 会提示「Apple 已检查，未发现恶意软件」，点「打开」即可。之后有新版本时，应用左下角会出现更新按钮。'],
      ],
      dlTitle: '下载',
      dlSub: (v) => `当前版本 ${v}`,
      dlSubBeta: (v) => `当前只有测试版 ${v}`,
      dlLabel: 'macOS · Apple Silicon',
      dlLabelSub: 'macOS 12 及以上，M 系列芯片',
      dlPrimary: '下载',
      dlGithub: 'GitHub',
      dlBeta: '从 GitHub 下载测试版',
      downloadGithub: '前往 GitHub 下载 Agentshed',
      dlSubUnknown: '暂时读不到版本信息，可前往 GitHub 下载',
      dlGithubAll: '前往 GitHub 下载',
      foot: ['GitHub', '版本发布', '© 2026 aloongplanet'],
    },
    en: {
      htmlLang: 'en',
      nav: ['Features', 'Install', 'Download', 'GitHub'],
      title: 'Your coding agents, in full view',
      lede: 'See, across every project, which skills, plugins and MCP servers Claude Code, Codex and other coding agents have installed, what they remember and how many tokens they burned; revisit every session question by question, search what you asked across all of them, and install skills from your global library into any project.',
      download: (v) => `Download Agentshed ${v}`,
      downloadBeta: (v) => `Download test version ${v}`,
      testPill: 'Test version',
      meta: 'macOS 12 or later · Apple Silicon',
      betaNote: 'No stable release yet. The test version downloads from GitHub and may still be rough in places.',
      allVersions: 'See every version on GitHub',
      shotHero: 'The Agents overview in Agentshed',
      featTitle: 'One app, the whole picture',
      featSub: 'It only reads the files your coding agents leave on your Mac.',
      feats: [
        ['The overview', 'What every coding agent has installed and how many tokens it has burned, as soon as you open it.', 'overview', 'Every agent side’s skills in one merged list'],
        ['What each project has', 'Skills, subagents, plugins, MCP servers and configuration, listed as they actually take effect in that project.', 'project', 'A project’s Skills tab'],
        ['What the agents remember', 'What the agents have remembered about each project across sessions, gathered by project on one page; open a file to read it in full in a drawer.', 'memory', 'The Agents page’s Memory section, one memory file open in a drawer'],
        ['Token usage and trends', 'Split by day, project and model, with history kept locally even after an agent cleans up its own sessions.', 'tokens', 'A project’s token totals, trend and per-model split'],
        ['Sessions, revisited', 'Each session indexed by question; open a whole turn to see its tool calls and subagents, or search within the project.', 'session', 'The session page: the question index with one whole turn open'],
        ['Search across projects', 'Find what you asked in any project’s sessions, grouped by project, and open a hit right at that question.', 'search', 'The search page: hits grouped by project'],
      ],
      installTitle: 'Install',
      steps: [
        ['Download the DMG', 'Get the installer for Apple Silicon.'],
        ['Drag to Applications', 'Open the DMG and drag Agentshed into your Applications folder.'],
        ['Open it', 'macOS says “Apple checked it for malicious software and none was detected” — click Open. When a new version comes out, an update button appears at the bottom left of the app.'],
      ],
      dlTitle: 'Download',
      dlSub: (v) => `Current version ${v}`,
      dlSubBeta: (v) => `Only a test version so far: ${v}`,
      dlLabel: 'macOS · Apple Silicon',
      dlLabelSub: 'macOS 12 or later, M-series chips',
      dlPrimary: 'Download',
      dlGithub: 'GitHub',
      dlBeta: 'Download the test version from GitHub',
      downloadGithub: 'Download Agentshed from GitHub',
      dlSubUnknown: 'Version details can’t be loaded right now — download from GitHub',
      dlGithubAll: 'Download from GitHub',
      foot: ['GitHub', 'Releases', '© 2026 aloongplanet'],
    },
  }

  let lang = 'zh'
  let rel = 'beta'
  /** The feature step the deck shows; kept across re-renders so switching language keeps the place */
  let feat = 0
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
  const dmg = (v) => `Agentshed-${v}-mac-arm64.dmg`

  function render() {
    const d = T[lang]
    const r = RELEASES[rel]
    document.documentElement.lang = d.htmlLang
    document.querySelectorAll('.lang button').forEach((b) => b.classList.toggle('on', b.dataset.lang === lang))
    const anchors = ['#features', '#install', '#download', REPO]
    document.getElementById('navLinks').innerHTML = d.nav.map((n, i) =>
      `<a href="${anchors[i]}"${i === 3 ? ' target="_blank" rel="noopener"' : ''}>${esc(n)}</a>`).join('')

    const githubDmg = r.formal && `${REPO}/releases/download/v${r.formal}/${dmg(r.formal)}`
    // R2 unreadable but GitHub has a formal release: the same state, with every link on GitHub
    const formalUrl = r.formal && (r.viaGithub ? githubDmg : `${DL_HOST}/releases/v${r.formal}/${dmg(r.formal)}`)
    const betaUrl = r.pre && `${REPO}/releases/tag/v${r.pre}`
    const listUrl = `${REPO}/releases`
    const heroCta = r.formal
      ? `<a class="btn btn-primary" href="${formalUrl}">${ICON_DOWNLOAD(18)} ${esc(d.download(r.formal))}</a>
         <div class="meta">${esc(d.meta)}</div>
         <div class="alt"><a href="${listUrl}" target="_blank" rel="noopener">${esc(d.allVersions)}</a></div>`
      : r.pre
        ? `<a class="btn btn-primary" href="${betaUrl}" target="_blank" rel="noopener">${ICON_DOWNLOAD(18)} ${esc(d.downloadBeta(r.pre))}</a>
           <div class="meta"><span class="pill">${esc(d.testPill)}</span> ${esc(d.meta)}</div>
           <div class="beta-note">${esc(d.betaNote)}</div>`
        // Neither source read: no version is named, since none is known
        : `<a class="btn btn-primary" href="${listUrl}" target="_blank" rel="noopener">${ICON_DOWNLOAD(18)} ${esc(d.downloadGithub)}</a>
           <div class="meta">${esc(d.meta)}</div>`

    const dlActions = r.formal
      ? `<a class="btn btn-primary btn-sm" href="${formalUrl}">${ICON_DOWNLOAD(15)} ${esc(d.dlPrimary)}</a>${r.viaGithub ? '' : `
         <a class="btn btn-ghost btn-sm" href="${githubDmg}" target="_blank" rel="noopener">${esc(d.dlGithub)}</a>`}`
      : r.pre
        ? `<a class="btn btn-primary btn-sm" href="${betaUrl}" target="_blank" rel="noopener">${ICON_DOWNLOAD(15)} ${esc(d.dlBeta)}</a>`
        : `<a class="btn btn-primary btn-sm" href="${listUrl}" target="_blank" rel="noopener">${ICON_DOWNLOAD(15)} ${esc(d.dlGithubAll)}</a>`
    const dlSub = r.formal
      ? esc(d.dlSub(r.formal))
      : r.pre ? `<span class="pill">${esc(d.testPill)}</span> ${esc(d.dlSubBeta(r.pre))}` : esc(d.dlSubUnknown)

    document.getElementById('page').innerHTML = `
      <div class="hero wrap" id="top">
        <img class="icon" src="../../../build/icon.png" alt="">
        <h1>${esc(d.title)}</h1>
        <p class="lede">${esc(d.lede)}</p>
        <div class="cta">${heroCta}</div>
        <div class="shot"><div class="chrome"><i></i><i></i><i></i></div><img src="shots/hero-${lang}.png" width="2560" height="1536" alt="${esc(d.shotHero)}"></div>
      </div>

      <section class="soft" id="features">
        <div class="wrap">
          <h2 class="sec-title">${esc(d.featTitle)}</h2>
          <p class="sec-sub">${esc(d.featSub)}</p>
        </div>
        <div class="deck" style="--n:${d.feats.length}">
          <div class="deck-pin">
            <div class="deck-copy">
              ${d.feats.map(([h, p], i) => `
                <div class="deck-text${turn(i)}"><span class="deck-n">${String(i + 1).padStart(2, '0')} / ${String(d.feats.length).padStart(2, '0')}</span><h3>${esc(h)}</h3><p>${esc(p)}</p></div>`).join('')}
            </div>
            <div class="deck-stage">
              ${d.feats.map(([, , img, alt], i) => `
                <div class="shot deck-shot${turn(i)}"><div class="chrome"><i></i><i></i><i></i></div><img src="shots/${img}-${lang}.png" width="1840" height="1035" alt="${esc(alt)}"></div>`).join('')}
            </div>
          </div>
        </div>
        <div class="wrap">
          <div class="fs-list">

  /** The current step's text and screenshot show */
  const turn = (i) => (i === feat ? ' on' : '')
  /** The deck follows the scroll: the next step each 60% of a screen, from when it pins under the header */
  function syncDeck() {
    const deck = document.querySelector('.deck')
    if (!deck || getComputedStyle(deck).display === 'none') return
    const n = deck.querySelectorAll('.deck-text').length
    const scrolled = 58 - deck.getBoundingClientRect().top
    feat = Math.min(n - 1, Math.max(0, Math.round(scrolled / (innerHeight * 0.6))))
    deck.querySelectorAll('.deck-text, .deck-shot').forEach((el) => {
      el.classList.toggle('on', [...el.parentElement.children].indexOf(el) === feat)
    })
  }
  let ticking = false
  const onScroll = () => {
    if (ticking) return
    ticking = true
    requestAnimationFrame(() => { ticking = false; syncDeck() })
  }
  addEventListener('scroll', onScroll, { passive: true })
  addEventListener('resize', onScroll)

  document.querySelectorAll('.lang button').forEach((b) => { b.onclick = () => { lang = b.dataset.lang; render(); syncDeck() } })
  // One choice of four, split over two groups so each fits on a phone-width line
  document.getElementById('demoBar').addEventListener('click', (e) => {
    const b = e.target.closest('[data-rel]')
    if (!b) return
    rel = b.dataset.rel
    document.querySelectorAll('#demoBar [data-rel]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)))
    render()
    syncDeck()
  })
  render()
  syncDeck()
