<!doctype html>
<!-- Reviewer notes: prototype-app-shell.md -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>原型 — 双栏壳与扫描态</title>
<link rel="stylesheet" href="../_shared/theme.css">
<link rel="stylesheet" href="../_shared/app-window.css">
<link rel="stylesheet" href="../_shared/app-rail.css">
<link rel="stylesheet" href="../_shared/project-side.css">
<style>
  /* app token 一律取自 _shared/theme.css(按设置原型所选的配色与明暗切换),
     本页不重定义任何一个。 */
  *{box-sizing:border-box;margin:0;font-family:-apple-system,"PingFang SC",sans-serif}
  .main{flex:1;display:flex;flex-direction:column}
  .topbar{height:44px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 16px}
  .topbar b{font-size:13px}
  .scanpill{margin-left:auto;font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:7px}
  .scanpill .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:blink 1s infinite alternate}
  @keyframes blink{to{opacity:.25}}
  .stage{flex:1;display:flex}
  .empty{margin:auto;text-align:center;color:var(--text-2);line-height:2}
  .empty .big{display:flex;justify-content:center;color:var(--text-2);opacity:.75}
</style>
<script src="../dimensions.js"></script>
<script src="../demo-dimensions.js" data-follow="language=zh,en mode theme"></script>
<script src="../manifest.js"></script>
<script src="../app-identity.js"></script>
<script src="../_shared/icons.js"></script>
</head>
<body>
<div class="app-window" data-shared-block="app-window">
  <nav class="rail" data-shared-block="app-rail" data-rail-current="projects" data-rail-projects="shell/app-shell"></nav>
  <script src="../_shared/app-rail.js"></script>
  <aside class="side" data-shared-block="project-side" data-side-state="scanning"></aside>
  <script src="../_shared/project-side.js"></script>
  <div class="main">
    <div class="topbar"><b>Agentshed</b>
      <span class="scanpill" id="pill"><span class="dot"></span><span id="pillT"></span></span>
    </div>
    <div class="stage"><div class="empty" id="stageMsg">
      <div class="big" data-icon="Inbox" data-icon-size="30"></div>
      <div>扫描完成前不显示空列表,避免"没有项目"的误导</div>
    </div></div>
  </div>
</div>
  <div data-demo-harness>
    <span class="dh-tag">Demo ·</span>
    <div class="dh-group"><span class="dh-title">扫描</span><div class="dh-opts">
      <button type="button" class="dh-opt" data-scan="scanning" aria-pressed="true">扫描态</button>
      <button type="button" class="dh-opt" data-scan="empty" aria-pressed="false">就绪空态</button>
    </div></div>
    <p class="dh-note">扫描态与就绪空态在 app 里由这次启动的扫描是否已完成决定(就绪空态 = 扫描完成、一个项目也没找到);app 内没有这个开关。</p>
  </div>
<script>
  const pill=document.getElementById('pill'),
        msg=document.getElementById('stageMsg'),bar=document.querySelector('[data-demo-harness]');
  // 中英文案。项目栏是共享件(_shared/project-side.js):扫描中画
  // 启动骨架,扫描完成后画一个项目也没有时的列表。stage 中央两句是设计说明与占位说明(批注),不在此列。
  const L={
    zh:{htmlLang:'zh-CN',scanning:'正在扫描 Claude Code / Codex…'},
    en:{htmlLang:'en',scanning:'Scanning Claude Code / Codex…'}
  };
  let lang='zh';
  let scanning=true;
  function render(){
    const t=L[lang];
    document.getElementById('pillT').textContent=t.scanning;
    if(scanning){
      pill.style.display='flex';
      msg.innerHTML='<div class="big">'+ICONS.Inbox(30)+'</div><div>扫描完成前不显示空列表,避免"没有项目"的误导</div>';
    }else{
      pill.style.display='none';
      msg.innerHTML='<div class="big">'+ICONS.Inbox(30)+'</div><div>就绪空态:引导页占位<br><span style="font-size:12px">列表有数据时,这里显示「选择一个项目」</span></div>';
    }
  }
  // 演示条「扫描」一组:条只建一次,选中项靠 aria-pressed 标出
  bar.addEventListener('click',e=>{
    const b=e.target.closest('button[data-scan]');
    if(!b||(b.dataset.scan==='scanning')===scanning) return;
    scanning=b.dataset.scan==='scanning';
    bar.querySelectorAll('[data-scan]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
    ProjectSide.setState(scanning?'scanning':'empty');render();
  });
  DemoDimensions.on('language',v=>{ lang=v; document.documentElement.lang=L[v].htmlLang; render(); });
</script>
<script>
  // Cross-prototype navigation: inside the gallery ask the parent page to switch; when opened alone, go to the file directly
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-goto]');
    if (!el) return;
    if (window.parent !== window) parent.postMessage({ type: 'proto-nav', target: el.dataset.goto }, '*');
    else if (el.dataset.gotoHref) location.href = el.dataset.gotoHref;
  });
</script>
<script src="../demo-harness.js"></script>
</body>
</html>
