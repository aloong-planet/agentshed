# The engine module (ADR-0045): one Node-API module, loaded by the scan worker, the parse workers and the main
# process. Built only through scripts/build-engine.mjs, which passes the build it belongs to; a module built any
# other way reports none, so no build of the app takes it for its own.
[package]
name = "agentshed-engine"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# The panic seam, in builds made for tests only: packaging builds without it and refuses a module that has it
test-seams = []

[dependencies]
# napi6: an object's own keys, as JSON.stringify reads them (src/exports/main_process.rs)
napi = { version = "3.16.2", features = ["napi6"] }
napi-derive = "3.7.1"
# Line splitting over each read chunk
memchr = "2.8.3"
# Antigravity CLI's conversation databases (token-stats::CON-002): SQLite compiled into the module, so every build reads
# one SQLite whatever the system has; `cache` keeps prepared statements
rusqlite = { version = "0.42.0", default-features = false, features = ["bundled", "cache"] }
# JavaScript's String(number), for the running-total key a Codex usage event is compared by
ryu-js = "1.0.3"
# Cold rollouts (.jsonl.zst), decompressed as they are read; without the legacy formats Codex never writes
zstd = { version = "0.13.5", default-features = false }

[build-dependencies]
napi-build = "2.6.0"
# build.rs refuses an exported function that would not catch a panic, reading the sources with a Rust parser
syn = { version = "3.0.10", default-features = false, features = ["full", "parsing"] }
proc-macro2 = { version = "1.0.107", default-features = false }

[profile.release]
# A panic unwinds so that the module's boundary can catch it (ADR-0045); abort would end the app
panic = "unwind"
