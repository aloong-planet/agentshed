name: Download count

# The download count's watchdog (docs/specs/download-count.md, Failure G8; ADR-0056). The count itself is the Worker's,
# which aloong-planet/infra deploys: every hour it brings stats/downloads.json up to date in the release bucket. This
# workflow holds no secret and writes nothing: every hour it reads the published file through the download host and
# fails, so that GitHub notifies, when the file shows that the count may have stopped
# (scripts/download-count-watchdog.mjs). What to do then is in docs/ops/download-count.md;
# scripts/download-count-workflow.test.mjs guards the triggers and that the workflow reads no secret.
on:
  schedule:
    # Minute 47 rather than the hour, when GitHub's scheduled runs crowd and are most often delayed
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # The R2 mirror's download host (mac-distribution::REQ-004), which serves the statistics file
  DOWNLOAD_HOST: https://dl.agentshed.aloongplanet.com

jobs:
  watch:
    name: watch the download count
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Read the statistics file
        run: node scripts/download-count-watchdog.mjs
