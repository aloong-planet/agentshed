name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push on the same branch cancels the previous unfinished run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed scopes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.scope.outputs.app }}
      site: ${{ steps.scope.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        run: node scripts/ci-scope.mjs

  repo-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ci
      - run: pnpm check:ui
      - run: pnpm check:lang
      - run: pnpm check:nul

  app-checks:
    name: Application checks
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The engine module (ADR-0045) is built from source for linux-x64 by the tests' global setup, with the toolchain
      # engine/rust-toolchain.toml pins; a module that does not build or load fails the tests
      - run: rustup toolchain install --no-self-update
        working-directory: engine
      - run: pnpm typecheck
      - run: pnpm lint:app
      - run: pnpm test
      - run: pnpm test:scripts
      - run: pnpm check:i18n

  site-checks:
    name: Website checks
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            site/pnpm-lock.yaml
      # The root supplies ESLint; the website has its own Astro dependencies and lockfile.
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: site
      - run: pnpm lint:site
      # The website test setup builds once into a fresh directory.
      - run: pnpm test:site

  # e2e drives a real Electron. It runs on ubuntu rather than macos: what e2e asserts — the whole IPC chain,
  # contract validation, render geometry — is platform-independent.
  # The macOS-specific surface (signing, notarisation, TCC permissions) was never in e2e's coverage anyway;
  # local verify and the release process guard it.
  e2e:
    name: e2e(Electron)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Electron and Chromium share the same system libraries; let playwright install them rather than
      # hand-writing apt package names
      # (which drift with the ubuntu version, e.g. libasound2 → libasound2t64)
      - run: pnpm exec playwright install-deps chromium
      # pnpm e2e builds the engine module (ADR-0045) from source before the app, with the pinned toolchain
      - run: rustup toolchain install --no-self-update
        working-directory: engine
      # Electron needs a display server; -a picks a free display number automatically
      - run: xvfb-run -a pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  ci-gate:
    name: CI gate
    needs: [changes, repo-policy, app-checks, e2e, site-checks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify selected jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci-gate.mjs

# smoke does not run in CI: scripts/smoke.sh is macOS-local only — BSD stat (-f %m), macOS process paths
# (Electron.app/Contents/MacOS/Electron) — and its value lies in scanning **the development machine's real
# ~/.claude data**
# (600MB+ of real shapes); a CI container's home is empty, so moving it there would be a degraded e2e.
# (userData has been isolated since 2026-08-04, so it no longer "runs on the real userData" — that old
# reason has lapsed;
#  migration scenarios are covered by e2e's isolated userData plus a seeded cache.)
