name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push on the same branch cancels the previous unfinished run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The fast check: feedback in seconds, so a failure does not have to wait for e2e
  checks:
    name: typecheck + unit tests + shared-piece consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # The landing page (site/) is a package of its own, with its own lockfile
          cache-dependency-path: |
            pnpm-lock.yaml
            site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Before lint: the lint's type-aware rules read the site's TypeScript through the site's tsconfig,
      # which extends Astro's and resolves the site's own packages
      - run: pnpm install --frozen-lockfile
        working-directory: site
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # The packaging asset's tests and the release workflow's: the release workflow itself runs only on a release tag
      - run: pnpm test:scripts
      # The site's type check, its unit tests and the built-site check (on a fresh build)
      - run: pnpm test:site
      - run: pnpm check:ui
      - run: pnpm check:lang
      - run: pnpm check:i18n
      - run: pnpm check:nul

  # e2e drives a real Electron. It runs on ubuntu rather than macos: what e2e asserts — the whole IPC chain,
  # contract validation, render geometry — is platform-independent.
  # The macOS-specific surface (signing, notarisation, TCC permissions) was never in e2e's coverage anyway;
  # local verify and the release process guard it.
  e2e:
    name: e2e(Electron)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Electron and Chromium share the same system libraries; let playwright install them rather than
      # hand-writing apt package names
      # (which drift with the ubuntu version, e.g. libasound2 → libasound2t64)
      - run: pnpm exec playwright install-deps chromium
      # Throwaway branch, never merged: the cases #227, #247, #254 and #299 changed, each run repeatedly on this runner.
      # Every step runs whatever the one before it did, so each issue gets its own result.
      - run: pnpm exec electron-vite build
      - name: '#247 the Codex-compressed session case, 40 times'
        if: ${{ !cancelled() }}
        run: xvfb-run -a pnpm exec playwright test e2e/app.spec.ts -g "Codex compresses while cached" --repeat-each=40
      - name: '#227 the startup-skeleton cases, 20 times'
        if: ${{ !cancelled() }}
        run: xvfb-run -a pnpm exec playwright test e2e/app.spec.ts -g "startup skeleton" --repeat-each=20
      - name: '#299 the restore case, 10 times'
        if: ${{ !cancelled() }}
        run: xvfb-run -a pnpm exec playwright test e2e/startup-restore.spec.ts -g "restart restores viewed project" --repeat-each=10
      - name: '#254 every app-update, menu-check and settings-update case, 10 times'
        if: ${{ !cancelled() }}
        run: xvfb-run -a pnpm exec playwright test e2e/app-update.spec.ts e2e/menu-check-updates.spec.ts e2e/settings-updates.spec.ts --repeat-each=10
      - name: '#254 the removed-language case and #227 the bounded teardown, 10 times'
        if: ${{ !cancelled() }}
        run: xvfb-run -a pnpm exec playwright test e2e/app.spec.ts e2e/close-app.spec.ts -g "removed language|the bound" --repeat-each=10
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

# smoke does not run in CI: scripts/smoke.sh is macOS-local only — BSD stat (-f %m), macOS process paths
# (Electron.app/Contents/MacOS/Electron) — and its value lies in scanning **the development machine's real
# ~/.claude data**
# (600MB+ of real shapes); a CI container's home is empty, so moving it there would be a degraded e2e.
# (userData has been isolated since 2026-08-04, so it no longer "runs on the real userData" — that old
# reason has lapsed;
#  migration scenarios are covered by e2e's isolated userData plus a seeded cache.)
